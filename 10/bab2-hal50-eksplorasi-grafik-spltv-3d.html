      const App = () => {

        const [eq2, setEq2] = useState({ a: 1, b: -1, c: 1, d: 2 });

        const [visiblePlanes, setVisiblePlanes] = useState({
          p1: true,

        const [showSolution, setShowSolution] = useState(true);
        const [showCoordinates, setShowCoordinates] = useState(true);

          const { a: a1, b: b1, c: c1, d: d1 } = eq1;
          const { a: a2, b: b2, c: c2, d: d2 } = eq2;
          const { a: a3, b: b3, c: c3, d: d3 } = eq3;

          const D =
            a1 * (b2 * c3 - b3 * c2) -
            b1 * (a2 * c3 - a3 * c2) +
            c1 * (a2 * b3 - a3 * b2);

          const Dx =
            d1 * (b2 * c3 - b3 * c2) -
            b1 * (d2 * c3 - d3 * c2) +
            c1 * (d2 * b3 - d3 * b2);
          const Dy =
            a1 * (d2 * c3 - d3 * c2) -
            d1 * (a2 * c3 - a3 * c2) +
            c1 * (a2 * d3 - a3 * d2);
          const Dz =
            a1 * (b2 * d3 - b3 * d2) -
            b1 * (a2 * d3 - a3 * d2) +
            d1 * (a2 * b3 - a3 * b2);

          if (Math.abs(D) < 0.0001) {
            const isEq1Eq2Proportional =
              Math.abs(a1 * b2 - a2 * b1) < 0.0001 &&
              Math.abs(b1 * c2 - b2 * c1) < 0.0001 &&
              Math.abs(a1 * c2 - a2 * c1) < 0.0001;

            const isEq1Eq3Proportional =
              Math.abs(a1 * b3 - a3 * b1) < 0.0001 &&
              Math.abs(b1 * c3 - b3 * c1) < 0.0001 &&
              Math.abs(a1 * c3 - a3 * c1) < 0.0001;

              isEq1Eq3Proportional &&
              Math.abs(a1 * d2 - a2 * d1) < 0.0001 &&
              Math.abs(a1 * d3 - a3 * d1) < 0.0001;

              : { type: "NONE", message: "Tidak memiliki solusi." };

            D,
            Dx,
            Dy,
            Dz,
            x: Dx / D,
            y: Dy / D,
            z: Dz / D,

            if (norm < 0.0001) return null;

            // Satu titik pada bidang: p = d*n / |n|^2.
            const p = {
              x: (eq.d * n.x) / (norm * norm),
              y: (eq.d * n.y) / (norm * norm),
              z: (eq.d * n.z) / (norm * norm),

            // dua vektor basis yang tegak lurus terhadap normal. Cara ini juga
            // membuat bidang seperti x = konstanta tetap dapat divisualisasikan.
            const ref =
              Math.abs(n.x) < 0.8 * norm
                ? { x: 1, y: 0, z: 0 }
                : { x: 0, y: 1, z: 0 };
            const cross = (u, v) => ({
              x: u.y * v.z - u.z * v.y,
              y: u.z * v.x - u.x * v.z,
              z: u.x * v.y - u.y * v.x,
            });
            const normalize = (v) => {
              const m = Math.hypot(v.x, v.y, v.z);
              return { x: v.x / m, y: v.y / m, z: v.z / m };
            };

            const u = normalize(cross(n, ref));
            const v = normalize(cross(n, u));

            return gridRange.map((s) =>
              gridRange.map((t) => ({
                x: p.x + s * u.x + t * v.x,
                y: p.y + s * u.y + t * v.y,
                z: p.z + s * u.z + t * v.z,
              })),
            );
          };

          const makePlane = (meta, opacity = 0.48) => {
            const plane = createPlaneGrid(meta.eq);
            if (!plane) return null;
            return {
              type: "surface",
              x: plane.map((row) => row.map((p) => p.x)),
              y: plane.map((row) => row.map((p) => p.y)),
              z: plane.map((row) => row.map((p) => p.z)),
              opacity,
              name: meta.label,
              hovertemplate: `${meta.label}<br>x=%{x:.2f}<br>y=%{y:.2f}<br>z=%{z:.2f}<extra></extra>`,
              colorscale: [
                [0, meta.color],
                [1, meta.color],
              ],
              showscale: false,
              contours: {
                x: { show: false },
                y: { show: false },
                z: { show: false },
              },
            };
          };

          const data = planeMeta
            .filter((meta) => visiblePlanes[meta.key])
            .map((meta) => makePlane(meta))
            .filter(Boolean);

          if (
            calculation.type === "UNIQUE" &&
            showSolution &&
            visibleCount === 3
          ) {
            const { x, y, z } = calculation;

            if (showCoordinates) {
              data.push(
                {
                  type: "scatter3d",
                  mode: "lines",
                  x: [x, x],
                  y: [y, y],
                  z: [0, z],
                  line: { color: "#F2A51A", width: 4, dash: "dash" },
                  hoverinfo: "skip",
                  showlegend: false,
                  name: "Proyeksi Z",
                },
                {
                  type: "scatter3d",
                  mode: "lines",
                  x: [x, x],
                  y: [0, y],
                  z: [0, 0],
                  line: { color: "#F2A51A", width: 3, dash: "dot" },
                  hoverinfo: "skip",
                  showlegend: false,
                  name: "Proyeksi Y",
                },
                {
                  type: "scatter3d",
                  mode: "lines",
                  x: [0, x],
                  y: [0, 0],
                  z: [0, 0],
                  line: { color: "#F2A51A", width: 3, dash: "dot" },
                  hoverinfo: "skip",
                  showlegend: false,
                  name: "Proyeksi X",
                },
                {
                  type: "scatter3d",
                  mode: "markers+text",
                  x: [x],
                  y: [0],
                  z: [0],
                  marker: { size: 5, color: "#F2A51A" },
                  text: [`x = ${x.toFixed(2)}`],
                  textposition: "bottom center",
                  textfont: { size: 11, color: "#A36B00" },
                  hoverinfo: "skip",
                  showlegend: false,
                },
                {
                  type: "scatter3d",
                  mode: "markers+text",
                  x: [x],
                  y: [y],
                  z: [0],
                  marker: { size: 5, color: "#F2A51A" },
                  text: [`y = ${y.toFixed(2)}`],
                  textposition: "middle left",
                  textfont: { size: 11, color: "#A36B00" },
                  hoverinfo: "skip",
                  showlegend: false,
                },
                {
                  type: "scatter3d",
                  mode: "markers+text",
                  x: [x],
                  y: [y],
                  z: [z],
                  marker: {
                    size: 12,
                    color: "#F2A51A",
                    symbol: "diamond",
                    line: { color: "#ffffff", width: 2 },
                  },
                  text: [
                    `Solusi (${x.toFixed(2)}, ${y.toFixed(2)}, ${z.toFixed(2)})`,
                  ],
                  textposition: "top center",
                  textfont: { size: 12, color: "#8C5C00" },
                  name: "Titik Solusi",
                  hovertemplate:
                    "Titik solusi<br>(%{x:.2f}, %{y:.2f}, %{z:.2f})<extra></extra>",
                },
              );
            } else {
              data.push({
                type: "scatter3d",
                mode: "markers+text",
                x: [x],
                y: [y],
                z: [z],
                marker: {
                  size: 12,
                  color: "#F2A51A",
                  symbol: "diamond",
                  line: { color: "#fff", width: 2 },
                },
                text: [
                  `Solusi (${x.toFixed(2)}, ${y.toFixed(2)}, ${z.toFixed(2)})`,
                ],
                textposition: "top center",
                textfont: { size: 12, color: "#8C5C00" },
                name: "Titik Solusi",
              });
            }
          }

          const layout = {
            autosize: true,
            margin: { l: 0, r: 0, b: 0, t: 0 },
            paper_bgcolor: "#ffffff",
            plot_bgcolor: "#FFFFF",
            showlegend: false,
            scene: {
              bgcolor: "#FFFFF",
              aspectmode: "cube",
              xaxis: {
                title: { text: "X", font: { size: 13 } },
                range: [-8, 8],
                zeroline: true,
                showspikes: false,
                gridcolor: "#D0D5DA",
              },
              yaxis: {
                title: { text: "Y", font: { size: 13 } },
                range: [-8, 8],
                zeroline: true,
                showspikes: false,
                gridcolor: "#D0D5DA",
              },
              zaxis: {
                title: { text: "Z", font: { size: 13 } },
                range: [-8, 8],
                zeroline: true,
                showspikes: false,
                gridcolor: "#D0D5DA",
              },
              camera: { eye: { x: 1.55, y: 1.55, z: 1.25 } },
            },
          };

          Plotly.react(plotRef.current, data, layout, {
            responsive: true,
            scrollZoom: true,
            displayModeBar: true,
            displaylogo: false,
            modeBarButtonsToRemove: ["select2d", "lasso2d", "autoScale2d"],
            doubleClick: "reset",
          });

          return () => {
            if (plotRef.current) Plotly.purge(plotRef.current);
          };
        }, [
          eq1,
          eq2,
          eq3,
          calculation,
          visiblePlanes,
          showSolution,
          showCoordinates,
          visibleCount,
        ]);

        const handleUniqueClick = () => {
          setActivePreset("unique");
          const preset = uniquePresets[uniqueIndex];
          setEq1({ a: preset.a1, b: preset.b1, c: preset.c1, d: preset.d1 });
          setEq2({ a: preset.a2, b: preset.b2, c: preset.c2, d: preset.d2 });
          setEq3({ a: preset.a3, b: preset.b3, c: preset.c3, d: preset.d3 });
          setVisiblePlanes({ p1: true, p2: true, p3: true });
          setShowSolution(true);
          setUniqueIndex((prev) => (prev + 1) % uniquePresets.length);
        };

        const handleNoSolutionClick = () => {
          setActivePreset("parallel");
          const preset = noSolutionPresets[noSolutionIndex];
          setEq1({ a: preset.a1, b: preset.b1, c: preset.c1, d: preset.d1 });
          setEq2({ a: preset.a2, b: preset.b2, c: preset.c2, d: preset.d2 });
          setEq3({ a: preset.a3, b: preset.b3, c: preset.c3, d: preset.d3 });
          setVisiblePlanes({ p1: true, p2: true, p3: true });
          setShowSolution(true);
          setNoSolutionIndex((prev) => (prev + 1) % noSolutionPresets.length);
        };

        const handleInfiniteClick = () => {
          setActivePreset("infinite");
          const preset = infinitePresets[infiniteIndex];
          setEq1({ a: preset.a1, b: preset.b1, c: preset.c1, d: preset.d1 });
          setEq2({ a: preset.a2, b: preset.b2, c: preset.c2, d: preset.d2 });
          setEq3({ a: preset.a3, b: preset.b3, c: preset.c3, d: preset.d3 });
          setVisiblePlanes({ p1: true, p2: true, p3: true });
          setShowSolution(true);
          setInfiniteIndex((prev) => (prev + 1) % infinitePresets.length);
        };

        const equationText = (eq) =>
          `${eq.a}x ${eq.b >= 0 ? `+ ${eq.b}` : `− ${Math.abs(eq.b)}`}y ${eq.c >= 0 ? `+ ${eq.c}` : `− ${Math.abs(eq.c)}`}z = ${eq.d}`;

        // ===== CARD PERSAMAAN (P1 / P2 / P3) =====
        // Cari: "CARD PERSAMAAN" untuk mengubah border, warna, padding, dll.
        const renderEqInput = (eq, setEq, meta) => (
          <div
            id={`equation-card-${meta.key}`}
            data-plane={meta.key}
            className={`relative overflow-hidden p-3 rounded-xl border-2 shadow-[0_3px_0_#cbd5e1] transition-all ${
              meta.key === "p1"
                ? "bg-gradient-to-br from-sky-50 to-white border-sky-200"
                : meta.key === "p2"
                  ? "bg-gradient-to-br from-rose-50 to-white border-rose-200"
                  : "bg-gradient-to-br from-amber-50 to-white border-amber-200"
            } ${visiblePlanes[meta.key] ? "" : "opacity-[0.55] grayscale-[0.2]"}`}
          >
            <div className="flex items-center justify-between gap-2 mb-2">
              <div className="flex items-center gap-2 min-w-0">
                <span
                  className={`w-3 h-3 rounded-full shrink-0 ring-1 ring-black/10 ${
                    meta.key === "p1"
                      ? "bg-sky-600"
                      : meta.key === "p2"
                        ? "bg-rose-600"
                        : "bg-amber-500"
                  }`}
                ></span>
                <span className="font-bold text-xs">{meta.label}</span>
              </div>
              <label className="flex items-center gap-1.5 text-[10px] font-bold text-slate-600 cursor-pointer">
                <input
                  type="checkbox"
                  checked={visiblePlanes[meta.key]}
                  onChange={() =>
                    setVisiblePlanes((prev) => ({
                      ...prev,
                      [meta.key]: !prev[meta.key],
                    }))
                  }
                  className="accent-sky-600 w-3.5 h-3.5 cursor-pointer"
                />
                Tampilkan
              </label>
            </div>
            <div
              className="font-serif text-[11px] text-slate-600 mb-2 truncate"
              title={equationText(eq)}
            >
              {equationText(eq)}
            </div>
            <div className="grid grid-cols-4 gap-1.5 text-center text-xs">
              {["a", "b", "c", "d"].map((varName) => (
                <div key={varName} className="flex flex-col">
                  <label className="font-semibold text-slate-600 uppercase text-[10px] mb-0.5">
                    {varName}
                  </label>
                  <input
                    type="number"
                    value={eq[varName]}
                    onChange={(e) => {
                      setEq({
                        ...eq,
                        [varName]: parseFloat(e.target.value) || 0,
                      });
                      setActivePreset(null);
                    }}
                    className="w-full text-center border-2 border-slate-200 bg-white rounded-lg p-1.5 font-bold text-xs text-slate-800 shadow-inner focus:border-sky-500 focus:ring-2 focus:ring-sky-100 focus:outline-none transition"
                  />
                </div>
              ))}
            </div>
          </div>
        );

        const explanation =
          visibleCount === 1
            ? "Satu bidang mewakili satu persamaan. Setiap titik pada bidang memenuhi persamaan tersebut."
            : visibleCount === 2
              ? "Dua bidang sedang dibandingkan. Jika keduanya tidak sejajar, perpotongannya membentuk sebuah garis."
              : calculation.type === "UNIQUE"
                ? "Tiga bidang bertemu di satu titik. Titik tersebut memenuhi ketiga persamaan sekaligus, sehingga menjadi solusi SPLTV."
                : calculation.type === "NONE"
                  ? "Ketiga bidang tidak mempunyai satu titik yang memenuhi semuanya. Sistem ini tidak memiliki solusi."
                  : "Ketiga persamaan saling bergantung, sehingga terdapat tak hingga banyak solusi.";

        return (
          // ===== CONTAINER UTAMA SIMULASI =====
          // Cari: "CONTAINER UTAMA SIMULASI" untuk mengubah ukuran/background/border seluruh aplikasi.
          <div
            id="main-simulation-container"
            className="h-screen bg-slate-200 p-2 md:p-3 flex flex-col overflow-hidden"
          >
            {/* ===== FRAME PUTIH UTAMA ===== */}
            <div
              id="main-white-frame"
              className="max-w-7xl mx-auto w-full h-full bg-white border-2 border-slate-300 shadow-[0_4px_0_#94a3b8] overflow-hidden flex flex-col"
            >
              {/* ===== HEADER ===== */}
              <header className="relative overflow-hidden px-5 py-4 flex flex-row justify-between items-center gap-3 shrink-0 bg-black border-b-2 border-slate-700">
                {/* ===== LOGO ===== */}
                {/* Cari: "LOGO" untuk mengubah ukuran/posisi logo. Tidak ada ring/background tambahan. */}
                <div
                  id="logo-area"
                  className="relative z-10 flex items-center gap-2.5"
                >
                  <img
                    id="logo-yudhistira"
                    src={LOGO_B64}
                    alt="Logo Yudhistira"
                    className="w-14 h-14 object-contain shrink-0"
                  />
                  <div>
                    <h1
                      className="text-4xl text-white md:text-4xl tracking-tight"
                      style={{ fontFamily: "'Londrina Solid', sans-serif" }}
                    >
                      Simulasi SPLTV 3D
                    </h1>
                  </div>
                </div>
                <div className="relative z-10 flex flex-wrap gap-1.5 justify-end">
                  <button
                    onClick={handleUniqueClick}
                    className="group relative overflow-hidden px-2.5 py-1.5 rounded-lg font-bold text-[11px] border-2 border-sky-500/70 bg-sky-600 text-white shadow-[0_3px_0_#075985,0_6px_12px_rgba(0,0,0,0.18)] transition-all duration-150 hover:-translate-y-0.5 hover:bg-sky-500 hover:shadow-[0_4px_0_#075985,0_8px_14px_rgba(0,0,0,0.20)] active:translate-y-0.5 active:shadow-[0_1px_0_#075985] focus:outline-none focus:ring-2 focus:ring-sky-300/80"
                  >
                    Contoh Solusi Unik
                  </button>
                  <button
                    onClick={handleInfiniteClick}
                    className="group relative overflow-hidden px-2.5 py-1.5 rounded-lg font-bold text-[11px] border-2 border-amber-400 bg-amber-400 text-slate-950 shadow-[0_3px_0_#b45309,0_6px_12px_rgba(0,0,0,0.18)] transition-all duration-150 hover:-translate-y-0.5 hover:bg-amber-300 hover:shadow-[0_4px_0_#b45309,0_8px_14px_rgba(0,0,0,0.20)] active:translate-y-0.5 active:shadow-[0_1px_0_#b45309] focus:outline-none focus:ring-2 focus:ring-amber-200/80"
                  >
                    Contoh Solusi Tak Hingga
                  </button>
                  <button
                    onClick={handleNoSolutionClick}
                    className="group relative overflow-hidden px-2.5 py-1.5 rounded-lg font-bold text-[11px] border-2 border-rose-500 bg-rose-600 text-white shadow-[0_3px_0_#9f1239,0_6px_12px_rgba(0,0,0,0.18)] transition-all duration-150 hover:-translate-y-0.5 hover:bg-rose-500 hover:shadow-[0_4px_0_#9f1239,0_8px_14px_rgba(0,0,0,0.20)] active:translate-y-0.5 active:shadow-[0_1px_0_#9f1239] focus:outline-none focus:ring-2 focus:ring-rose-300/80"
                  >
                    Contoh Tanpa Solusi
                  </button>
                </div>
              </header>

              {/* ===== GARIS MERAH DI BAWAH HEADER ===== */}
              {/* Warna disamakan dengan tombol "Contoh Tanpa Solusi" (bg-rose-600). */}
              <div
                id="header-red-divider"
                className="h-1.5 w-full shrink-0 bg-blue-500 relative z-20"
              ></div>

              {/* ===== AREA KONTEN / WORKSPACE ===== */}
              {/* Cari: "AREA KONTEN / WORKSPACE" untuk mengubah background abu-abu dan jarak antar kolom. */}
              <div
                id="workspace-container"
                className="bg-slate-100 p-3 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-3 overflow-hidden items-stretch"
              >
                {/* ===== SIDEBAR KIRI ===== */}
                <div
                  id="left-sidebar"
                  className="lg:col-span-4 flex flex-col gap-2.5 overflow-y-auto pr-1"
                >
                  {/* ===== CONTAINER INPUT KOEFISIEN ===== */}
                  {/* Cari: "CONTAINER INPUT KOEFISIEN" untuk mengubah kotak putih yang membungkus P1-P3. */}
                  <div
                    id="input-coefficients-container"
                    className="bg-white p-3 border-2 border-slate-200 shadow-[0_3px_0_#cbd5e1] space-y-2"
                  >
                    <div className="flex items-center justify-between border-b border-slate-200 pb-1.5">
                      <h2 className="text-xs font-black tracking-wide uppercase">
                        Input Koefisien Persamaan
                      </h2>
                      <span className="text-[10px] text-slate-500">
                        ☑ = tampil
                      </span>
                    </div>
                    {renderEqInput(eq1, setEq1, planeMeta[0])}
                    {renderEqInput(eq2, setEq2, planeMeta[1])}
                    {renderEqInput(eq3, setEq3, planeMeta[2])}
                  </div>
                  {/* ===== CONTAINER PENGATURAN TAMPILAN ===== */}
                  <div
                    id="display-settings-container"
                    className="bg-white p-3 border-2 border-slate-200 shadow-[0_3px_0_#cbd5e1]"
                  >
                    <div className="mt-0 pt-0 space-y-1.5">
                      <label className="flex items-center justify-between text-[10px] font-semibold text-slate-600 cursor-pointer">
                        <span>Tampilkan titik solusi</span>
                        <input
                          type="checkbox"
                          checked={showSolution}
                          onChange={(e) => setShowSolution(e.target.checked)}
                          className="accent-amber-500 w-3.5 h-3.5 cursor-pointer"
                        />
                      </label>
                      <label className="flex items-center justify-between text-[10px] font-semibold text-slate-600 cursor-pointer">
                        <span>Tampilkan proyeksi koordinat</span>
                        <input
                          type="checkbox"
                          checked={showCoordinates}
                          onChange={(e) => setShowCoordinates(e.target.checked)}
                          className="accent-amber-500 w-3.5 h-3.5 cursor-pointer"
                        />
                      </label>
                    </div>
                  </div>

                  {/* ===== CONTAINER PENJELASAN ===== */}
                  <div
                    id="explanation-container"
                    className="p-3 bg-sky-50 border-2 border-sky-200 shadow-[0_3px_0_#bae6fd]"
                  >
                    <div className="flex items-center gap-2 mb-1">
                      <span className="text-sm">💡</span>
                      <h2 className="text-xs font-bold text-sky-900">
                        Apa yang sedang dilihat?
                      </h2>
                    </div>
                    <p className="text-[11px] leading-relaxed text-sky-800">
                      {explanation}
                    </p>
                  </div>

                  {/* ===== CONTAINER HASIL & SOLUSI ===== */}
                  <div
                    id="solution-container"
                    className="bg-white p-3 border-2 border-slate-200 shadow-[0_3px_0_#cbd5e1]"
                  >
                    <h2 className="text-xs font-black tracking-wide uppercase border-b border-slate-200 pb-1.5 mb-2">
                      Hasil & Solusi
                    </h2>
                    {calculation.type === "UNIQUE" ? (
                      <div className="space-y-2">
                        <div className="p-2 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-800 font-bold text-center text-xs shadow-sm">
                          Memiliki 1 Solusi Unik (Titik Potong)
                        </div>
                        <div className="grid grid-cols-3 gap-1.5 text-center">
                          {[
                            ["X", calculation.x],
                            ["Y", calculation.y],
                            ["Z", calculation.z],
                          ].map(([axis, value]) => (
                            <div
                              key={axis}
                              className="p-2 bg-slate-50 rounded-lg border border-slate-200"
                            >
                              <span className="block text-[10px] text-slate-500 font-bold">
                                {axis}
                              </span>
                              <span className="text-base font-black text-slate-800 font-serif">
                                {value.toFixed(2)}
                              </span>
                            </div>
                          ))}
                        </div>
                        <div className="text-[10px] text-slate-600 font-mono text-center">
                          Determinan Utama (D) = {calculation.D.toFixed(2)}
                        </div>
                      </div>
                    ) : (
                      <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-900 text-xs font-medium leading-relaxed shadow-sm">
                        {calculation.message}
                      </div>
                    )}
                  </div>
                </div>

                {/* ===== CONTAINER GRAFIK 3D ===== */}
                {/* Cari: "CONTAINER GRAFIK 3D" untuk mengubah kotak besar area grafik. */}
                <div
                  id="graph-container"
                  className="lg:col-span-8 bg-white p-2 md:p-3 border-2 border-slate-200 shadow-[0_4px_0_#cbd5e1] flex flex-col overflow-hidden min-h-[58vh] lg:min-h-0"
                >
                  <div className="w-full flex justify-between items-center mb-1 px-1 shrink-0 gap-2">
                    <div>
                      <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500">
                        Grafik 3D Interaktif
                      </span>
                      <span className="ml-2 text-[10px] text-slate-500">
                        {visibleCount} bidang tampil
                      </span>
                    </div>
                    <span className="text-[10px] text-slate-500 hidden sm:block">
                      Putar • zoom • geser
                    </span>
                    <span className="text-[10px] text-slate-500 sm:hidden">
                      Geser 1 jari • cubit untuk zoom
                    </span>
                  </div>
                  <div className="flex flex-wrap gap-1.5 px-1 pb-1">
                    {planeMeta.map((meta) => (
                      <span
                        key={meta.key}
                        className={`inline-flex items-center gap-1.5 px-2 py-1 rounded-full text-[10px] font-bold ${visiblePlanes[meta.key] ? "bg-white text-slate-700 border border-slate-200 shadow-sm" : "bg-slate-100 text-slate-400 border border-slate-200 line-through"}`}
                      >
                        <span
                          className={`w-2 h-2 rounded-full ring-1 ring-black/10 ${
                            meta.key === "p1"
                              ? "bg-sky-600"
                              : meta.key === "p2"
                                ? "bg-rose-600"
                                : "bg-amber-500"
                          } ${visiblePlanes[meta.key] ? "" : "opacity-[0.35]"}`}
                        ></span>
                        {meta.short}
                      </span>
                    ))}
                    {calculation.type === "UNIQUE" &&
                      visibleCount === 3 &&
                      showSolution && (
                        <span className="inline-flex items-center gap-1.5 px-2 py-1 rounded-full text-[10px] font-bold bg-amber-50 text-amber-800 border border-amber-200">
                          <span>◆</span> Titik solusi
                        </span>
                      )}
                  </div>
                  <div
                    ref={plotRef}
                    id="plot-container"
                    className="w-full flex-grow overflow-hidden min-h-[52vh] lg:min-h-[400px] touch-none"
                  ></div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
