  <script>

      let currentIdx = 0;

      /* ===== Visual scene helpers — polished illustrated style ===== */
      function roundedRect(ctx, x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
      }

      function drawPerson(ctx, x, y, scale = 1, pose = "standing") {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        // soft shadow
        ctx.fillStyle = "rgba(15,23,42,.14)";
        ctx.beginPath();
        ctx.ellipse(0, 2, 18, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // legs
        ctx.strokeStyle = "#080808";
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(-4, -27); ctx.lineTo(-7, -5);
        ctx.moveTo(4, -27); ctx.lineTo(8, -5);
        ctx.stroke();

        // shoes
        ctx.strokeStyle = "#080808";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-8, -5); ctx.lineTo(-14, -4);
        ctx.moveTo(8, -5); ctx.lineTo(14, -4);
        ctx.stroke();

        // body / shirt
        ctx.fillStyle = "#1F4FA3";
        roundedRect(ctx, -11, -53, 22, 27, 6);
        ctx.fill();

        // shirt highlight
        ctx.fillStyle = "rgba(255,255,255,.22)";
        roundedRect(ctx, -7, -49, 5, 18, 2);
        ctx.fill();

        // arms
        ctx.strokeStyle = "#f2b58d";
        ctx.lineWidth = 5;
        ctx.beginPath();
        if (pose === "look") {
          ctx.moveTo(-9, -48); ctx.lineTo(-18, -38);
          ctx.moveTo(9, -48); ctx.lineTo(18, -43);
        } else {
          ctx.moveTo(-9, -48); ctx.lineTo(-16, -34);
          ctx.moveTo(9, -48); ctx.lineTo(16, -34);
        }
        ctx.stroke();

        // neck
        ctx.fillStyle = "#f2b58d";
        ctx.fillRect(-4, -58, 8, 8);

        // head
        ctx.beginPath();
        ctx.arc(0, -68, 11, 0, Math.PI * 2);
        ctx.fill();

        // hair
        ctx.fillStyle = "#720019";
        ctx.beginPath();
        ctx.arc(0, -71, 11, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-7, -69, 5, 3.5, 5.6);
        ctx.fill();

        // face detail
        ctx.fillStyle = "#080808";
        ctx.beginPath();
        ctx.arc(4, -68, 1.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawTree(ctx, x, y, h) {
        ctx.save();
        const trunkH = Math.max(45, h * 5.2);
        const topY = y - trunkH;

        // ground shadow
        ctx.fillStyle = "rgba(15,23,42,.13)";
        ctx.beginPath();
        ctx.ellipse(x, y + 2, 34, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // trunk with taper
        ctx.fillStyle = "#7A4B32";
        ctx.beginPath();
        ctx.moveTo(x - 10, y);
        ctx.lineTo(x - 7, topY + 22);
        ctx.lineTo(x + 7, topY + 22);
        ctx.lineTo(x + 11, y);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#A86A45";
        ctx.beginPath();
        ctx.moveTo(x - 2, y);
        ctx.lineTo(x, topY + 24);
        ctx.lineTo(x + 7, topY + 23);
        ctx.lineTo(x + 6, y);
        ctx.closePath();
        ctx.fill();

        // branches
        ctx.strokeStyle = "#74452f";
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(x, topY + 30); ctx.lineTo(x - 18, topY + 10);
        ctx.moveTo(x + 2, topY + 28); ctx.lineTo(x + 18, topY + 8);
        ctx.stroke();

        // foliage clusters
        const blobs = [
          [x, topY + 2, 34, "#2f8f46"],
          [x - 25, topY + 18, 25, "#3fa653"],
          [x + 25, topY + 18, 26, "#348f45"],
          [x - 10, topY - 20, 25, "#4caf50"],
          [x + 12, topY - 17, 26, "#3d9d4b"],
          [x, topY - 34, 19, "#58b957"],
        ];
        blobs.forEach(([bx, by, r, c]) => {
          ctx.fillStyle = c;
          ctx.beginPath();
          ctx.arc(bx, by, r, 0, Math.PI * 2);
          ctx.fill();
        });

        // leaf highlights
        ctx.fillStyle = "rgba(255,255,255,.18)";
        [[x-16,topY-18],[x+12,topY-29],[x+27,topY+10]].forEach(([bx,by]) => {
          ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI*2); ctx.fill();
        });
        ctx.restore();
      }

      function drawFlag(ctx, x, y) {
        // pole cap
        ctx.fillStyle = "#f6c945";
        ctx.beginPath(); ctx.arc(x, y + 3, 4, 0, Math.PI * 2); ctx.fill();

        // flag pole
        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x, y + 68); ctx.stroke();

        // red-white flag
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.moveTo(x + 2, y + 6); ctx.lineTo(x + 38, y + 6);
        ctx.lineTo(x + 32, y + 18); ctx.lineTo(x + 2, y + 18);
        ctx.closePath(); ctx.fill();

        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.moveTo(x + 2, y + 18); ctx.lineTo(x + 32, y + 18);
        ctx.lineTo(x + 38, y + 30); ctx.lineTo(x + 2, y + 30);
        ctx.closePath(); ctx.fill();

        ctx.strokeStyle = "rgba(15,23,42,.15)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      function drawBoat(ctx, x, y) {
        ctx.save();
        ctx.translate(x, y);
        // water
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();

          ctx.quadraticCurveTo(14, 20 + i * 5, 36 + i * 5, 25 + i * 5);
          ctx.stroke();
        }
        // hull
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.moveTo(0, 10); ctx.lineTo(54, 10);
        ctx.lineTo(45, 28); ctx.lineTo(10, 28);

        // tiny flag

      function drawLadder(ctx, x1, y1, x2, y2) {
        ctx.save();
        ctx.strokeStyle = "#b7791f";
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();

        const dx = x2 - x1, dy = y2 - y1;
        const len = Math.hypot(dx, dy);
        const nx = -dy / len, ny = dx / len;
        const offset = 8;
        ctx.beginPath();
        ctx.moveTo(x1 + nx*offset, y1 + ny*offset);
        ctx.lineTo(x2 + nx*offset, y2 + ny*offset);
        ctx.moveTo(x1 - nx*offset, y1 - ny*offset);
        ctx.lineTo(x2 - nx*offset, y2 - ny*offset);
        ctx.stroke();

        ctx.lineWidth = 3;
        const rungs = Math.max(4, Math.floor(len / 24));
        for (let i = 1; i < rungs; i++) {
          const t = i / rungs;
          const cx = x1 + dx*t, cy = y1 + dy*t;
          ctx.beginPath();
          ctx.moveTo(cx - nx*offset, cy - ny*offset);
          ctx.lineTo(cx + nx*offset, cy + ny*offset);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawCliff(ctx, x, y, w, h) {
        ctx.save();
        // top grass
        ctx.fillStyle = "#6aa84f";
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + w, y);
        ctx.lineTo(x + w - 8, y + 10);
        ctx.lineTo(x + 15, y + 10);
        ctx.closePath(); ctx.fill();

        // rock body
        const grad = ctx.createLinearGradient(x, y, x+w, y);
        grad.addColorStop(0, "#64748b");
        grad.addColorStop(.5, "#7c8796");
        grad.addColorStop(1, "#475569");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(x + 10, y + 7);
        ctx.lineTo(x + w, y + 7);
        ctx.lineTo(x + w, y + h);
        ctx.lineTo(x + 25, y + h);
        ctx.lineTo(x + 18, y + h - 28);
        ctx.lineTo(x + 5, y + h - 42);
        ctx.closePath(); ctx.fill();

        // rock facets
        ctx.fillStyle = "rgba(255,255,255,.12)";
        ctx.beginPath();
        ctx.moveTo(x+25,y+20); ctx.lineTo(x+65,y+10); ctx.lineTo(x+52,y+h-20); ctx.lineTo(x+32,y+h-35); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "rgba(15,23,42,.14)";
        ctx.beginPath();
        ctx.moveTo(x+w-40,y+15); ctx.lineTo(x+w-8,y+10); ctx.lineTo(x+w-8,y+h); ctx.lineTo(x+w-48,y+h-20); ctx.closePath(); ctx.fill();

        ctx.restore();
      }

      function init() {
        const navButtons = document.getElementById("navButtons");
        problems.forEach((p, idx) => {
          let btn = document.createElement("button");
          btn.innerText = `Soal ${p.id}`;
          btn.className =
            "rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-black text-ink shadow-sm transition-all hover:-translate-y-0.5 hover:bg-yellow focus:outline-none";
          if (idx === 0) {
            btn.classList.remove("bg-white");
            btn.classList.add("bg-maroon", "text-white");
          }
          btn.onclick = () => selectProblem(idx);
          navButtons.appendChild(btn);
        });
        selectProblem(0);
      }

      function selectProblem(index) {
        currentIdx = index;
        document
          .querySelectorAll(".nav-buttons button")
          .forEach((b, i) => {
            b.classList.remove("bg-maroon", "text-white");
            b.classList.add("bg-white", "text-ink");
            if (i === index) {
              b.classList.remove("bg-white", "text-ink");
              b.classList.add("bg-maroon", "text-white");
            }
          });
        document.getElementById("resultBox").style.display = "none";
        renderControlPanel();
        updateSimulation();
      }

      function renderControlPanel() {
        let p = problems[currentIdx];
        updateDescription();
        let panel = document.getElementById("controlPanel");
        panel.innerHTML = `
          <div class="mb-1 flex items-center gap-2">
            <span class="text-sm font-black uppercase tracking-wider text-ink">
              Kontrol Parameter
            </span>
          </div>
        `;
        for (let key in p.params) {
          let div = document.createElement("div");
          div.className =
            "rounded-lg border border-slate-300 bg-white p-3 shadow-sm";
          div.innerHTML = `
            <label class="mb-1.5 block text-xs font-black uppercase tracking-wide text-ink">${p.labels[key]}</label>
            <input
              type="number"
              step="0.1"
              value="${p.params[key]}"
              oninput="updateParam('${key}', this.value)"
              class="w-full rounded-md border-2 border-[#B8B09F] bg-cream px-3 py-2 text-sm font-bold text-ink outline-none transition focus:border-teal focus:ring-2 focus:ring-teal/20"
            >
          `;
          panel.appendChild(div);
        }
      }

      function updateDescription() {
        let p = problems[currentIdx];
        document.getElementById("problemDesc").innerHTML =
          `<strong>${p.title}</strong><br>${p.getDesc(p.params)}`;
      }

      function updateParam(key, val) {
        problems[currentIdx].params[key] = parseFloat(val) || 0;
        document.getElementById("resultBox").style.display = "none";
        updateDescription();
        updateSimulation();
      }

      function toggleResult() {
        let box = document.getElementById("resultBox");
        let p = problems[currentIdx];
        let res = p.calc(p.params);
        box.innerHTML = `
          <div class="mb-2 text-[10px] font-black uppercase tracking-[0.14em] text-yellow">Hasil & Langkah</div>
          <div class="text-sm leading-relaxed text-white">
            <strong>Jawaban Akhir:</strong> ${res.ans}
            <br><br>
            <strong>Langkah Penyelesaian:</strong><br>${res.steps}
          </div>
        `;
        box.style.display = box.style.display === "block" ? "none" : "block";
      }

      function updateSimulation() {
        let p = problems[currentIdx];
        let canvas = document.getElementById("simCanvas");
        let ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // illustrated sky / ground backdrop
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, "#DDE8F7");
        sky.addColorStop(0.68, "#F7F3E5");
        sky.addColorStop(0.681, "#E4E0D4");
        sky.addColorStop(1, "#D6CFAF");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // soft clouds
        ctx.fillStyle = "rgba(255,255,255,.75)";
        [[80,55,28],[105,50,22],[130,58,25],[430,70,30],[455,64,22],[478,73,27]].forEach(([x,y,r]) => {
          ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
        });

        p.draw(ctx, p.params);
      }

      window.onload = init;
    
  </script>
</body>
</html>
