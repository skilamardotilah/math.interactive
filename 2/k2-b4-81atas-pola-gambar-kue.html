<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <title>Pola Gambar Kue</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&family=Lato:wght@700;900&family=Londrina+Solid&display=swap");
      :root {
        --ink: #17121f;
        --yellow: #ffd84d;
        --sky: #d0e7f7;
        --pink: #ffe6ee;
        --cream: #fff7df;
        --green: #5fb869;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--sky);
        font-family: "Nunito", sans-serif;
        color: #59463f;
      }
      .shell {
        width: 100%;
        max-width: 920px;
      }
      .sim {
        background: #fff;
        border: 2px solid var(--ink);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 7px 7px 0 var(--ink);
      }
      .top {
        background: var(--ink);
        color: #fff;
        padding: 14px 22px;
        border-bottom: 4px solid var(--yellow);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand img {
        width: 50px;
        height: 50px;
        object-fit: contain;
      }
      .brand h1 {
        font: 400 1.65rem "Londrina Solid";
        margin: 0;
      }
      .progress {
        font: 600 15px "Fredoka";
        color: #e9e1d0;
      }
      .progress b {
        color: var(--yellow);
      }
      main {
        padding: 30px 20px 32px;
        background: linear-gradient(
          var(--pink),
          var(--cream) 58%,
          var(--green)
        );
        min-height: 520px;
      }
      .content {
        max-width: 820px;
        margin: auto;
      }
      .instruction {
        text-align: center;
        font: 600 clamp(21px, 4vw, 29px) "Fredoka";
        color: #7b3d54;
        margin: 0 0 30px;
      }
      .pattern-box {
        background: #fffafc;
        border: 3px solid #edbecd;
        border-radius: 24px;
        padding: 25px 16px;
        box-shadow: 0 7px 0 rgba(0, 0, 0, 0.07);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 13px;
        flex-wrap: nowrap;
        overflow-x: auto;
      }
      .slot {
        flex: 0 0 92px;
        width: 92px;
        height: 105px;
        border-radius: 18px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .slot.missing {
        border: 3px dashed #bd91a0;
        background: #fff2f7;
        font: 700 28px "Fredoka";
        color: #bd91a0;
        transition: 0.15s;
      }
      .slot.missing.hover {
        background: #f5e8ff;
        border-color: #8e73c7;
        transform: scale(1.04);
      }
      .slot.missing.filled {
        border: 3px solid #cbb4d5;
        background: #fff;
      }
      .cake {
        width: 84px;
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cake svg {
        width: 82px;
        height: 82px;
        filter: drop-shadow(0 4px 2px #0002);
      }
      .choice-title {
        text-align: center;
        margin: 27px 0 10px;
        font: 600 16px "Fredoka";
        color: #7a5a50;
      }
      .choices {
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .choice {
        width: 112px;
        height: 104px;
        border: 3px solid #ead0d8;
        border-radius: 20px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        touch-action: none;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.08);
        transition: 0.15s;
      }
      .choice:hover {
        transform: translateY(-3px);
      }
      .choice.dragging {
        opacity: 0.25;
      }
      .choice .cake {
        width: 78px;
        height: 78px;
      }
      .choice .cake svg {
        width: 76px;
        height: 76px;
      }
      .status {
        min-height: 31px;
        text-align: center;
        margin: 17px 0 3px;
        font: 600 18px "Fredoka";
      }
      .good {
        color: #278c52;
      }
      .bad {
        color: #d94f4b;
      }
      .controls {
        display: flex;
        justify-content: center;
        gap: 10px;
      }
      .controls button,
      .modal button {
        border: 0;
        border-radius: 999px;
        padding: 11px 19px;
        font: 600 15px "Fredoka";
        cursor: pointer;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.14);
      }
      .reset {
        background: #fff;
        border: 2px solid #ead8ce !important;
      }
      .check {
        background: var(--yellow);
        color: #5b3d00;
      }
      .next {
        display: none;
        background: #64cf8a;
        color: #174d2c;
      }
      footer {
        background: var(--ink);
        color: #ffffffbd;
        border-top: 4px solid var(--yellow);
        padding: 10px 22px;
        display: flex;
        justify-content: space-between;
        font: 700 0.75rem "Lato";
      }
      .float-drag {
        position: fixed;
        z-index: 9999;
        pointer-events: none;
        width: 92px;
        height: 92px;
        display: flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 8px 5px #0004);
      }
      .float-drag .cake {
        width: 82px;
        height: 82px;
      }
      .float-drag svg {
        width: 80px;
        height: 80px;
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: #281a2388;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .overlay.show {
        display: flex;
      }
      .modal {
        background: #fff;
        border-radius: 25px;
        padding: 28px;
        text-align: center;
        max-width: 370px;
      }
      .modal .big {
        font-size: 52px;
      }
      .modal h2 {
        font: 600 28px "Fredoka";
        color: #7b3d54;
      }
      .modal button {
        background: var(--yellow);
      }
      @media (max-width: 700px) {
        body {
          padding: 9px;
          align-items: flex-start;
        }
        .top {
          padding: 11px 13px;
        }
        .brand img {
          width: 40px;
          height: 40px;
        }
        .brand h1 {
          font-size: 1.25rem;
        }
        .pattern-box {
          justify-content: flex-start;
          padding: 18px 10px;
        }
        .slot {
          flex-basis: 76px;
          width: 76px;
          height: 90px;
        }
        .cake {
          width: 68px;
          height: 68px;
        }
        .cake svg {
          width: 66px;
          height: 66px;
        }
      }
    </style>
  </head>

        <p>Kamu sudah menyelesaikan semua pola gambar.</p>
        <button id="again">Main Lagi</button>
      </div>
    </div>
    <script>
      const Q = [
        // 1. ABABAB
        {
          seq: ["square", "triangle", null, "triangle", "square", "triangle"],
          ans: ["square"],
        },

        // 2. ABABAB
        {
          seq: ["circle", null, "circle", "star", "circle", "star"],
          ans: ["star"],
        },

        // 3. ABCABC — 2 gambar hilang
        {
          seq: ["triangle", "moon", null, null, "moon", "rectangle"],
          ans: ["rectangle", "triangle"],
        },

        // 4. ABABAB — 2 gambar hilang
        {
          seq: [null, "square", "rectangle", "square", null, "square"],
          ans: ["rectangle", "rectangle"],
        },

        // 5. ABABAB — diperjelas
        { seq: ["star", "moon", "star", null, "star", "moon"], ans: ["moon"] },

        // 6. ABABAB
        {
          seq: [null, "circle", "moon", "circle", "moon", "circle"],
          ans: ["moon"],
        },

        // 7. ABCABC — 2 gambar hilang
        {
          seq: ["square", "triangle", null, null, "triangle", "circle"],
          ans: ["circle", "square"],
        },

        // 8. AABAAB — 2 gambar hilang
        {
          seq: ["star", "rectangle", null, "rectangle", "star", null],
          ans: ["star", "rectangle"],
        },

        // 9. ABCABC — 2 gambar hilang
        {
          seq: ["triangle", null, "rectangle", "triangle", "moon", null],
          ans: ["moon", "rectangle"],
        },

        // 10. ABCABC — 2 gambar hilang
        {
          seq: ["circle", "square", "star", "circle", null, "star"],
          ans: ["square"],
        },
      ];
      const allTypes = [
        "square",
        "triangle",
        "circle",
        "star",
        "moon",
        "rectangle",
      ];
      let qi = 0,
        completed = 0,
        solved = false,
        drag = null,
        floatDrag = null;
      const pattern = document.getElementById("pattern"),
        choices = document.getElementById("choices"),
        status = document.getElementById("status");

      function cakeSVG(type, id) {
        const common = `stroke="#8b563c" stroke-width="2"`;
        let base = "",
          deco = "";
        if (type === "circle") {
          base = `<circle cx="40" cy="40" r="29" fill="#f3b3c8" ${common}/>`;
          deco = `<circle cx="40" cy="38" r="20" fill="#fff1c8"/><circle cx="31" cy="32" r="4" fill="#e65d68"/><circle cx="48" cy="45" r="4" fill="#8ac66d"/>`;
        }
        if (type === "square") {
          base = `<rect x="11" y="11" width="58" height="58" rx="8" fill="#f0c46e" ${common}/>`;
          deco = `<path d="M15 29h50" stroke="#fff0c6" stroke-width="8"/><circle cx="28" cy="27" r="4" fill="#e7606b"/><circle cx="51" cy="27" r="4" fill="#e7606b"/>`;
        }
        if (type === "rectangle") {
          base = `<rect x="6" y="20" width="68" height="42" rx="7" fill="#a8d7ef" ${common}/>`;
          deco = `<path d="M11 37h58" stroke="#fff5cf" stroke-width="8"/><circle cx="25" cy="36" r="4" fill="#ef7182"/><circle cx="54" cy="36" r="4" fill="#ef7182"/>`;
        }
        if (type === "triangle") {
          base = `<path d="M40 7 L73 68 L7 68 Z" fill="#efb46f" ${common}/>`;
          deco = `<path d="M18 58h44" stroke="#fff0c6" stroke-width="8"/><circle cx="40" cy="30" r="5" fill="#e85d68"/>`;
        }
        if (type === "star") {
          base = `<path d="M40 5l9 21 23 2-18 15 6 23-20-12-20 12 6-23L8 28l23-2z" fill="#ffd95c" ${common}/>`;
          deco = `<circle cx="40" cy="38" r="8" fill="#fff2b0"/><circle cx="40" cy="38" r="3" fill="#e76670"/>`;
        }
        if (type === "moon") {
          base = `<path d="M55 10c-25 5-31 40-8 55-28 2-43-25-31-45C24 7 40 4 55 10z" fill="#f4d66b" ${common}/>`;
          deco = `<circle cx="30" cy="28" r="4" fill="#fff0ad"/><circle cx="27" cy="46" r="3" fill="#e8bc50"/>`;
        }
        return `<svg viewBox="0 0 80 80" aria-hidden="true">${base}${deco}</svg>`;
      }
      function cake(type) {
        return `<div class="cake">${cakeSVG(type, Math.random())}</div>`;
      }

      function choiceTypes() {
        const needed = [...new Set(Q[qi].ans)];
        const distract = allTypes.filter((x) => !needed.includes(x));
        // deterministic but varied distractors
        const picks = [...needed];
        let j = (qi * 2) % distract.length;
        while (picks.length < 4 && distract.length) {
          let x = distract[j % distract.length];
          if (!picks.includes(x)) picks.push(x);
          j++;
        }
        // rotate order by question
        return picks
          .slice(qi % picks.length)
          .concat(picks.slice(0, qi % picks.length));
      }
      function load() {
        solved = false;
        drag = null;
        document.getElementById("qnum").textContent = qi + 1;
        status.textContent = "";
        status.className = "status";
        pattern.innerHTML = "";
        let miss = 0;
        Q[qi].seq.forEach((type, i) => {
          const s = document.createElement("div");
          s.className = "slot";
          if (type === null) {
            s.classList.add("missing");
            s.dataset.miss = miss++;
            s.innerHTML = "?";
          } else s.innerHTML = cake(type);
          pattern.appendChild(s);
        });
        choices.innerHTML = "";
        choiceTypes().forEach((type) => {
          const b = document.createElement("div");
          b.className = "choice";
          b.dataset.type = type;
          b.innerHTML = cake(type);
          b.onmousedown = (e) => {
            e.preventDefault();
            startDrag(e, b);
          };
          b.ontouchstart = (e) => startDrag(e, b);
          choices.appendChild(b);
        });
        document.getElementById("check").style.display = "inline-block";
        document.getElementById("next").style.display = "none";
      }
      function point(e) {
        return e.touches
          ? e.touches[0]
          : e.changedTouches
            ? e.changedTouches[0]
            : e;
      }
      function startDrag(e, el) {
        if (solved) return;
        drag = el;
        el.classList.add("dragging");
        floatDrag = document.createElement("div");
        floatDrag.className = "float-drag";
        floatDrag.innerHTML = el.innerHTML;
        document.body.appendChild(floatDrag);
        moveDrag(e);
      }
      function moveDrag(e) {
        if (!drag) return;
        const p = point(e);
        floatDrag.style.left = p.clientX - 46 + "px";
        floatDrag.style.top = p.clientY - 46 + "px";
        document
          .querySelectorAll(".slot.missing")
          .forEach((x) => x.classList.remove("hover"));
        document
          .elementFromPoint(p.clientX, p.clientY)
          ?.closest(".slot.missing")
          ?.classList.add("hover");
      }
      function endDrag(e) {
        if (!drag) return;
        const p = point(e),
          target = document
            .elementFromPoint(p.clientX, p.clientY)
            ?.closest(".slot.missing");
        if (target) {
          target.dataset.type = drag.dataset.type;
          target.innerHTML = cake(drag.dataset.type);
          target.classList.add("filled");
        }
        drag.classList.remove("dragging");
        document
          .querySelectorAll(".slot.missing")
          .forEach((x) => x.classList.remove("hover"));
        floatDrag.remove();
        floatDrag = null;
        drag = null;
      }
      addEventListener("mousemove", (e) => drag && moveDrag(e));
      addEventListener("mouseup", (e) => drag && endDrag(e));
      addEventListener(
        "touchmove",
        (e) => {
          if (drag) {
            moveDrag(e);
            e.preventDefault();
          }
        },
        { passive: false },
      );
      addEventListener("touchend", (e) => drag && endDrag(e));

      document.getElementById("reset").onclick = load;
      document.getElementById("check").onclick = () => {
        const slots = [...document.querySelectorAll(".slot.missing")];
        if (slots.some((x) => !x.dataset.type)) {
          status.textContent = "Lengkapi semua kotak yang kosong dulu, ya!";
          status.className = "status bad";
          return;
        }
        const ok = slots.every((x, i) => x.dataset.type === Q[qi].ans[i]);
        if (ok) {
          solved = true;
          status.textContent = "Benar! Polanya sudah lengkap.";
          status.className = "status good";
          completed = Math.max(completed, qi + 1);
          document.getElementById("done").textContent =
            `Selesai: ${completed} / 10`;
          document.getElementById("check").style.display = "none";
          document.getElementById("next").style.display = "inline-block";
        } else {
          status.textContent = "Belum tepat. Perhatikan pola gambarnya lagi!";
          status.className = "status bad";
        }
      };
      document.getElementById("next").onclick = () => {
        if (qi < 9) {
          qi++;
          load();
        } else document.getElementById("overlay").classList.add("show");
      };
      document.getElementById("again").onclick = () => {
        qi = 0;
        completed = 0;
        document.getElementById("done").textContent = "Selesai: 0 / 10";
        document.getElementById("overlay").classList.remove("show");
        load();
      };
      load();
    </script>
  </body>
</html>
