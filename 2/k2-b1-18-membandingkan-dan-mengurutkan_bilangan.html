<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>Mengurutkan Bilangan</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap");

      :root {
        --blue: #2f6fed;
        --blue-dark: #1c3f9c;
        --blue-pale: #eaf3ff;
        --green: #2fae5c;
        --green-dark: #1f8a46;
        --amber: #f4c430;
        --amber-dark: #c99400;
        --ink: #1c2a4a;
        --muted: #5b6b8c;
        --card: #ffffff;
        --page-bg: #dcebff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: "Nunito", sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, #eaf3ff, #dbe9ff 60%, #cfe1ff);
        min-height: 100vh;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .page {
        width: 100%;
        max-width: 1040px;
      }

      .topbar {
        background: var(--card);
        border-radius: 20px;
        padding: 16px 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        box-shadow: 0 6px 18px rgba(30, 60, 130, 0.1);
        margin-bottom: 14px;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .topbar-icon {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: var(--blue-pale);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        flex-shrink: 0;
      }
      .topbar h1 {
        margin: 0;
        font-family: "Fredoka", sans-serif;
        font-size: 22px;
        color: var(--blue-dark);
        font-weight: 700;
      }
      .topbar p {
        margin: 2px 0 0;
        font-size: 13px;
        color: var(--muted);
        font-weight: 700;
      }
      .score-box {
        background: var(--card);
        border: 2px solid #eef2fb;
        border-radius: 14px;
        padding: 6px 18px;
        text-align: center;
        box-shadow: 0 3px 0 #eef2fb;
        flex-shrink: 0;
      }
      .score-box .score-label {
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
        letter-spacing: 0.03em;
      }
      .score-box .score-value {
        font-family: "Fredoka", sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--blue-dark);
      }

      .main-grid {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 14px;
        align-items: start;
      }

      .sidebar {
        background: var(--card);
        border-radius: 20px;
        padding: 16px;
        box-shadow: 0 6px 18px rgba(30, 60, 130, 0.1);
      }
      .sidebar-title {
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: 16px;
        color: var(--blue-dark);
        margin: 0 0 10px;
      }
      .soal-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .soal-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 14px;
        background: var(--blue-pale);
        color: var(--blue-dark);
        border: 2px solid transparent;
        border-radius: 12px;
        padding: 9px 12px;
        cursor: pointer;
        text-align: left;
        transition: 0.15s;
      }
      .soal-btn:hover {
        border-color: var(--blue);
      }
      .soal-num {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #fff;
        color: var(--blue);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 800;
        flex-shrink: 0;
      }
      .soal-btn.active {
        background: var(--blue);
        color: #fff;
      }
      .soal-btn.active .soal-num {
        background: #fff;
        color: var(--blue);
      }
      .soal-btn.done .soal-num {
        background: var(--green);
        color: #fff;
      }
      .soal-btn.done.active .soal-num {
        background: #fff;
        color: var(--green);
      }

      .mascot-img {
        margin-top: 14px;
        width: 100%;
        border-radius: 16px;
        display: block;
        box-shadow: 0 4px 14px rgba(30, 60, 130, 0.12);
      }

      .question-panel {
        background: var(--card);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 6px 18px rgba(30, 60, 130, 0.1);
      }
      .soal-badge {
        display: inline-block;
        background: var(--blue);
        color: #fff;
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: 14px;
        padding: 6px 16px;
        border-radius: 999px;
        margin-bottom: 14px;
      }
      .soal-text {
        font-size: 15px;
        font-weight: 700;
        line-height: 1.7;
        color: var(--ink);
        margin-bottom: 18px;
        white-space: pre-line;
      }
      .answer-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-bottom: 8px;
      }
      .answer-row.shake {
        animation: shakeRow 0.4s ease;
      }
      @keyframes shakeRow {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-8px);
        }
        75% {
          transform: translateX(8px);
        }
      }
      .answer-box {
        width: 92px;
        height: 76px;
        border-radius: 14px;
        border: 3px dashed var(--blue);
        background: var(--blue-pale);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Fredoka", sans-serif;
        font-size: 26px;
        font-weight: 700;
        color: var(--blue-dark);
        cursor: pointer;
        transition: 0.15s;
      }
      .answer-box.filled {
        border-style: solid;
        background: #fff;
      }
      .answer-box.correct {
        border-color: var(--green);
        background: #eafff1;
        color: var(--green-dark);
      }
      .answer-box.wrong {
        border-color: #ff6b6b;
        background: #fff0f0;
        color: #c23b3b;
      }
      .lt {
        font-family: "Fredoka", sans-serif;
        font-size: 26px;
        font-weight: 700;
        color: var(--muted);
      }

      .feedback {
        text-align: center;
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 14px;
        min-height: 22px;
        margin-bottom: 6px;
      }
      .feedback.success {
        color: var(--green-dark);
      }
      .feedback.error {
        color: #c23b3b;
      }
      .feedback.warn {
        color: var(--amber-dark);
      }

      .hint-panel {
        background: #fff9e6;
        border: 2px solid #fbe6a8;
        border-radius: 14px;
        padding: 12px 16px;
        margin-bottom: 14px;
      }
      .hint-item {
        font-size: 13.5px;
        font-weight: 700;
        color: #8a6a00;
        margin: 4px 0;
      }
      .hint-item b {
        color: #5b4700;
      }

      .choices-wrap {
        background: var(--blue-pale);
        border-radius: 16px;
        padding: 14px 16px;
        margin-bottom: 18px;
      }
      .choices-label {
        margin: 0 0 10px;
        font-size: 13px;
        font-weight: 800;
        color: var(--muted);
      }
      .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .choice-tile {
        background: #fff;
        border: 2px solid #d7e3fb;
        border-radius: 12px;
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: 16px;
        color: var(--blue-dark);
        padding: 10px 16px;
        cursor: pointer;
        transition: 0.15s;
        box-shadow: 0 3px 0 #d7e3fb;
        user-select: none;
      }
      .choice-tile:hover {
        border-color: var(--blue);
      }
      .choice-tile.used {
        background: var(--blue);
        color: #fff;
        border-color: var(--blue);
        box-shadow: 0 3px 0 var(--blue-dark);
      }

      .action-row {
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .btn-hint,
      .btn-check {
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: 16px;
        border: none;
        border-radius: 999px;
        padding: 13px 28px;
        cursor: pointer;
        color: #fff;
      }
      .btn-hint {
        background: var(--amber);
        color: #5b4700;
        box-shadow: 0 5px 0 var(--amber-dark);
      }
      .btn-check {
        background: var(--green);
        box-shadow: 0 5px 0 var(--green-dark);
      }
      .btn-hint:active,
      .btn-check:active {
        transform: translateY(4px);
        box-shadow: none;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(20, 30, 60, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 20px;
      }
      .overlay.show {
        display: flex;
      }
      .modal {
        background: #fff;
        border-radius: 24px;
        padding: 30px 26px;
        text-align: center;
        max-width: 340px;
        box-shadow: 0 20px 0 rgba(0, 0, 0, 0.1);
      }
      .modal .big-icon {
        font-size: 50px;
      }
      .modal h2 {
        font-family: "Fredoka", sans-serif;
        color: var(--blue-dark);
        margin: 8px 0;
      }
      .modal p {
        font-weight: 700;
        color: var(--muted);
        margin: 6px 0 20px;
      }
      .modal button {
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: 15px;
        border: none;
        border-radius: 999px;
        padding: 12px 22px;
        cursor: pointer;
        width: 100%;
        margin-top: 8px;
      }
      .modal .primary {
        background: var(--blue);
        color: #fff;
        box-shadow: 0 5px 0 var(--blue-dark);
      }
      .modal .secondary {
        background: #eef2fb;
        color: var(--muted);
        box-shadow: 0 5px 0 #dbe4f5;
      }
      .modal button:active {
        transform: translateY(4px);
        box-shadow: none;
      }

      .confetti {
        position: fixed;
        top: -40px;
        font-size: 22px;
        z-index: 250;
        pointer-events: none;
        animation: fall linear forwards;
      }
      @keyframes fall {
        to {
          transform: translateY(110vh) rotate(360deg);
          opacity: 0.4;
        }
      }


      .choice-tile[draggable="true"] { cursor: grab; }
      .choice-tile[draggable="true"]:active { cursor: grabbing; }
      .answer-box.drag-over { transform: scale(1.06); background:#fff7c7; border-color:#f4c430; }
      .fixed-number { width:92px; height:76px; border-radius:14px; background:#fff; border:3px solid #d7e3fb; display:flex; align-items:center; justify-content:center; font-family:"Fredoka",sans-serif; font-size:26px; font-weight:700; color:var(--blue-dark); }
      .sign-box { font-size:34px; }

      @media (max-width: 760px) {
        .main-grid {
          grid-template-columns: 1fr;
        }
        .sidebar {
          order: 2;
        }
        .soal-list {
          flex-direction: row;
          flex-wrap: wrap;
        }
        .soal-btn {
          flex: 1 1 30%;
        }
        .answer-box {
          width: 72px;
          height: 64px;
          font-size: 22px;
        }
        .topbar h1 {
          font-size: 18px;
        }
        .topbar p {
          font-size: 11.5px;
        }
      }

      /* === Identitas Dunia Bilangan Cacah === */
      body {
        background: #e2d6f8;
        padding: 18px;
      }
      .page {
        max-width: 1220px;
        margin: auto;
      }
      .sim-container {
        width: 100%;
        background: #fff;
        border: 2px solid #17121f;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 7px 7px 0 #17121f;
      }
      .topbar {
        background: #17121f;
        color: #fff;
        border: 0;
        border-radius: 0;
        padding: 14px 22px;
        margin: 0;
        box-shadow: none;
        min-height: 78px;
        position: relative;
      }
      .topbar::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        background: #ffd84d;
      }
      .topbar-left {
        gap: 8px;
      }

<style>
/* Pusatkan seluruh area simulasi secara vertikal di layar desktop */
html, body { min-height: 100%; }
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding-top: 18px; padding-bottom: 18px; }
.page { margin: 0 auto; }
@media (max-height: 760px), (max-width: 760px) {
  body { align-items: flex-start; }
}
</style>

<style>
/* Layout: pilihan soal horizontal di atas area simulasi */
.main-grid {
  display: grid !important;
  grid-template-columns: 1fr !important;
  gap: 14px !important;
  align-items: stretch !important;
}
.sidebar {
  width: 100% !important;
  padding: 12px 16px !important;
}
.sidebar-title {
  margin: 0 0 8px !important;
}
.soal-list {
  display: grid !important;
  grid-template-columns: repeat(auto-fit, minmax(46px, 56px)) !important;
  justify-content: center !important;
  gap: 10px !important;
}
.soal-btn {
  aspect-ratio: 1 / 1 !important;
  padding: 0 !important;
  min-width: 0 !important;
  justify-content: center !important;
  align-items: center !important;
  text-align: center !important;
  border-radius: 50% !important;
  background: var(--blue-pale) !important;
  border: 2px solid transparent !important;
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease !important;
}
.soal-btn:hover {
  transform: translateY(-2px) scale(1.05) !important;
  box-shadow: 0 4px 10px rgba(20, 20, 40, .18) !important;
}
.soal-btn .soal-num {
  width: auto !important;
  height: auto !important;
  background: transparent !important;
  color: inherit !important;
  font-size: 15px !important;
  margin: 0 !important;
}
.soal-btn span:not(.soal-num) { display: none !important; }
.soal-btn.active {
  background: var(--blue) !important;
  color: #fff !important;
  box-shadow: 0 3px 0 var(--blue-dark) !important;
  transform: none !important;
}
.soal-btn.done {
  background: #eafff1 !important;
  border-color: var(--green) !important;
  color: var(--green-dark) !important;
}
.soal-btn.done.active {
  background: var(--green) !important;
  color: #fff !important;
  box-shadow: 0 3px 0 var(--green-dark) !important;
}
.mascot-img { display: none !important; }
.question-panel {
  width: 100% !important;
  align-self: stretch !important;
}
@media (max-width: 760px) {
  .sidebar { order: 0 !important; }
  .soal-list { grid-template-columns: repeat(auto-fit, minmax(38px, 46px)) !important; gap: 8px !important; }
}
</style>

        {type:"order", soal:"Ani memiliki 42 jeruk.\nRina memiliki 35 jeruk.\nSiti memiliki 39 jeruk.\nDodi memiliki 47 jeruk.\nUrutkan dari terbanyak ke paling sedikit.", answer:[47,42,39,35], choices:[42,35,39,47], symbol:">", hints:["Cari jumlah jeruk paling banyak.","Perhatikan puluhan dan satuannya."]},
        {type:"order", soal:"Nisa mendapat 46 poin.\nLala mendapat 41 poin.\nRina mendapat 49 poin.\nSari mendapat 44 poin.\nUrutkan dari paling sedikit ke terbanyak.", answer:[41,44,46,49], choices:[46,49,41,44], symbol:"<", hints:["Semua memiliki empat puluhan.","Bandingkan angka satuannya."]},
        {type:"compare", soal:"Beni memiliki 17 kelereng.\nDodi memiliki 24 kelereng.\nBandingkan jumlah kelereng mereka.", numbers:[17,24], answer:["<"], choices:["<",">"], hints:["17 lebih kecil daripada 24."]},
        {type:"compare", soal:"Siti memiliki 38 stiker.\nRani memiliki 31 stiker.\nBandingkan jumlah stiker mereka.", numbers:[38,31], answer:[">"], choices:["<",">"], hints:["38 lebih besar daripada 31."]},
        {type:"compare", soal:"Kotak merah berisi 26 pensil.\nKotak biru berisi 29 pensil.\nBandingkan jumlah pensil keduanya.", numbers:[26,29], answer:["<"], choices:["<",">"], hints:["Puluhannya sama-sama dua.","Bandingkan angka satuannya."]},
        {type:"compare", soal:"Ayu memetik 45 bunga.\nLina memetik 40 bunga.\nBandingkan jumlah bunga mereka.", numbers:[45,40], answer:[">"], choices:["<",">"], hints:["45 lebih besar daripada 40."]},
        {type:"compare", soal:"Rak A memiliki 33 buku.\nRak B memiliki 37 buku.\nBandingkan jumlah buku keduanya.", numbers:[33,37], answer:["<"], choices:["<",">"], hints:["Puluhannya sama-sama tiga.","Bandingkan angka satuannya."]}
      ];

      let currentIndex=0, score=0, hintStep=0, boxValues=[];
      const solved=new Set();
      const soalList=document.getElementById("soalList"), soalText=document.getElementById("soalText"), choicesEl=document.getElementById("choices"), feedback=document.getElementById("feedback"), hintPanel=document.getElementById("hintPanel"), btnHint=document.getElementById("btnHint"), btnCheck=document.getElementById("btnCheck"), scoreVal=document.getElementById("scoreVal"), answerRow=document.getElementById("answerRow"), overlay=document.getElementById("overlay"), modalMsg=document.getElementById("modalMsg"), modalRestart=document.getElementById("modalRestart"), modalClose=document.getElementById("modalClose");
      function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
      function renderSoalList(){soalList.innerHTML=QUESTIONS.map((q,i)=>`<button class="soal-btn ${i===currentIndex?'active':''} ${solved.has(i)?'done':''}" data-i="${i}"><span class="soal-num">${solved.has(i)?'✔':i+1}</span></button>`).join('');soalList.querySelectorAll('.soal-btn').forEach(b=>b.onclick=()=>loadQuestion(+b.dataset.i));}
      function setupDrop(box){box.addEventListener('dragover',e=>{e.preventDefault();box.classList.add('drag-over')});box.addEventListener('dragleave',()=>box.classList.remove('drag-over'));box.addEventListener('drop',e=>{e.preventDefault();box.classList.remove('drag-over');placeValue(+box.dataset.slot,e.dataTransfer.getData('text/plain'));});box.addEventListener('click',()=>clearSlot(+box.dataset.slot));}
      function loadQuestion(i){currentIndex=i;hintStep=0;const q=QUESTIONS[i];boxValues=Array(q.answer.length).fill(null);soalText.textContent=q.soal;feedback.textContent='';feedback.className='feedback';hintPanel.style.display='none';hintPanel.innerHTML='';btnHint.textContent='💡 Petunjuk';
        if(q.type==='order'){answerRow.innerHTML=q.answer.map((_,idx)=>`<div class="answer-box" data-slot="${idx}"></div>${idx<q.answer.length-1?`<div class="lt">${q.symbol}</div>`:''}`).join('')}
        else {answerRow.innerHTML=`<div class="fixed-number">${q.numbers[0]}</div><div class="answer-box sign-box" data-slot="0"></div><div class="fixed-number">${q.numbers[1]}</div>`}
        answerRow.querySelectorAll('.answer-box').forEach(setupDrop);
        choicesEl.innerHTML=shuffle(q.choices).map(v=>`<div class="choice-tile" draggable="true" data-value="${v}">${v}</div>`).join('');
        choicesEl.querySelectorAll('.choice-tile').forEach(t=>{t.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',t.dataset.value));t.addEventListener('click',()=>{const empty=boxValues.indexOf(null);if(empty>-1)placeValue(empty,t.dataset.value)})});renderSoalList();}
      function placeValue(slot,val){const q=QUESTIONS[currentIndex];val=q.type==='order'?+val:val;if(boxValues.includes(val)){const old=boxValues.indexOf(val);boxValues[old]=null;updateBox(old)}boxValues[slot]=val;updateBox(slot);syncTiles();feedback.textContent='';}
      function clearSlot(slot){if(boxValues[slot]===null)return;boxValues[slot]=null;updateBox(slot);syncTiles();}
      function updateBox(slot){const b=answerRow.querySelector(`[data-slot="${slot}"]`);b.textContent=boxValues[slot]??'';b.classList.toggle('filled',boxValues[slot]!==null);b.classList.remove('correct','wrong')}
      function syncTiles(){choicesEl.querySelectorAll('.choice-tile').forEach(t=>{const q=QUESTIONS[currentIndex],v=q.type==='order'?+t.dataset.value:t.dataset.value;t.classList.toggle('used',boxValues.includes(v))})}
      function shakeBoxes(){answerRow.classList.remove('shake');void answerRow.offsetWidth;answerRow.classList.add('shake')}
      function checkAnswer(){if(boxValues.includes(null)){feedback.textContent='Lengkapi jawabannya dulu, ya! 🧐';feedback.className='feedback warn';shakeBoxes();return}const ans=QUESTIONS[currentIndex].answer,ok=boxValues.every((v,i)=>v===ans[i]);if(ok){answerRow.querySelectorAll('.answer-box').forEach(b=>b.classList.add('correct'));feedback.textContent='Benar sekali! Hebat! 🎉';feedback.className='feedback success';if(!solved.has(currentIndex)){solved.add(currentIndex);score=Math.round(solved.size/QUESTIONS.length*100);scoreVal.textContent=score;renderSoalList()}if(solved.size===QUESTIONS.length)setTimeout(showAllDone,500)}else{answerRow.querySelectorAll('.answer-box').forEach(b=>b.classList.add('wrong'));feedback.textContent='Belum tepat, coba lagi ya. 💪';feedback.className='feedback error';shakeBoxes()}}
      function renderHints(){const h=QUESTIONS[currentIndex].hints;hintPanel.style.display=hintStep?'block':'none';hintPanel.innerHTML=h.slice(0,hintStep).map((x,i)=>`<div class="hint-item"><b>Petunjuk ${i+1}:</b> ${x}</div>`).join('');btnHint.textContent=hintStep>=h.length?'💡 Semua Petunjuk Tampil':'💡 Petunjuk'}
      btnHint.onclick=()=>{hintStep=Math.min(hintStep+1,QUESTIONS[currentIndex].hints.length);renderHints()};btnCheck.onclick=checkAnswer;
      function launchConfetti(n){const a=['⭐','🎉','✨','🌈','🎈'];for(let i=0;i<n;i++)setTimeout(()=>{const c=document.createElement('div');c.className='confetti';c.textContent=a[Math.floor(Math.random()*a.length)];c.style.left=Math.random()*100+'vw';c.style.animationDuration=2+Math.random()*2+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4500)},i*30)}
      function showAllDone(){modalMsg.textContent=`Skor kamu: ${score}/100`;overlay.classList.add('show');launchConfetti(30)}
      modalRestart.onclick=()=>{overlay.classList.remove('show');solved.clear();score=0;scoreVal.textContent=0;loadQuestion(0)};modalClose.onclick=()=>overlay.classList.remove('show');
      loadQuestion(0);
    </script>
  </body>
