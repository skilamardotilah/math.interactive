<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teka-Teki Silang Waktu</title><style>
:root{--navy:#17345d;--yellow:#ffd45a;--cell:44px}*{box-sizing:border-box}html{height:100%}body{margin:0;min-height:100%;padding:24px 12px;background:#dff3ff;color:#493d38;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}button,input{font:inherit}.app{width:min(1180px,100%);margin:auto;background:#fff;border:3px solid var(--navy);border-radius:22px;overflow:hidden;box-shadow:8px 8px 0 #17345d33}header{padding:10px 18px;background:var(--navy);color:#fff;border-bottom:5px solid var(--yellow);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:9px}.brand span{font-size:34px}.brand h1{margin:0;font-size:1.35rem}.head-right{display:flex;align-items:center;gap:9px}.levels{display:flex;gap:6px}.level-btn{border:2px solid #ffffffbb;background:#fff;color:#315071;border-radius:999px;padding:6px 10px;font-weight:900;cursor:pointer}.level-btn.active{background:var(--yellow);color:#604611;border-color:var(--yellow)}main{padding:15px 18px;background:linear-gradient(145deg,#fff7de,#eefbea)}.instruction{text-align:center;margin:0 0 10px;font-weight:800;color:#71574d}.layout{display:grid;grid-template-columns:minmax(650px,1.6fr) minmax(330px,.75fr);gap:16px}.board-card,.clue-card{background:#fff;border:3px solid #d8ae91;border-radius:19px;padding:13px;box-shadow:0 5px 0 #63483d1c}.board-wrap{position:relative;isolation:isolate;display:grid;place-items:center;height:500px;background:linear-gradient(180deg,#7fd6ff 0%,#fff3c4 55%,#eaf8d9 55%,#bfe497 100%);border-radius:14px;overflow:hidden;padding:16px;box-shadow:inset 0 0 0 2px #ffffff70;transition:background .35s ease}.board-wrap::before{content:'';position:absolute;z-index:0;top:28px;right:38px;width:78px;height:78px;border-radius:50%;background:#ffc93c;box-shadow:0 0 0 10px #ffc93c59;transition:all .35s ease}.board-wrap::after{content:'';position:absolute;z-index:0;left:-5%;right:-5%;bottom:-54px;height:170px;background:radial-gradient(ellipse at 18% 75%,#79c764 0 35%,transparent 36%),radial-gradient(ellipse at 52% 68%,#64b957 0 39%,transparent 40%),radial-gradient(ellipse at 86% 78%,#4fa54d 0 36%,transparent 37%);pointer-events:none;transition:background .35s ease}.board-wrap.level-2{background:linear-gradient(180deg,#f39a77 0%,#ffd09a 48%,#ffe4af 62%,#b7d27a 62%,#86b85d 100%)}.board-wrap.level-2::before{top:105px;right:45px;background:#f27c3d;box-shadow:0 0 0 12px #ffbd6659}.board-wrap.level-2::after{background:radial-gradient(ellipse at 18% 75%,#759f55 0 35%,transparent 36%),radial-gradient(ellipse at 52% 68%,#638f4d 0 39%,transparent 40%),radial-gradient(ellipse at 86% 78%,#527e45 0 36%,transparent 37%)}.board-wrap.level-3{background:radial-gradient(circle at 12% 14%,#fff 0 2px,transparent 3px),radial-gradient(circle at 34% 9%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 58% 20%,#fff 0 2px,transparent 3px),radial-gradient(circle at 75% 8%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 91% 26%,#fff 0 2px,transparent 3px),linear-gradient(180deg,#13254e 0%,#334b7c 58%,#24483f 58%,#183c35 100%)}.board-wrap.level-3::before{top:34px;right:42px;width:72px;height:72px;background:#fff6c9;box-shadow:0 0 0 11px #fff6c938,0 0 28px #fff4ac}.board-wrap.level-3::after{background:radial-gradient(ellipse at 18% 75%,#315f46 0 35%,transparent 36%),radial-gradient(ellipse at 52% 68%,#254f3e 0 39%,transparent 40%),radial-gradient(ellipse at 86% 78%,#183e35 0 36%,transparent 37%)}.grid{position:relative;z-index:2;display:grid;width:max-content;margin:auto;grid-template-columns:repeat(var(--cols),var(--cell));grid-template-rows:repeat(var(--rows),var(--cell));gap:3px;filter:drop-shadow(0 4px 1px #0002)}.cell,.empty{width:var(--cell);height:var(--cell)}.cell{position:relative}.cell input{width:100%;height:100%;border:3px solid #755548;border-radius:7px;background:#fffdf4;text-align:center;text-transform:uppercase;font-size:1.35rem;font-weight:900;color:#263d5d;outline:none}.cell input:focus{background:#fff0a8;border-color:#e39243}.cell.active input{background:#fff4b8}.cell.correct input{background:#c8f2d2;border-color:#3f9b58}.cell.wrong input{background:#ffd4d4;border-color:#d95555}.number{position:absolute;top:2px;left:4px;z-index:2;font-size:.58rem;font-weight:900;color:#795548}.clue-card{display:flex;flex-direction:column;max-height:500px;overflow:auto}.clue-card h2{font-size:1.08rem;margin:0 0 5px;color:#34537a}.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:#987467;font-weight:900;margin:7px 0 3px}.clues{display:grid;gap:6px}.clue{border:2px solid #e7d7cd;background:#fffaf2;border-radius:11px;padding:7px 9px;text-align:left;color:#57453d;cursor:pointer;font-weight:700;line-height:1.25;font-size:.9rem}.clue:hover,.clue.active{border-color:#e09a6e;background:#fff0dc}.clue strong{color:#a15a3b;margin-right:4px}.feedback{min-height:24px;margin:8px 0 5px;text-align:center;font-weight:900}.feedback.good{color:#248247}.feedback.bad{color:#bd4242}.actions{display:flex;justify-content:center;gap:7px;margin-top:auto}.btn{border:0;border-radius:999px;padding:9px 15px;font-weight:900;cursor:pointer}.check{background:var(--yellow);color:#604611;box-shadow:0 4px 0 #c99d31}.reset{background:#e8edf4;color:#314b6d;box-shadow:0 4px 0 #b7c2d0}.score-footer{min-height:38px;padding:8px 18px;background:var(--navy);border-top:4px solid var(--yellow);color:#fff;display:flex;align-items:center;justify-content:flex-start;font-size:.9rem;font-weight:900}.score-footer span{color:var(--yellow);font-size:1rem}.finish{display:none;position:fixed;inset:0;background:#14233cb3;z-index:20;align-items:center;justify-content:center;padding:18px}.finish-card{width:min(370px,100%);background:#fff;border:5px solid var(--yellow);border-radius:24px;padding:24px;text-align:center}.finish-card .trophy{font-size:62px}.finish-card h2{margin:3px;color:#254e7b}.finish-card button{border:0;border-radius:999px;background:var(--yellow);padding:11px 20px;font-weight:900;cursor:pointer}@media(max-width:900px){body{padding:18px 7px;align-items:center}.app{border-radius:16px}header{padding:9px 12px}.brand span{font-size:28px}.brand h1{font-size:1.03rem}.head-right{width:100%;justify-content:flex-end}.layout{grid-template-columns:1fr}.board-wrap{height:390px;min-height:0}.clue-card{max-height:none}.grid{--cell:clamp(18px,6vw,40px)}.cell input{font-size:clamp(.85rem,4vw,1.2rem);border-width:2px}.level-btn{padding:5px 9px;font-size:.78rem}}@media(max-width:480px){main{padding:10px 8px}.board-card,.clue-card{padding:8px}.board-wrap{padding:10px}}
</style></head><body><div class="app"><header><div class="brand"><span>🧩</span><h1>Teka-Teki Silang Waktu</h1></div><div class="head-right"><div class="levels"><button class="level-btn active" onclick="selectLevel(0)">Level 1</button><button class="level-btn" onclick="selectLevel(1)">Level 2</button><button class="level-btn" onclick="selectLevel(2)">Level 3</button></div></div></header><main><p class="instruction" id="instruction"></p><div class="layout"><section class="board-card"><div class="board-wrap"><div class="grid" id="grid"></div></div></section><aside class="clue-card"><h2>🔎 Petunjuk</h2><div id="clueList"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="btn reset" onclick="resetGrid()">Ulangi</button><button class="btn check" onclick="checkAnswers()">Periksa</button></div></aside></div></main><footer class="score-footer">⭐ Skor:&nbsp;<span id="scoreValue">0</span></footer></div><div class="finish" id="finish"><div class="finish-card"><div class="trophy">🏆</div><h2 id="finishTitle">Level Selesai!</h2><p id="finishText">Semua jawabanmu benar.</p><button id="nextBtn" onclick="nextLevel()">Lanjut</button></div></div>
<script>
const levels=[
 {title:'Level 1 · 4 Soal',words:[
  {id:'siang',answer:'SIANG',r:2,c:0,d:'H',clue:'Matahari berada tinggi pada waktu ini.'},
  {id:'sore',answer:'SORE',r:2,c:0,d:'V',clue:'Waktu setelah siang dan sebelum malam.'},
  {id:'malam',answer:'MALAM',r:1,c:2,d:'V',clue:'Bulan dan bintang terlihat pada waktu ini.'},
  {id:'pagi',answer:'PAGI',r:0,c:4,d:'V',clue:'Andi bangun tidur dan sarapan pada waktu ini.'}]},
 {title:'Level 2 · 5 Soal',words:[
  {id:'matahari',answer:'MATAHARI',r:3,c:0,d:'H',clue:'Benda langit yang menyinari bumi pada siang hari.'},
  {id:'sore',answer:'SORE',r:1,c:6,d:'V',clue:'Waktu ketika matahari mulai turun.'},
  {id:'pagi',answer:'PAGI',r:2,c:1,d:'V',clue:'Waktu ketika matahari mulai terbit.'},
  {id:'malam',answer:'MALAM',r:0,c:3,d:'V',clue:'Waktu ketika langit gelap.'},
  {id:'siang',answer:'SIANG',r:1,c:6,d:'H',clue:'Waktu ketika matahari tampak tinggi.'}]},
 {title:'Level 3 · 6 Soal',words:[
  {id:'bintang',answer:'BINTANG',r:4,c:0,d:'H',clue:'Benda langit kecil yang tampak berkelip pada malam hari.'},
  {id:'malam',answer:'MALAM',r:1,c:4,d:'V',clue:'Waktu yang tepat untuk tidur.'},
  {id:'bulan',answer:'BULAN',r:4,c:0,d:'V',clue:'Benda langit yang sering terlihat pada malam hari.'},
  {id:'pagi',answer:'PAGI',r:1,c:1,d:'V',clue:'Waktu ketika Andi bersiap ke sekolah.'},
  {id:'siang',answer:'SIANG',r:0,c:6,d:'V',clue:'Waktu ketika Andi makan setelah pulang sekolah.'},
  {id:'sore',answer:'SORE',r:0,c:6,d:'H',clue:'Waktu ketika Andi bermain dan menyiram tanaman.'}]}
];
let levelIndex=0,answerByCell={},activeWords=[],cellCount=0,finishTimer=null;const grid=document.getElementById('grid'),feedback=document.getElementById('feedback'),scoreValue=document.getElementById('scoreValue');
function selectLevel(i){levelIndex=i;document.querySelectorAll('.level-btn').forEach((b,n)=>b.classList.toggle('active',n===i));buildLevel()}
function buildLevel(){clearTimeout(finishTimer);finishTimer=null;feedback.textContent='';feedback.className='feedback';scoreValue.textContent='0';const boardWrap=document.querySelector('.board-wrap');boardWrap.className=`board-wrap level-${levelIndex+1}`;const level=levels[levelIndex];activeWords=level.words;answerByCell={};let maxR=0,maxC=0;const startKeys=[...new Set(activeWords.map(w=>`${w.r}-${w.c}`))].sort((a,b)=>{const[x,y]=a.split('-').map(Number),[u,v]=b.split('-').map(Number);return x-u||y-v});const numbers=Object.fromEntries(startKeys.map((k,i)=>[k,i+1]));activeWords.forEach(w=>{w.number=numbers[`${w.r}-${w.c}`];[...w.answer].forEach((ch,i)=>{const r=w.r+(w.d==='V'?i:0),c=w.c+(w.d==='H'?i:0),key=`${r}-${c}`;if(answerByCell[key]&&answerByCell[key]!==ch)throw Error('Persilangan tidak cocok');answerByCell[key]=ch;maxR=Math.max(maxR,r);maxC=Math.max(maxC,c)})});cellCount=Object.keys(answerByCell).length;grid.style.setProperty('--rows',maxR+1);grid.style.setProperty('--cols',maxC+1);grid.innerHTML='';for(let r=0;r<=maxR;r++)for(let c=0;c<=maxC;c++){const key=`${r}-${c}`;if(answerByCell[key]){const wrap=document.createElement('div');wrap.className='cell';wrap.dataset.key=key;if(numbers[key])wrap.innerHTML=`<span class="number">${numbers[key]}</span>`;const input=document.createElement('input');input.maxLength=1;input.autocomplete='off';input.setAttribute('aria-label',`Kotak baris ${r+1} kolom ${c+1}`);input.oninput=e=>{e.target.value=e.target.value.replace(/[^a-zA-Z]/g,'').toUpperCase();clearMarks()};wrap.appendChild(input);grid.appendChild(wrap)}else{const e=document.createElement('div');e.className='empty';grid.appendChild(e)}}renderClues();document.getElementById('instruction').textContent=`${level.title}: isi jawaban berdasarkan petunjuk.`;document.getElementById('finish').style.display='none'}
function renderClues(){const host=document.getElementById('clueList');host.innerHTML='';[['H','Mendatar'],['V','Menurun']].forEach(([d,label])=>{const list=activeWords.filter(w=>w.d===d).sort((a,b)=>a.number-b.number);if(!list.length)return;host.insertAdjacentHTML('beforeend',`<div class="section-title">${label}</div><div class="clues" data-dir="${d}"></div>`);const box=host.lastElementChild;list.forEach(w=>{const b=document.createElement('button');b.className='clue';b.dataset.word=w.id;b.innerHTML=`<strong>${w.number}.</strong> ${w.clue}`;b.onclick=()=>highlightWord(b,w);box.appendChild(b)})})}
function cellsFor(w){return [...w.answer].map((_,i)=>[w.r+(w.d==='V'?i:0),w.c+(w.d==='H'?i:0)])}function getCell(r,c){return document.querySelector(`.cell[data-key="${r}-${c}"] input`)}function highlightWord(btn,w){document.querySelectorAll('.clue').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.cell').forEach(c=>c.classList.remove('active'));btn.classList.add('active');cellsFor(w).forEach(p=>document.querySelector(`.cell[data-key="${p.join('-')}"]`).classList.add('active'));getCell(w.r,w.c).focus()}
function clearMarks(){document.querySelectorAll('.cell').forEach(c=>c.classList.remove('correct','wrong'));feedback.textContent='';feedback.className='feedback'}
function checkAnswers(){let ok=true,filled=true,correctCount=0;document.querySelectorAll('.cell').forEach(cell=>{const input=cell.querySelector('input'),expected=answerByCell[cell.dataset.key];cell.classList.remove('correct','wrong');if(!input.value){filled=false;ok=false}else if(input.value===expected){cell.classList.add('correct');correctCount++}else{cell.classList.add('wrong');ok=false}});scoreValue.textContent=Math.round(correctCount/cellCount*100);if(ok){feedback.textContent='Semua jawaban benar!';feedback.className='feedback good';document.getElementById('finishTitle').textContent=`Level ${levelIndex+1} Selesai!`;document.getElementById('finishText').textContent=`Hebat! Kamu menyelesaikan ${activeWords.length} soal.`;document.getElementById('nextBtn').textContent=levelIndex<2?`Lanjut ke Level ${levelIndex+2}`:'Main Lagi dari Level 1';finishTimer=setTimeout(()=>{document.getElementById('finish').style.display='flex';finishTimer=null},350)}else{feedback.textContent=filled?'Masih ada huruf yang belum tepat.':'Lengkapi semua kotak dahulu.';feedback.className='feedback bad'}}
function resetGrid(){clearTimeout(finishTimer);finishTimer=null;document.querySelectorAll('.cell input').forEach(i=>i.value='');document.querySelectorAll('.cell').forEach(c=>c.classList.remove('correct','wrong','active'));document.querySelectorAll('.clue').forEach(c=>c.classList.remove('active'));feedback.textContent='';feedback.className='feedback';scoreValue.textContent='0';document.getElementById('finish').style.display='none';document.querySelector('.cell input')?.focus()}function nextLevel(){selectLevel(levelIndex<2?levelIndex+1:0)}buildLevel();
</script></body></html>
