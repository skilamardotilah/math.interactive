<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>Kebun Cerita - Penjumlahan &amp; Pengurangan Sehari-hari</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Lato:wght@400;700;900&family=Londrina+Solid:wght@300;400&display=swap");

      :root {
        --dusk-top: #3d2a63;
        --dusk-horizon: #e0793c;
        --ground-warm: #6b4423;
        --white: #ffffff;
        --ink: #3a3a3a;
        --coral: #ff6b6b;
        --leaf-green: #4cd787;
        --amber: #e8a33d;
        --text-on-dark: #fff3e2;
        --card-shadow: 0 10px 0 rgba(0, 0, 0, 0.08);
        --brand-ink: #17121f;
        --brand-yellow: #ffd84d;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: "Nunito", sans-serif;
        color: var(--ink);
        min-height: 100vh;
        padding: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #dbc59a;
      }

      .page-shell {
        width: 100%;
        max-width: 860px;
        margin: auto;
      }
      .sim-container {
        width: 100%;
        background: #fff;
        border: 2px solid var(--brand-ink);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 7px 7px 0 var(--brand-ink);
      }

      .navy-header {
        background: var(--brand-ink);
        color: #fff;
        padding: 14px 22px;
        border-bottom: 4px solid var(--brand-yellow);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        row-gap: 10px;
      }
      .header-brand {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .header-bank-picker {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin-left: auto;
      }
      .picker-label {
        margin: 0;
        color: #e9e1d0;
        font-family: "Lato", sans-serif;
        font-weight: 700;
        font-size: 0.7rem;
      }
      .navy-header img {
        width: 50px;
        height: 50px;
        object-fit: contain;
        flex-shrink: 0;
      }
      .navy-header h1 {
        margin: 0;
        color: #fff;
        font-family: "Londrina Solid", cursive;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 0.02em;
      }

      @media (max-width: 600px) {
        .navy-header {
          padding: 12px 14px;
        }
        .navy-header img {
          width: 40px;
          height: 40px;
        }
        .navy-header h1 {
          font-size: 1.15rem;
        }
        .header-bank-picker {
          flex: 1 0 100%;
          margin-left: 0;
        }
        .app-footer {
          padding: 10px 14px;
        }
      }

      /* --- Peta jalur bank soal (di header) --- */
      .bank-map {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stone {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        position: relative;
        cursor: pointer;
        background: none;
        border: none;
        font-family: inherit;
      }
      .stone-circle {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--white);
        border: 3px solid rgba(255, 255, 255, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        transition:
          transform 0.2s ease,
          border-color 0.2s ease,
          box-shadow 0.2s ease;
        position: relative;
      }
      .stone-label {
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 9px;
        color: rgba(233, 225, 208, 0.85);
        text-align: center;
        max-width: 56px;
      }
      .stone.active .stone-circle {
        border-color: var(--brand-yellow);
        box-shadow: 0 0 0 4px rgba(255, 216, 77, 0.35);
        transform: scale(1.12);
      }
      .stone.active .stone-label {
        color: var(--brand-yellow);
      }
      .stone.done .stone-circle {
        border-color: var(--leaf-green);
        background: #eafff1;
      }
      .stone.done .stone-circle::after {
        content: "✔";
        position: absolute;
        bottom: -3px;
        right: -3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--leaf-green);
        color: #fff;
        font-size: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--brand-ink);
      }
      .stone-line {
        width: 20px;
        height: 3px;
        background: rgba(255, 255, 255, 0.25);
        margin: 0 2px 16px;
        border-radius: 2px;
      }
      .stone-line.done {
        background: var(--leaf-green);
      }

      .sim-body {
        position: relative;
        overflow: hidden;
        background: linear-gradient(
          180deg,
          var(--dusk-top) 0%,
          var(--dusk-horizon) 50%,
          var(--ground-warm) 50%,
          var(--ground-warm) 100%
        );
        padding: 14px 0 18px;
      }

      .app-footer {
        background: var(--brand-ink);
        color: rgba(255, 255, 255, 0.72);
        padding: 10px 22px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-family: "Lato", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        border-top: 4px solid var(--brand-yellow);
      }
      .score-badge {
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 16px;
        color: #e9e1d0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .score-badge span.num {
        color: var(--brand-yellow);
      }
      .progress-badge {
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 15px;
        color: #e9e1d0;
      }

      /* --- Dekorasi senja: matahari terbenam & kunang-kunang --- */
      .sunset-sun {
        position: absolute;
        top: 120px;
        right: 30px;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffe6ad, #f2994a);
        box-shadow: 0 0 50px rgba(242, 153, 74, 0.55);
        z-index: 0;
      }
      .firefly {
        position: absolute;
        bottom: -10px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff6b0;
        box-shadow: 0 0 8px 2px rgba(255, 246, 176, 0.85);
        z-index: 0;
        animation: floatUp linear infinite;
      }
      @keyframes floatUp {
        0% {
          transform: translateY(0) translateX(0);
          opacity: 0;
        }
        12% {
          opacity: 1;
        }
        55% {
          transform: translateY(-170px) translateX(16px);
        }
        100% {
          transform: translateY(-360px) translateX(-12px);
          opacity: 0;
        }
      }

      .game-instruction {
        text-align: center;
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 16px;
        color: var(--text-on-dark);
        margin: 2px auto 14px;
        position: relative;
        z-index: 2;
      }
      .instr-dropzone-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        vertical-align: middle;
        margin: 0 2px;
        border: 3px dashed #cfd6c9;
        border-radius: 8px;
        background: #fbfcf9;
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: 11px;
        color: #c3c9bc;
      }

      section.pool-wrap {
        position: relative;
        z-index: 2;
        max-width: 760px;
        margin: 4px auto 0;
        padding: 0 16px;
      }
      .pool-label {
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 15px;
        color: var(--text-on-dark);
        margin: 0 0 6px 4px;
        text-align: center;
      }
      .pool {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.1);
        border: 3px dashed rgba(255, 255, 255, 0.35);
        border-radius: 18px;
        padding: 10px;
      }

      .tile {
        flex: 0 0 auto;
        width: 38px;
        height: 38px;
        background: var(--white);
        border-radius: 11px;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        touch-action: none;
        user-select: none;
        transition: transform 0.15s ease;
        border: 3px solid var(--amber);
      }
      .tile:active {
        cursor: grabbing;
      }
      .tile:hover {
        transform: translateY(-3px);
      }
      .tile .val {
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: 16px;
        color: #a85d18;
      }
      .tile.dragging {
        opacity: 0.35;
      }

      .floating-tile {
        position: fixed;
        z-index: 100;
        pointer-events: none;
        width: 38px;
        height: 38px;
        background: var(--white);
        border-radius: 11px;
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px solid var(--amber);
      }
      .floating-tile .val {
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: 16px;
        color: #a85d18;
      }

      .board-label {
        text-align: center;
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: 18px;
        color: #eee7e7;
        margin: 14px 0 0;
        position: relative;
        z-index: 2;
      }

      .board {
        position: relative;
        z-index: 2;
        max-width: 700px;
        margin: 14px auto 0;
        padding: 0 16px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .board .qcard:last-child {
        grid-column: 1 / -1;
        max-width: 340px;
        margin: 0 auto;
      }
      @media (max-width: 640px) {
        .board {
          grid-template-columns: 1fr;
        }
        .board .qcard:last-child {
          max-width: none;
        }
      }

      .qcard {
        background: var(--white);
        border-radius: 16px;
        padding: 10px 12px 9px;
        box-shadow: var(--card-shadow);
        position: relative;
        border-bottom: 5px solid #f2f2f2;
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-align: left;
      }
      .qcard-top {
        display: flex;
        align-items: flex-start;
        gap: 6px;
      }
      .qcard-icon {
        font-size: 18px;
        flex-shrink: 0;
        line-height: 1.3;
      }
      .qnum {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #f2f2f2;
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 9px;
        color: #8a8a8a;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .qcard-text {
        font-family: "Nunito", sans-serif;
        font-weight: 700;
        font-size: 11.5px;
        line-height: 1.4;
        color: #3a3a3a;
      }
      .qcard-answer-row {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
      }
      .qcard-answer-label {
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        color: #3a5a2f;
        font-size: 11px;
      }

      .dropzone {
        width: 38px;
        height: 38px;
        border: 3px dashed #cfd6c9;
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fbfcf9;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          transform 0.12s ease;
        flex-shrink: 0;
      }
      .dropzone .val {
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: 17px;
        color: #a85d18;
      }
      .dropzone.hover {
        background: #fff3e0;
        border-color: var(--amber);
        transform: scale(1.06);
      }
      .dropzone.correct {
        background: #e4fbe9;
        border: 3px solid var(--leaf-green);
      }
      .dropzone.wrong {
        animation: shake 0.4s ease;
        border-color: var(--coral);
        background: #ffecec;
      }
      .dropzone .qmark {
        font-family: "Fredoka", sans-serif;
        font-size: 16px;
        color: #c3c9bc;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-6px);
        }
        75% {
          transform: translateX(6px);
        }
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(30, 20, 40, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 20px;
      }
      .overlay.show {
        display: flex;
      }
      .modal {
        background: var(--white);
        border-radius: 26px;
        padding: 32px 26px;
        text-align: center;
        max-width: 360px;
        box-shadow: 0 20px 0 rgba(0, 0, 0, 0.15);
      }
      .modal .big-icon {
        font-size: 52px;
      }
      .modal h2 {
        font-family: "Fredoka", sans-serif;
        color: #7a3b17;
        margin: 8px 0;
      }
      .modal p {
        font-weight: 700;
        font-size: 16px;
        margin: 6px 0 20px;
        color: #4a5a44;
      }
      .modal .btn-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .modal button {
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 16px;
        border: none;
        border-radius: 50px;
        padding: 12px 24px;
        cursor: pointer;
      }
      .modal button.primary {
        background: var(--brand-yellow);
        box-shadow: 0 5px 0 #d9a716;
        color: #5b3d00;
      }
      .modal button.secondary {
        background: #eef3ea;
        box-shadow: 0 5px 0 #cdd7c4;
        color: #4a5a44;
      }
      .modal button:active {
        transform: translateY(4px);
        box-shadow: none;
      }

      .confetti {
        position: fixed;
        top: -40px;
        font-size: 22px;
        z-index: 150;
        pointer-events: none;
        animation: fall linear forwards;
      }
      @keyframes fall {
        to {
          transform: translateY(110vh) rotate(360deg);
          opacity: 0.4;
        }
      }
    </style>
  </head>

    <script>
      // ---------- DATA: 3 bank soal cerita (campuran penjumlahan & pengurangan) ----------
      const banks = [
        {
          name: "Kebun Buah",
          emoji: "🍎",
          questions: [
            {

              answer: 8,

            {
              icon: "🍊",
              text: "Budi memetik 6 jeruk pagi ini. Sore harinya ia memetik 4 jeruk lagi. Berapa jeruk yang dipetik Budi hari ini?",

            {
              icon: "🍌",
              text: "Ada 9 pisang di dalam keranjang. Adik memakan 3 pisang. Berapa sisa pisang di keranjang?",
              answer: 6,

            {
              icon: "🍇",
              text: "Kakak mempunyai 10 buah anggur. Ia memberikan 4 anggur untuk temannya. Berapa sisa anggur kakak?",

            {
              icon: "🥭",
              text: "Di atas pohon ada 7 buah mangga. Tumbuh lagi 5 buah mangga yang baru matang. Berapa jumlah mangga sekarang?",
              answer: 12,
            },
          ],
        },
        {
          name: "Kebun Binatang",
          emoji: "🦁",
          questions: [
            {
              icon: "🐘",
              text: "Di kebun binatang ada 8 ekor gajah. Petugas kebun binatang mendatangkan 7 ekor gajah lagi. Berapa jumlah gajah sekarang?",
              answer: 15,
            },
            {
              icon: "🐼",
              text: "Seekor induk panda mempunyai 6 ekor anak. Kebun binatang lain menitipkan 9 ekor anak panda. Berapa banyak anak panda sekarang?",
              answer: 15,
            },
            {
              icon: "🦓",
              text: "Ada 16 ekor zebra merumput di padang kebun binatang. Sebanyak 9 ekor zebra masuk ke kandang. Berapa ekor zebra yang masih merumput di padang?",
              answer: 7,
            },
            {
              icon: "🐒",
              text: "Kebun binatang memiliki 14 ekor monyet. Sebanyak 8 ekor monyet dipindahkan ke kebun binatang baru. Berapa ekor monyet yang tersisa?",
              answer: 6,
            },
            {
              icon: "🐯",
              text: "Ada 9 ekor harimau di area kebun binatang. Kemudian datang 8 ekor harimau baru. Berapa jumlah harimau sekarang?",
              answer: 17,
            },
          ],
        },
        {
          name: "Kebun Bunga",
          emoji: "🌷",
          questions: [
            {
              icon: "🌹",
              text: "Bu Guru menanam 9 tangkai bunga mawar. Karena murid-murid senang melihatnya, ia menanam 8 tangkai mawar lagi. Berapa tangkai mawar yang sudah ditanam Bu Guru?",
              answer: 17,
            },
            {
              icon: "💮",
              text: "Sebuah toko bunga memiliki 18 tangkai melati hari ini. Sampai siang hari, sebanyak 11 tangkai melati sudah terjual. Berapa tangkai melati yang masih tersisa?",
              answer: 7,
            },
            {
              icon: "🌷",
              text: "Di kebun sekolah ada bunga tulip. Ada 7 kuntum tulip berwarna merah dan 9 kuntum tulip berwarna kuning. Berapa jumlah seluruh kuntum tulip di kebun itu?",
              answer: 16,
            },
            {
              icon: "🌺",
              text: "Sebuah vas bunga berisi 15 kuntum anggrek. Untuk hadiah ulang tahun, diambil 9 kuntum anggrek. Berapa kuntum anggrek yang masih tersisa di dalam vas?",
              answer: 6,
            },
            {
              icon: "🌻",
              text: "Kebun bunga matahari memiliki 20 kuntum yang siap dipanen. Petani berhasil memanen 12 kuntum. Berapa kuntum yang belum dipanen?",
              answer: 8,
            },
          ],
        },
      ];

      const BANK_MAX_SCORE = 100;
      document.getElementById("scoreMax").textContent = BANK_MAX_SCORE;

      let bankIndex = 0;
      let score = 0;
      let correctInBank = 0;
      const bankCompleted = banks.map(() => false);

      const pool = document.getElementById("pool");
      const board = document.getElementById("board");
      const scoreVal = document.getElementById("scoreVal");
      const progressVal = document.getElementById("progressVal");
      const overlay = document.getElementById("overlay");
      const bankMap = document.getElementById("bankMap");
      const modalIcon = document.getElementById("modalIcon");
      const modalTitle = document.getElementById("modalTitle");
      const modalMsg = document.getElementById("modalMsg");
      const modalBtnPrimary = document.getElementById("modalBtnPrimary");
      const modalBtnSecondary = document.getElementById("modalBtnSecondary");

      // Kartu jawaban: angka 1-20, tanpa gambar
      for (let n = 1; n <= 20; n++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.dataset.value = n;
        tile.innerHTML = `<span class="val">${n}</span>`;
        pool.appendChild(tile);
      }

      function renderMap() {
        bankMap.innerHTML = "";
        banks.forEach((b, i) => {
          const stone = document.createElement("button");
          stone.className = "stone";
          stone.dataset.i = i;
          stone.type = "button";
          stone.innerHTML = `<div class="stone-circle">${b.emoji}</div><div class="stone-label">${b.name}</div>`;
          stone.addEventListener("click", () => loadBank(i));
          bankMap.appendChild(stone);
          if (i < banks.length - 1) {
            const line = document.createElement("div");
            line.className = "stone-line";
            line.dataset.i = i;
            bankMap.appendChild(line);
          }
        });
        updateMap();
      }

      function updateMap() {
        document.querySelectorAll(".stone").forEach((el) => {
          const i = parseInt(el.dataset.i, 10);
          el.classList.toggle("active", i === bankIndex);
          el.classList.toggle("done", bankCompleted[i]);
        });
        document.querySelectorAll(".stone-line").forEach((el) => {
          const i = parseInt(el.dataset.i, 10);
          el.classList.toggle("done", bankCompleted[i]);
        });
      }

      function loadBank(idx) {
        overlay.classList.remove("show");
        bankIndex = idx;
        correctInBank = 0;
        score = 0;
        scoreVal.textContent = score;
        const bank = banks[idx];
        progressVal.textContent = `Benar: 0 / ${bank.questions.length}`;

        board.innerHTML = "";
        bank.questions.forEach((q, i) => {
          const card = document.createElement("div");
          card.className = "qcard";
          card.innerHTML = `
        <div class="qcard-top">
          <span class="qnum">${i + 1}</span>
          <span class="qcard-icon">${q.icon}</span>
          <p class="qcard-text">${q.text}</p>
        </div>
        <div class="qcard-answer-row">
          <span class="qcard-answer-label">Jawaban:</span>
          <div class="dropzone" data-answer="${q.answer}" data-solved="false">
            <span class="qmark">?</span>
          </div>
        </div>
      `;
          board.appendChild(card);
        });

        updateMap();
      }

      renderMap();
      loadBank(0);

      let dragTile = null;
      let floatingEl = null;

      function startDrag(e, tile) {
        dragTile = tile;
        tile.classList.add("dragging");
        floatingEl = document.createElement("div");
        floatingEl.className = "floating-tile";
        floatingEl.innerHTML = tile.innerHTML;
        document.body.appendChild(floatingEl);
        moveFloating(e);
      }

      function moveFloating(e) {
        if (!floatingEl) return;
        const point = e.touches ? e.touches[0] : e;
        floatingEl.style.left = point.clientX - 26 + "px";
        floatingEl.style.top = point.clientY - 26 + "px";

        document
          .querySelectorAll(".dropzone")
          .forEach((dz) => dz.classList.remove("hover"));
        const under = document.elementFromPoint(point.clientX, point.clientY);
        const dz = under ? under.closest(".dropzone") : null;
        if (dz && dz.dataset.solved === "false") {
          dz.classList.add("hover");
        }
      }

      function endDrag(e) {
        if (!dragTile) return;
        const point = e.changedTouches ? e.changedTouches[0] : e;
        const under = document.elementFromPoint(point.clientX, point.clientY);
        const dz = under ? under.closest(".dropzone") : null;
        if (dz) {
          handleDrop(dz, dragTile);
        }

        dragTile.classList.remove("dragging");
        document
          .querySelectorAll(".dropzone")
          .forEach((z) => z.classList.remove("hover"));
        if (floatingEl) {
          floatingEl.remove();
          floatingEl = null;
        }
        dragTile = null;
      }

      function handleDrop(dz, tile) {
        if (dz.dataset.solved === "true") return;
        const answer = parseInt(dz.dataset.answer, 10);
        const value = parseInt(tile.dataset.value, 10);

        if (value === answer) {
          dz.innerHTML = `<span class="val">${value}</span>`;
          dz.classList.add("correct");
          dz.dataset.solved = "true";
          const pointsPerQuestion =
            BANK_MAX_SCORE / banks[bankIndex].questions.length;
          score += pointsPerQuestion;
          correctInBank += 1;
          scoreVal.textContent = score;
          progressVal.textContent = `Benar: ${correctInBank} / ${banks[bankIndex].questions.length}`;

          if (correctInBank === banks[bankIndex].questions.length) {
            bankCompleted[bankIndex] = true;
            updateMap();
            setTimeout(showBankComplete, 500);
          }
        } else {
          dz.classList.remove("wrong");
          void dz.offsetWidth;
          dz.classList.add("wrong");
          setTimeout(() => dz.classList.remove("wrong"), 400);
        }
      }

      function attachTileEvents() {
        document.querySelectorAll(".tile").forEach((tile) => {
          tile.addEventListener("mousedown", (e) => {
            e.preventDefault();
            startDrag(e, tile);
          });
          tile.addEventListener(
            "touchstart",
            (e) => {
              startDrag(e, tile);
            },
            { passive: true },
          );
        });
      }
      attachTileEvents();

      window.addEventListener("mousemove", (e) => {
        if (dragTile) moveFloating(e);
      });
      window.addEventListener(
        "touchmove",
        (e) => {
          if (dragTile) {
            moveFloating(e);
            e.preventDefault();
          }
        },
        { passive: false },
      );
      window.addEventListener("mouseup", (e) => {
        if (dragTile) endDrag(e);
      });
      window.addEventListener("touchend", (e) => {
        if (dragTile) endDrag(e);
      });

      function showBankComplete() {
        const finishedBank = banks[bankIndex];
        const allDone = bankCompleted.every(Boolean);

        if (allDone) {
          modalIcon.textContent = score === BANK_MAX_SCORE ? "🏆" : "🌟";
          modalTitle.textContent = "Semua Kebun Selesai!";
          modalMsg.textContent = `Skor ${finishedBank.name}: ${score}/${BANK_MAX_SCORE}`;
          modalBtnPrimary.style.display = "none";
          modalBtnSecondary.textContent = "Tutup";
          modalBtnSecondary.onclick = () => {
            overlay.classList.remove("show");
          };
          overlay.classList.add("show");
          launchConfetti(30);
          return;
        }

        const hasNext = bankIndex < banks.length - 1;
        modalIcon.textContent = "🎉";
        modalTitle.textContent = `${finishedBank.name} selesai!`;
        modalMsg.textContent = `Kerja bagus! Skor kamu: ${score}/${BANK_MAX_SCORE}`;

        if (hasNext) {
          const nextBank = banks[bankIndex + 1];
          modalBtnPrimary.style.display = "inline-block";
          modalBtnPrimary.textContent = `Lanjut ke ${nextBank.name} ▶`;
          modalBtnPrimary.onclick = () => loadBank(bankIndex + 1);
        } else {
          modalBtnPrimary.style.display = "none";
        }

        modalBtnSecondary.textContent = "Selesai, Cukup Dulu 👋";
        modalBtnSecondary.onclick = () => {
          overlay.classList.remove("show");
        };

        overlay.classList.add("show");
        launchConfetti(16);
      }

      function launchConfetti(count) {
        const emojis = ["✨", "🌟", "🎉", "🍎", "🐰", "🌷"];
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            const c = document.createElement("div");
            c.className = "confetti";
            c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            c.style.left = Math.random() * 100 + "vw";
            c.style.animationDuration = 2 + Math.random() * 1.5 + "s";
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 3600);
          }, i * 60);
        }
      }
    </script>
  </body>
</html>
