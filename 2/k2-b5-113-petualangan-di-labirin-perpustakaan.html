<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Petualangan Tika di Perpustakaan</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Lato:wght@400;700;900&family=Londrina+Solid:wght@300;400&display=swap");
      :root {
        --ink: #17121f;
        --yellow: #ffd84d;
        --sky: #d0e7f7;
        --pink: #ffe5ee;
        --cream: #fff7df;
        --mint: #e8f8ea;
        --brown: #8b5a2b;
        --blue: #4dd0e1;
        --text: #4c3d38;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        padding: 18px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--sky);
        color: var(--text);
        font-family: "Nunito", sans-serif;
      }
      .page-shell {
        width: 100%;
        max-width: 860px;
        margin: auto;
      }
      .sim-container {
        background: #fff;
        border: 2px solid var(--ink);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 7px 7px 0 var(--ink);
      }
      .navy-header {
        background: var(--ink);
        color: #fff;
        padding: 14px 22px;
        border-bottom: 4px solid var(--yellow);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .header-brand {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .header-brand img {
        width: 50px;
        height: 50px;
        object-fit: contain;
      }
      .header-brand h1 {
        font-family: "Londrina Solid", cursive;
        font-weight: 400;
        font-size: 1.65rem;
        margin: 0;
        letter-spacing: 0.02em;
      }
      .progress {
        font-family: "Fredoka";
        font-weight: 600;
        color: #e9e1d0;
      }
      .progress b {
        color: var(--yellow);
      }
      .sim-body {
        position: relative;
        overflow: hidden;
        padding: 22px 18px 18px;
        background: linear-gradient(
          180deg,
          #ffe5ee 0%,
          #fff7df 55%,
          #e8f8ea 100%
        );
      }
      .decor {
        position: absolute;
        pointer-events: none;
        opacity: 0.58;
        font-size: 38px;
        z-index: 0;
      }
      .d1 {
        left: 22px;
        top: 18px;
      }
      .d2 {
        right: 24px;
        top: 22px;
      }
      .d3 {
        right: 7%;
        bottom: 18px;
      }
      .d4 {
        left: 6%;
        bottom: 20px;
      }
      .content {
        position: relative;
        z-index: 2;
        max-width: 790px;
        margin: auto;
      }
      .instruction {
        text-align: center;
        font-weight: 900;
        margin: 0 auto 13px;
        color: #72594f;
        font-size: 16px;
      }
      #target-display {
        width: max-content;
        max-width: 95%;
        margin: 0 auto 14px;
        background: #fff;
        padding: 7px 15px;
        border-radius: 999px;
        border: 2px solid #efb7c8;
        font-family: "Fredoka";
        font-weight: 600;
        color: #a44d6b;
        text-align: center;
      }
      #game-container {
        position: relative;
        background: #fff;
        border: 3px solid #d69b70;
        border-radius: 28px;
        padding: 12px;
        box-shadow: 0 8px 0 rgba(116, 76, 52, 0.11);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 52vh;
        min-height: 390px;
        max-height: 540px;
        overflow: hidden;
      }
      canvas {
        display: block;
        border-radius: 16px;
        background: #fff;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(3, 52px);
        gap: 7px;
        justify-content: center;
        margin: 13px auto 0;
        width: max-content;
      }
      .d-btn {
        width: 52px;
        height: 52px;
        background: var(--yellow);
        border: 0;
        border-radius: 50%;
        font-size: 22px;
        color: #5b3d00;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.16);
        cursor: pointer;
        font-family: "Fredoka";
      }
      .d-btn:active {
        transform: translateY(4px);
        box-shadow: none;
      }
      .d-btn.up {
        grid-column: 2;
      }
      .d-btn.left {
        grid-column: 1;
        grid-row: 2;
      }
      .d-btn.down {
        grid-column: 2;
        grid-row: 2;
      }
      .d-btn.right {
        grid-column: 3;
        grid-row: 2;
      }
      .app-footer {
        background: var(--ink);
        color: rgba(255, 255, 255, 0.74);
        padding: 10px 22px;
        border-top: 4px solid var(--yellow);
        display: flex;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
        font:
          700 0.75rem "Lato",
          sans-serif;
      }
      #modal-overlay,
      #door-overlay {
        position: absolute;
        inset: 0;
        background: rgba(40, 26, 35, 0.58);
        display: none;
        justify-content: center;
        align-items: center;
        border-radius: 20px;
        z-index: 30;
        padding: 16px;
      }
      .modal-content {
        background: #fff;
        padding: 22px;
        border-radius: 22px;
        text-align: center;
        border: 4px solid #efb7c8;
        max-width: 500px;
        width: 88%;
        box-shadow: 0 12px 0 rgba(0, 0, 0, 0.12);
      }
      .modal-content h2 {
        font-family: "Fredoka";
        color: #7b3d54;
        margin: 4px 0 8px;
        font-size: 1.55rem;
      }
      .modal-content p {
        font-weight: 800;
        margin: 6px 0 14px;
      }
      .door-icon {
        font-size: 42px;
      }
      #door-hint {
        font-family: "Fredoka";
        color: #72594f;
      }
      #shape-choices {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .shape-choice {
        border: 3px solid #ead8ce;
        background: #fff;
        border-radius: 16px;
        padding: 10px 5px;
        cursor: pointer;
        font-family: "Fredoka";
        font-weight: 600;
        color: #5e4b43;
        font-size: 0.95rem;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
      }
      .shape-choice:hover {
        border-color: #efb7c8;
        background: #fff8fb;
      }
      .shape-choice .shape-pic {
        font-size: 34px;
        display: block;
        margin-bottom: 4px;
      }

      .shape-choice .shape-pic img {
        width: 82px;
        height: 72px;
        object-fit: contain;
        display: block;
        margin: 0 auto 5px;
      }

      .shape-choice.wrong {
        border-color: #ef6461;
        background: #fff0f0;
      }
      #door-feedback {
        min-height: 25px;
        margin-top: 10px;
        font-family: "Fredoka";
        font-weight: 600;
      }
      .restart-btn {
        background: var(--yellow);
        color: #5b3d00;
        border: 0;
        padding: 11px 20px;
        border-radius: 999px;
        font-family: "Fredoka";
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.14);
      }
      @media (min-width: 768px) {
        .controls {
          display: grid;
        }
      }
      @media (max-width: 620px) {
        body {
          padding: 10px;
          align-items: flex-start;
        }
        .navy-header {
          padding: 12px 14px;
        }
        .header-brand img {
          width: 40px;
          height: 40px;
        }
        .header-brand h1 {
          font-size: 1.25rem;
        }
        .sim-body {
          padding: 17px 10px 14px;
        }
        #game-container {
          min-height: 350px;
          height: 50vh;
        }
        #shape-choices {
          grid-template-columns: 1fr;
        }
        .shape-choice {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
        }
        .shape-choice .shape-pic {
          margin: 0;
        }
        .app-footer {
          padding: 9px 14px;
        }
      }
    </style>
  </head>

                  <p>Tika berhasil mengambil <span id="win-item"></span>!</p>
                  <p
                    style="
                      font-family: &quot;Fredoka&quot;;
                      font-size: 1.15rem;
                      color: #7b3d54;
                    "
                  >
                    Skor akhir: <b><span id="finalScore">0</span> / 100</b>
                  </p>
                  <button class="restart-btn" onclick="game.init()">
                    Main Lagi
                  </button>

              </div>
            </div>
            <div
              id="target-display"
              style="margin-top: 28px; margin-bottom: 14px"
            >
              Gunakan tombol arah untuk main!
            </div>
            <div class="controls">
              <button class="d-btn up" onclick="game.movePlayer(0, -1)">
                ⬆️
              </button>
              <button class="d-btn left" onclick="game.movePlayer(-1, 0)">
                ⬅️
              </button>
              <button class="d-btn down" onclick="game.movePlayer(0, 1)">
                ⬇️
              </button>
              <button class="d-btn right" onclick="game.movePlayer(1, 0)">
                ➡️
              </button>
            </div>
          </div>

          <div id="footerProgress">
            Skor: 0 / 100
          </div>
        </footer>
      </div>
    </div>
    <script>
      class Cell {
        constructor(c, r) {
          this.c = c;
          this.r = r;
          this.walls = [true, true, true, true];
          this.visited = false;
        }
      }

      class MazeGame {
        constructor(canvasId) {
          this.canvas = document.getElementById(canvasId);
          this.ctx = this.canvas.getContext("2d");
          this.container = document.getElementById("game-container");
          this.modal = document.getElementById("modal-overlay");
          this.targetDisplay = document.getElementById("target-display");
          this.winItemSpan = document.getElementById("win-item");
          this.goalEmoji = "📚";
          this.doors = [];
          this.openedDoors = new Set();
          this.pendingMove = null;
          this.activeDoor = null;
          this.doorOverlay = document.getElementById("door-overlay");
          this.doorTitle = document.getElementById("door-title");
          this.doorHint = document.getElementById("door-hint");
          this.shapeChoices = document.getElementById("shape-choices");
          this.doorFeedback = document.getElementById("door-feedback");
          this.doorCount = document.getElementById("doorCount");
          this.footerProgress = document.getElementById("footerProgress");
          this.finalScore = document.getElementById("finalScore");
          this.score = 0;
          this.wrongDoors = new Set();
          // Set soal baru setiap kali permainan dimulai agar kunci tiap pintu bervariasi.
          this.gameQuestions = this.createQuestionSet();
          this.updateProgress();

          // Labirin dibuat 6 × 6 agar tetap ramah untuk siswa kelas 2 SD.
          this.cols = 6;
          this.rows = 6;
          this.size = 0;

          this.grid = [];
          this.player = { c: 0, r: 0 };
          this.goal = { c: 0, r: 0 };
          this.isGameOver = false;

          document.addEventListener("keydown", this.handleInput.bind(this));

          const resizeObserver = new ResizeObserver(() => {
            this.resize();
            this.draw();
          });
          resizeObserver.observe(this.container);

          this.init();
        }

        // Ukuran tetap 6 × 6: sederhana dan mudah diikuti siswa kelas 2 SD.
        randomizeDimensions() {
          this.cols = 6;
          this.rows = 6;
        }

        resize() {
          const width = this.container.clientWidth;
          const height = this.container.clientHeight;
          const padding = 20;
          const availableW = width - padding;
          const availableH = height - padding;

          // 计算每个格子的最大可能大小
          const sizeW = availableW / this.cols;
          const sizeH = availableH / this.rows;

          // 取较小值以确保整个迷宫都能放入容器
          this.size = Math.min(sizeW, sizeH);

          // 根据格子大小反推画布实际大小
          this.canvas.width = this.size * this.cols;
          this.canvas.height = this.size * this.rows;
        }

        init() {
          this.isGameOver = false;
          this.modal.style.display = "none";
          this.doorOverlay.style.display = "none";
          this.openedDoors = new Set();
          this.score = 0;
          this.wrongDoors = new Set();
          this.updateProgress();
          this.pendingMove = null;
          this.activeDoor = null;
          this.grid = [];
          this.player = { c: 0, r: 0 };

          // 1. 随机迷宫形状
          this.randomizeDimensions();
          // 2. Tujuan tetap: Tika ingin mengambil buku.
          this.goalEmoji = "📚";
          this.targetDisplay.textContent = "Gunakan tombol arah untuk main!";
          this.winItemSpan.textContent = "buku 📚";

          // 3. 设置终点
          this.goal = { c: this.cols - 1, r: this.rows - 1 };

          // 4–5. Buat labirin yang tetap sederhana, tetapi punya beberapa belokan.
          // Dicoba beberapa kali supaya jalur utama tidak terlalu lurus atau terlalu pendek.
          let attempts = 0;
          let path = [];
          do {
            this.grid = [];
            for (let r = 0; r < this.rows; r++) {
              for (let c = 0; c < this.cols; c++) {
                this.grid.push(new Cell(c, r));
              }
            }
            this.current = this.grid[0];
            this.generateMaze();
            path = this.getSolutionPath();
            attempts++;
          } while (
            attempts < 30 &&
            (path.length < 12 || this.countTurns(path) < 4)
          );

          // 6. Tetap hanya 5 pintu = 5 soal pada jalur menuju buku.
          this.placeDoorsOnSolutionPath();

          // 7. Sesuaikan ukuran dan gambar.
          this.resize();
          this.draw();
        }

        index(c, r) {
          if (c < 0 || r < 0 || c > this.cols - 1 || r > this.rows - 1)
            return -1;
          return c + r * this.cols;
        }

        generateMaze() {
          let stack = [];
          this.current.visited = true;
          stack.push(this.current);

          while (stack.length > 0) {
            this.current = stack.pop();
            let next = this.checkNeighbors(this.current);

            if (next) {
              stack.push(this.current);
              this.removeWalls(this.current, next);
              next.visited = true;
              stack.push(next);
            }
          }
        }

        checkNeighbors(cell) {
          let neighbors = [];
          let top = this.grid[this.index(cell.c, cell.r - 1)];
          let right = this.grid[this.index(cell.c + 1, cell.r)];
          let bottom = this.grid[this.index(cell.c, cell.r + 1)];
          let left = this.grid[this.index(cell.c - 1, cell.r)];

          if (top && !top.visited) neighbors.push(top);
          if (right && !right.visited) neighbors.push(right);
          if (bottom && !bottom.visited) neighbors.push(bottom);
          if (left && !left.visited) neighbors.push(left);

          if (neighbors.length > 0) {
            let r = Math.floor(Math.random() * neighbors.length);
            return neighbors[r];
          }
          return undefined;
        }

        removeWalls(a, b) {
          let x = a.c - b.c;
          if (x === 1) {
            a.walls[3] = false;
            b.walls[1] = false;
          }
          if (x === -1) {
            a.walls[1] = false;
            b.walls[3] = false;
          }

          let y = a.r - b.r;
          if (y === 1) {
            a.walls[0] = false;
            b.walls[2] = false;
          }
          if (y === -1) {
            a.walls[2] = false;
            b.walls[0] = false;
          }
        }

        getSolutionPath() {
          const start = { c: 0, r: 0 };
          const goal = this.goal;
          const queue = [start];
          const prev = new Map();
          const key = (c, r) => `${c},${r}`;
          prev.set(key(start.c, start.r), null);
          while (queue.length) {
            const cur = queue.shift();
            if (cur.c === goal.c && cur.r === goal.r) break;
            const cell = this.grid[this.index(cur.c, cur.r)];
            const moves = [
              [0, -1, 0],
              [1, 0, 1],
              [0, 1, 2],
              [-1, 0, 3],
            ];
            for (const [dc, dr, wi] of moves) {
              if (cell.walls[wi]) continue;
              const nc = cur.c + dc,
                nr = cur.r + dr,
                k = key(nc, nr);
              if (this.index(nc, nr) < 0 || prev.has(k)) continue;
              prev.set(k, cur);
              queue.push({ c: nc, r: nr });
            }
          }
          const path = [];
          let cur = { ...goal };
          while (cur) {
            path.push(cur);
            cur = prev.get(key(cur.c, cur.r));
          }
          return path.reverse();
        }

        countTurns(path) {
          let turns = 0;
          let previousDirection = null;
          for (let i = 1; i < path.length; i++) {
            const dc = path[i].c - path[i - 1].c;
            const dr = path[i].r - path[i - 1].r;
            const direction = `${dc},${dr}`;
            if (previousDirection && direction !== previousDirection) turns++;
            previousDirection = direction;
          }
          return turns;
        }

        placeDoorsOnSolutionPath() {
          const path = this.getSolutionPath();
          this.doors = [];
          if (path.length < 7) return;
          const needs = ["datar", "lengkung", "datar", "lengkung", "lengkung"];
          const used = new Set();
          for (let i = 1; i <= 5; i++) {
            let idx = Math.round((i * (path.length - 2)) / 6);
            idx = Math.max(1, Math.min(path.length - 2, idx));
            while (used.has(idx) && idx < path.length - 2) idx++;
            used.add(idx);
            const a = path[idx],
              b = path[idx + 1];
            this.doors.push({
              id: i - 1,
              a: { ...a },
              b: { ...b },
              need: needs[i - 1],
              label: `Pintu ${i}`,
            });
          }
        }

        doorBetween(c1, r1, c2, r2) {
          return this.doors.find(
            (d) =>
              (d.a.c === c1 && d.a.r === r1 && d.b.c === c2 && d.b.r === r2) ||
              (d.b.c === c1 && d.b.r === r1 && d.a.c === c2 && d.a.r === r2),
          );
        }

        shuffleArray(items) {
          const arr = [...items];
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        }

        createQuestionSet() {
          // Materi hanya mengelompokkan bangun ruang berdasarkan sisi datar/lengkung.
          // Setiap soal hanya memiliki SATU pilihan yang sesuai dengan kategori pada soal.
          const bank = [
            {
              need: "datar",
              prompt: "Pilih bangun ruang sisi datar.",
              correct: "Balok",
              distractors: ["Bola", "Kerucut", "Tabung"],
            },
            {
              need: "datar",
              prompt: "Pilih bangun ruang sisi datar.",
              correct: "Prisma segi lima",
              distractors: ["Bola", "Kerucut", "Tabung"],
            },
            {
              need: "lengkung",
              prompt: "Pilih bangun ruang sisi lengkung.",
              correct: "Kerucut",
              distractors: ["Kubus", "Balok", "Prisma segi lima"],
            },
            {
              need: "lengkung",
              prompt: "Pilih bangun ruang sisi lengkung.",
              correct: "Bola",
              distractors: ["Kubus", "Balok", "Prisma segi lima"],
            },
            {
              need: "lengkung",
              prompt: "Pilih bangun ruang sisi lengkung.",
              correct: "Tabung",
              distractors: ["Kubus", "Balok", "Prisma segi lima"],
            },
          ];

          return this.shuffleArray(bank).map((q) => {
            const wrong = this.shuffleArray(q.distractors).slice(0, 2);
            return {
              ...q,
              options: this.shuffleArray([q.correct, ...wrong]),
            };
          });
        }

          const q = this.gameQuestions[door.id];
          door.need = q.need;

          this.doorTitle.textContent = `${door.label} Terkunci!`;
          this.doorHint.textContent = q.prompt;
          this.doorFeedback.textContent = "";
          this.shapeChoices.innerHTML = "";

          q.options.forEach((name) => {
            const btn = document.createElement("button");
            btn.className = "shape-choice";
            btn.innerHTML = `<span class="shape-pic"><img src="${shapePics[name]}" alt="${name}"></span><span>${name}</span>`;
            btn.onclick = () => {
              if (name === q.correct) {
                const firstTry =
                  !this.openedDoors.has(door.id) &&
                  !this.wrongDoors.has(door.id);
                if (firstTry) this.score += 20;
                this.openedDoors.add(door.id);
                this.doorFeedback.style.color = "#278c52";
                this.doorFeedback.textContent = firstTry
                  ? "Benar! +20 poin. Pintu terbuka!"
                  : "Benar! Pintu terbuka. Lanjutkan perjalanan!";
                this.updateProgress();
                setTimeout(() => {
                  this.doorOverlay.style.display = "none";
                  const m = this.pendingMove;
                  this.activeDoor = null;
                  this.pendingMove = null;
                  if (m) this.movePlayer(m.dc, m.dr, true);
                }, 450);
              } else {
                this.wrongDoors.add(door.id);
                btn.classList.add("wrong");
                this.doorFeedback.style.color = "#d94f4b";
                this.doorFeedback.textContent = "Belum tepat. Coba lagi!";
                setTimeout(() => btn.classList.remove("wrong"), 400);
              }
            };
            this.shapeChoices.appendChild(btn);
          });
          this.doorOverlay.style.display = "flex";
        }

        updateProgress() {
          const n = this.openedDoors.size;
          if (this.doorCount) this.doorCount.textContent = n;
          if (this.footerProgress)
            this.footerProgress.textContent = `Skor: ${this.score} / 100`;
        }

        drawTikaHead(c, r) {
          const cx = c * this.size + this.size / 2,
            cy = r * this.size + this.size / 2;
          const R = this.size * 0.29;
          const ctx = this.ctx;
          ctx.save();
          // hair
          ctx.fillStyle = "#3b2a24";
          ctx.beginPath();
          ctx.arc(cx, cy - R * 0.18, R, Math.PI, 0);
          ctx.fill();
          // face
          ctx.fillStyle = "#f4bd8b";
          ctx.beginPath();
          ctx.arc(cx, cy, R * 0.82, 0, Math.PI * 2);
          ctx.fill();
          // hair fringe
          ctx.fillStyle = "#3b2a24";
          ctx.beginPath();
          ctx.arc(cx - R * 0.25, cy - R * 0.62, R * 0.35, Math.PI, Math.PI * 2);
          ctx.arc(cx + R * 0.18, cy - R * 0.66, R * 0.36, Math.PI, Math.PI * 2);
          ctx.fill();
          // eyes
          ctx.fillStyle = "#263238";
          ctx.beginPath();
          ctx.arc(cx - R * 0.27, cy - R * 0.08, R * 0.07, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(cx + R * 0.27, cy - R * 0.08, R * 0.07, 0, Math.PI * 2);
          ctx.fill();
          // smile
          ctx.strokeStyle = "#9b4b43";
          ctx.lineWidth = Math.max(1.5, R * 0.08);
          ctx.beginPath();
          ctx.arc(cx, cy + R * 0.1, R * 0.28, 0.15 * Math.PI, 0.85 * Math.PI);
          ctx.stroke();
          ctx.restore();
        }

        drawDoors() {
          const ctx = this.ctx,
            s = this.size;
          this.doors.forEach((d) => {
            if (this.openedDoors.has(d.id)) return;
            const ax = d.a.c,
              ay = d.a.r,
              bx = d.b.c,
              by = d.b.r;
            let x1, y1, x2, y2;
            if (ax !== bx) {
              const x = Math.max(ax, bx) * s;
              x1 = x;
              x2 = x;
              y1 = ay * s + s * 0.16;
              y2 = ay * s + s * 0.84;
            } else {
              const y = Math.max(ay, by) * s;
              y1 = y;
              y2 = y;
              x1 = ax * s + s * 0.16;
              x2 = ax * s + s * 0.84;
            }
            ctx.save();
            ctx.strokeStyle = "#8b5a2b";
            ctx.lineWidth = Math.max(5, s * 0.18);
            ctx.lineCap = "butt";
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.strokeStyle = "#f2c14e";
            ctx.lineWidth = Math.max(2, s * 0.05);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            const mx = (x1 + x2) / 2,
              my = (y1 + y2) / 2;
            ctx.fillStyle = "#fff7d6";
            ctx.strokeStyle = "#6d4c41";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(mx, my, Math.max(8, s * 0.16), 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "#5d4037";
            ctx.font = `bold ${Math.max(9, s * 0.18)}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(String(d.id + 1), mx, my);
            ctx.restore();
          });
        }

        draw() {
          this.ctx.fillStyle = "#FFFFFF";
          this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

          for (let i = 0; i < this.grid.length; i++) {
            this.drawCell(this.grid[i]);
          }

          // Buku tujuan di ujung perpustakaan.
          this.drawEmoji(this.goal.c, this.goal.r, "📚");
          // Lima pintu berada di sela-sela jalur labirin.
          this.drawDoors();
          // Pemain adalah kepala Tika.
          this.drawTikaHead(this.player.c, this.player.r);
        }

        drawCell(cell) {
          let x = cell.c * this.size;
          let y = cell.r * this.size;

          this.ctx.strokeStyle = "#5D4037";
          this.ctx.lineWidth = Math.max(2, this.size / 15);
          this.ctx.lineCap = "round";

          this.ctx.beginPath();
          if (cell.walls[0]) {
            this.ctx.moveTo(x, y);
            this.ctx.lineTo(x + this.size, y);
          }
          if (cell.walls[1]) {
            this.ctx.moveTo(x + this.size, y);
            this.ctx.lineTo(x + this.size, y + this.size);
          }
          if (cell.walls[2]) {
            this.ctx.moveTo(x + this.size, y + this.size);
            this.ctx.lineTo(x, y + this.size);
          }
          if (cell.walls[3]) {
            this.ctx.moveTo(x, y + this.size);
            this.ctx.lineTo(x, y);
          }
          this.ctx.stroke();
        }

        drawEmoji(c, r, emoji) {
          let x = c * this.size + this.size / 2;
          let y = r * this.size + this.size / 2 + this.size * 0.15;
          this.ctx.font = `${this.size * 0.65}px Arial`;
          this.ctx.textAlign = "center";
          this.ctx.textBaseline = "middle";
          this.ctx.fillText(emoji, x, y);
        }

        handleInput(e) {
          if (this.isGameOver) return;
          if (
            ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(
              e.code,
            ) > -1
          ) {
            e.preventDefault();
          }
          if (e.key === "ArrowUp" || e.key === "w") this.movePlayer(0, -1);
          else if (e.key === "ArrowRight" || e.key === "d")
            this.movePlayer(1, 0);
          else if (e.key === "ArrowDown" || e.key === "s")
            this.movePlayer(0, 1);
          else if (e.key === "ArrowLeft" || e.key === "a")
            this.movePlayer(-1, 0);
        }

        movePlayer(dc, dr, bypassDoor = false) {
          if (this.isGameOver || this.activeDoor) return;
          let currentCell = this.grid[this.index(this.player.c, this.player.r)];
          let canMove = false;

          if (dr === -1 && !currentCell.walls[0]) canMove = true;
          if (dc === 1 && !currentCell.walls[1]) canMove = true;
          if (dr === 1 && !currentCell.walls[2]) canMove = true;
          if (dc === -1 && !currentCell.walls[3]) canMove = true;

          if (canMove) {
            const nc = this.player.c + dc,
              nr = this.player.r + dr;
            const door = this.doorBetween(this.player.c, this.player.r, nc, nr);
            if (door && !this.openedDoors.has(door.id) && !bypassDoor) {
              this.showDoorQuestion(door, dc, dr);
              return;
            }
            this.player.c += dc;
            this.player.r += dr;
            this.draw();
            this.checkWin();
          }
        }

        checkWin() {
          if (this.player.c === this.goal.c && this.player.r === this.goal.r) {
            this.isGameOver = true;
            this.celebrate();
            setTimeout(() => {
              if (this.finalScore) this.finalScore.textContent = this.score;
              this.modal.style.display = "flex";
            }, 500);
          }
        }

        celebrate() {
          const colors = [
            "#f44336",
            "#e91e63",
            "#9c27b0",
            "#673ab7",
            "#3f51b5",
            "#2196f3",
            "#03a9f4",
            "#00bcd4",
            "#009688",
            "#4CAF50",
            "#8BC34A",
            "#CDDC39",
            "#FFEB3B",
            "#FFC107",
            "#FF9800",
            "#FF5722",
          ];
          for (let i = 0; i < 100; i++) {
            const confetti = document.createElement("div");
            confetti.style.position = "fixed";
            confetti.style.width = "10px";
            confetti.style.height = "10px";
            confetti.style.backgroundColor =
              colors[Math.floor(Math.random() * colors.length)];
            confetti.style.left = "50%";
            confetti.style.top = "50%";
            confetti.style.zIndex = "100";
            document.body.appendChild(confetti);

            const angle = Math.random() * Math.PI * 2;
            const velocity = 2 + Math.random() * 5;
            const tx = Math.cos(angle) * velocity * 50;
            const ty = Math.sin(angle) * velocity * 50;

            const animation = confetti.animate(
              [
                { transform: "translate(0,0) scale(1)", opacity: 1 },
                {
                  transform: `translate(${tx}px, ${ty}px) scale(0)`,
                  opacity: 0,
                },
              ],
              {
                duration: 1000 + Math.random() * 1000,
                easing: "cubic-bezier(0, .9, .57, 1)",
              },
            );
            animation.onfinish = () => confetti.remove();
          }
        }
      }

      const game = new MazeGame("mazeCanvas");
