<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <title>Melengkapi Pola Bunyi dan Suara</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&family=Lato:wght@700;900&family=Londrina+Solid&display=swap");
      :root {
        --ink: #17121f;
        --yellow: #ffd84d;
        --sky: #d0e7f7;
        --pink: #ffe6ee;
        --cream: #b3e2dc;
        --green: #7c7e96;
        --purple: #8e73c7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--sky);
        font-family: "Nunito", sans-serif;
        color: #59463f;
      }
      .shell {
        width: 100%;
        max-width: 920px;
      }
      .sim {
        background: #fff;
        border: 2px solid var(--ink);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 7px 7px 0 var(--ink);
      }
      .top {
        background: var(--ink);
        color: #fff;
        padding: 14px 22px;
        border-bottom: 4px solid var(--yellow);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand img {
        width: 50px;
        height: 50px;
        object-fit: contain;
      }
      .brand h1 {
        font: 400 1.55rem "Londrina Solid";
        margin: 0;
      }
      .progress {
        font: 600 15px "Fredoka";
        color: #e9e1d0;
      }
      .progress b {
        color: var(--yellow);
      }
      main {
        padding: 27px 20px 30px;
        background: linear-gradient(
          var(--pink),
          var(--cream) 58%,
          var(--green)
        );
        min-height: 535px;
      }
      .content {
        max-width: 820px;
        margin: auto;
      }
      .instruction {
        text-align: center;
        font: 600 clamp(20px, 4vw, 27px) "Fredoka";
        color: #7b3d54;
        margin: 0 0 17px;
      }
      .listen-wrap {
        text-align: center;
        margin-bottom: 18px;
      }
      .listen {
        border: 0;
        border-radius: 999px;
        padding: 12px 21px;
        background: var(--purple);
        color: white;
        font: 600 16px "Fredoka";
        cursor: pointer;
        box-shadow: 0 5px 0 #604d8d;
      }
      .listen:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #604d8d;
      }
      .listen:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .pattern-box {
        background: #fffafc;
        border: 3px solid #edbecd;
        border-radius: 24px;
        padding: 21px 14px;
        box-shadow: 0 7px 0 rgba(0, 0, 0, 0.07);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        flex-wrap: nowrap;
        overflow-x: auto;
      }
      .slot {
        flex: 0 0 91px;
        width: 91px;
        height: 103px;
        border-radius: 18px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .slot.sound {
        border: 2px solid #f0d9df;
      }
      .slot.missing {
        border: 3px dashed #bd91a0;
        background: #fff2f7;
        color: #bd91a0;
        transition: 0.15s;
      }
      .slot.missing.hover {
        background: #f5e8ff;
        border-color: var(--purple);
        transform: scale(1.04);
      }
      .slot.missing.filled {
        border: 3px solid #cbb4d5;
        background: #fff;
      }
      .separator {
        flex: 0 0 24px;
        text-align: center;
        font: 800 25px "Fredoka";
        color: #b7a7ad;
        transition: 0.15s;
      }
      .separator.active {
        color: #7b3d54;
        transform: scale(1.16);
      }
      .sound-card {
        width: 76px;
        height: 78px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .audio-dot {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3e9f7;
        border: 2px solid #d7bedf;
        font: 700 18px "Fredoka";
        color: #765781;
      }
      .audio-dot::after {
        content: "▶";
      }
      .audio-dot.playing::after {
        content: "Ⅱ";
      }
      .missing .qmark {
        font: 700 34px "Fredoka";
      }
      .choice-title {
        text-align: center;
        margin: 23px 0 10px;
        font: 600 16px "Fredoka";
        color: #7a5a50;
      }
      .choices {
        display: flex;
        justify-content: center;
        gap: 13px;
        flex-wrap: wrap;
      }
      .choice {
        width: 108px;
        height: 101px;
        border: 3px solid #ead0d8;
        border-radius: 20px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        touch-action: none;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.08);
        transition: 0.15s;
      }
      .choice:hover {
        transform: translateY(-3px);
      }
      .choice.dragging {
        opacity: 0.25;
      }
      .status {
        min-height: 30px;
        text-align: center;
        margin: 16px 0 3px;
        font: 600 17px "Fredoka";
      }
      .good {
        color: #278c52;
      }
      .bad {
        color: #d94f4b;
      }
      .controls {
        display: flex;
        justify-content: center;
        gap: 10px;
      }
      .controls button,
      .modal button {
        border: 0;
        border-radius: 999px;
        padding: 11px 19px;
        font: 600 15px "Fredoka";
        cursor: pointer;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.14);
      }
      .reset {
        background: #fff;
        border: 2px solid #ead8ce !important;
      }
      .check {
        background: var(--yellow);
        color: #5b3d00;
      }
      .next {
        display: none;
        background: #64cf8a;
        color: #174d2c;
      }
      footer {
        background: var(--ink);
        color: #ffffffbd;
        border-top: 4px solid var(--yellow);
        padding: 10px 22px;
        display: flex;
        justify-content: space-between;
        font: 700 0.75rem "Lato";
      }
      .float-drag {
        position: fixed;
        z-index: 9999;
        pointer-events: none;
        width: 88px;
        height: 88px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        border-radius: 20px;
        filter: drop-shadow(0 8px 5px #0004);
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: #281a2388;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .overlay.show {
        display: flex;
      }
      .modal {
        background: #fff;
        border-radius: 25px;
        padding: 28px;
        text-align: center;
        max-width: 370px;
      }
      .modal .big {
        font-size: 52px;
      }
      .modal h2 {
        font: 600 28px "Fredoka";
        color: #7b3d54;
      }
      .modal button {
        background: var(--yellow);
      }
      @media (max-width: 700px) {
        body {
          padding: 9px;
          align-items: flex-start;
        }
        .top {
          padding: 11px 13px;
        }
        .brand img {
          width: 40px;
          height: 40px;
        }
        .brand h1 {
          font-size: 1.18rem;
        }
        .pattern-box {
          justify-content: flex-start;
          padding: 17px 9px;
        }
        .slot {
          flex-basis: 68px;
          width: 68px;
          height: 91px;
        }
        .choice {
          width: 91px;
          height: 91px;
        }
      }
    </style>
  </head>

        <footer><span id="done">Selesai: 0 / 10</span></footer>
      </div>
    </div>
    <div class="overlay" id="overlay">
      <div class="modal">
        <div class="big">🎵</div>
        <h2>Hebat!</h2>
        <p>Kamu sudah menyelesaikan semua pola bunyi.</p>
        <button id="again">Main Lagi</button>
      </div>
    </div>

    <script>
      const SOUNDS = {
        bird: { name: "Burung bersiul" },
        bell: { name: "Lonceng" },
        clap: { name: "Tepuk tangan" },
        drum: { name: "Drum" },
        water: { name: "Air" },
        wind: { name: "Angin" },
        horn: { name: "Klakson" },
        whistle: { name: "Peluit" },
        rooster: { name: "Ayam berkokok" },
        cat: { name: "Kucing mengeong" },
      };

      // Semua pola sudah disusun dari pola utuh terlebih dahulu, lalu bagian tertentu dihilangkan.
      // Maksimal 2 bunyi hilang per soal.
      const Q = [
        { sound: "drum", seq: [3, 2, 3, 2, null], ans: [3], opts: [1, 2, 3] },
        { sound: "clap", seq: [1, 2, 1, 2, null], ans: [1], opts: [1, 2, 3] },
        { sound: "bell", seq: [2, 3, 2, 3, null], ans: [2], opts: [1, 2, 3] },
        { sound: "horn", seq: [1, 3, 1, 3, null], ans: [1], opts: [1, 2, 3] },
        {
          sound: "whistle",
          seq: [2, 1, 2, 1, null],
          ans: [2],
          opts: [1, 2, 3],
        },
        {
          sound: "water",
          seq: [1, 2, 3, 1, 2, null],
          ans: [3],
          opts: [1, 2, 3],
        },
        { sound: "wind", seq: [3, 1, 3, 1, null], ans: [3], opts: [1, 2, 3] },
        {
          sound: "rooster",
          seq: [1, 1, 2, 1, 1, null],
          ans: [2],
          opts: [1, 2, 3],
        },
        { sound: "cat", seq: [2, 2, 1, 2, 2, null], ans: [1], opts: [1, 2, 3] },
        {
          sound: "bird",
          seq: [1, 3, 2, 1, 3, null],
          ans: [2],
          opts: [1, 2, 3],
        },
      ];

      let qi = 0,
        completed = 0,
        solved = false,
        drag = null,
        floatDrag = null,
        audioCtx = null,
        playing = false;
      const pattern = document.getElementById("pattern"),
        choices = document.getElementById("choices"),
        status = document.getElementById("status");

      function ctx() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }
      function tone(
        freq,
        dur = 0.22,
        type = "sine",
        vol = 0.12,
        delay = 0,
        endFreq = null,
      ) {
        const ac = ctx(),
          o = ac.createOscillator(),
          g = ac.createGain(),
          t = ac.currentTime + delay;
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g);
        g.connect(ac.destination);
        o.start(t);
        o.stop(t + dur + 0.03);
      }
      function noise(dur = 0.16, delay = 0, vol = 0.12, filterFreq = null) {
        const ac = ctx(),
          len = Math.floor(ac.sampleRate * dur),
          buf = ac.createBuffer(1, len, ac.sampleRate),
          d = buf.getChannelData(0);
        for (let i = 0; i < len; i++)
          d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = ac.createBufferSource(),
          g = ac.createGain();
        s.buffer = buf;
        g.gain.value = vol;
        if (filterFreq) {
          const f = ac.createBiquadFilter();
          f.type = "bandpass";
          f.frequency.value = filterFreq;
          f.Q.value = 0.7;
          s.connect(f);
          f.connect(g);
        } else s.connect(g);
        g.connect(ac.destination);
        s.start(ac.currentTime + delay);
      }
      function playSound(k, delay = 0) {
        // Bunyi dibuat langsung di browser dengan Web Audio API, jadi HTML tetap satu file.
        if (k === "bird") {
          tone(1500, 0.1, "sine", 0.34, delay, 2050);
          tone(1850, 0.09, "sine", 0.306, delay + 0.12, 1450);
          tone(1650, 0.1, "sine", 0.272, delay + 0.24, 2200);
          return 0.4;
        }
        if (k === "bell") {
          tone(900, 0.45, "sine", 0.12, delay);
          tone(1350, 0.4, "sine", 0.06, delay + 0.01);
          tone(1800, 0.32, "sine", 0.03, delay + 0.02);
          return 0.48;
        }
        if (k === "clap") {
          noise(0.055, delay, 0.46, 1250);
          noise(0.045, delay + 0.022, 0.34, 2200);
          noise(0.035, delay + 0.05, 0.24, 3200);
          tone(190, 0.055, "triangle", 0.08, delay, 120);
          return 0.18;
        }
        if (k === "drum") {
          tone(150, 0.34, "sine", 0.46, delay, 58);
          tone(82, 0.28, "triangle", 0.25, delay, 48);
          noise(0.075, delay, 0.2, 230);
          return 0.38;
        }
        if (k === "water") {
          for (let i = 0; i < 4; i++)
            tone(
              430 + i * 80,
              0.075,
              "sine",
              0.16,
              delay + i * 0.075,
              650 + i * 50,
            );
          noise(0.3, delay, 0.055, 900);
          return 0.36;
        }
        if (k === "wind") {
          noise(0.48, delay, 0.075, 650);
          noise(0.38, delay + 0.05, 0.035, 1100);
          return 0.52;
        }
        if (k === "horn") {
          tone(260, 0.34, "square", 0.075, delay);
          tone(330, 0.34, "square", 0.045, delay);
          return 0.39;
        }
        if (k === "whistle") {
          tone(1250, 0.38, "sine", 0.1, delay, 1750);
          return 0.43;
        }
        if (k === "rooster") {
          tone(650, 0.13, "sine", 0.09, delay, 980);
          tone(920, 0.18, "sine", 0.1, delay + 0.14, 620);
          tone(720, 0.24, "sine", 0.08, delay + 0.34, 430);
          return 0.62;
        }
        if (k === "cat") {
          tone(650, 0.17, "sine", 0.09, delay, 820);
          tone(790, 0.3, "sine", 0.09, delay + 0.14, 440);
          return 0.48;
        }
      }
      function card(count) {
        return `<div class="sound-card" title="Tekan untuk mendengar"><div class="audio-dot" aria-label="Putar bunyi"></div></div>`;
      }
      function playGroup(sound, count, delay = 0, button = null) {
        let d = delay;
        if (button && delay === 0) {
          button.classList.add("playing");
        }
        for (let i = 0; i < count; i++) {
          const dur = playSound(sound, d);
          d += Math.max(0.42, dur + 0.1);
        }
        const total = d - delay;
        if (button && delay === 0) {
          setTimeout(
            () => button.classList.remove("playing"),
            total * 1000 + 80,
          );
        }
        return total;
      }
      function load() {
        solved = false;
        drag = null;
        status.textContent = "";
        status.className = "status";
        document.getElementById("qnum").textContent = qi + 1;
        pattern.innerHTML = "";
        let miss = 0;
        Q[qi].seq.forEach((count, index) => {
          const s = document.createElement("div");
          s.className = "slot";
          if (count === null) {
            s.classList.add("missing");
            s.dataset.miss = miss++;
            s.innerHTML = '<span class="qmark">?</span>';
          } else {
            s.classList.add("sound");
            s.dataset.count = count;
            s.innerHTML = card(count);
            s.onclick = () =>
              playGroup(Q[qi].sound, count, 0, s.querySelector(".audio-dot"));
          }
          pattern.appendChild(s);
        });
        choices.innerHTML = "";
        Q[qi].opts.forEach((count, optIndex) => {
          const b = document.createElement("div");
          b.className = "choice";
          b.dataset.count = count;
          b.innerHTML = card(count);
          b.onclick = () => {
            if (!drag)
              playGroup(Q[qi].sound, count, 0, b.querySelector(".audio-dot"));
          };
          b.onmousedown = (e) => {
            e.preventDefault();
            startDrag(e, b);
          };
          b.ontouchstart = (e) => startDrag(e, b);
          choices.appendChild(b);
        });
        document.getElementById("check").style.display = "inline-block";
        document.getElementById("next").style.display = "none";
      }
      function point(e) {
        return e.touches
          ? e.touches[0]
          : e.changedTouches
            ? e.changedTouches[0]
            : e;
      }
      function startDrag(e, el) {
        if (solved) return;
        drag = el;
        el.classList.add("dragging");
        floatDrag = document.createElement("div");
        floatDrag.className = "float-drag";
        floatDrag.innerHTML = card(el.dataset.count);
        document.body.appendChild(floatDrag);
        moveDrag(e);
      }
      function moveDrag(e) {
        if (!drag) return;
        const p = point(e);
        floatDrag.style.left = p.clientX - 44 + "px";
        floatDrag.style.top = p.clientY - 44 + "px";
        document
          .querySelectorAll(".slot.missing")
          .forEach((x) => x.classList.remove("hover"));
        document
          .elementFromPoint(p.clientX, p.clientY)
          ?.closest(".slot.missing")
          ?.classList.add("hover");
      }
      function endDrag(e) {
        if (!drag) return;
        const p = point(e),
          target = document
            .elementFromPoint(p.clientX, p.clientY)
            ?.closest(".slot.missing");
        if (target) {
          target.dataset.count = drag.dataset.count;
          target.innerHTML = card(drag.dataset.count);
          target.classList.add("filled");
          target.onclick = () =>
            playGroup(
              Q[qi].sound,
              Number(target.dataset.count),
              0,
              target.querySelector(".audio-dot"),
            );
        }
        drag.classList.remove("dragging");
        document
          .querySelectorAll(".slot.missing")
          .forEach((x) => x.classList.remove("hover"));
        floatDrag.remove();
        floatDrag = null;
        drag = null;
      }
      addEventListener("mousemove", (e) => drag && moveDrag(e));
      addEventListener("mouseup", (e) => drag && endDrag(e));
      addEventListener(
        "touchmove",
        (e) => {
          if (drag) {
            moveDrag(e);
            e.preventDefault();
          }
        },
        { passive: false },
      );
      addEventListener("touchend", (e) => drag && endDrag(e));

      document.getElementById("listen").onclick = () => {
        if (playing) return;
        playing = true;
        document.getElementById("listen").disabled = true;
        let delay = 0;
        const slots = [...pattern.querySelectorAll(".slot")];
        Q[qi].seq.forEach((count, index) => {
          if (count !== null) {
            const start = delay;
            const groupDur = playGroup(Q[qi].sound, count, delay);
            const dot = slots[index]?.querySelector(".audio-dot");
            setTimeout(() => dot && dot.classList.add("playing"), start * 1000);
            setTimeout(
              () => dot && dot.classList.remove("playing"),
              (start + groupDur) * 1000 + 80,
            );
            delay += groupDur + 0.55;
          } else {
            delay += 0.8;
          }
        });
        setTimeout(
          () => {
            playing = false;
            document.getElementById("listen").disabled = false;
          },
          delay * 1000 + 100,
        );
      };
      document.getElementById("reset").onclick = load;
      document.getElementById("check").onclick = () => {
        const slots = [...document.querySelectorAll(".slot.missing")];
        if (slots.some((x) => !x.dataset.count)) {
          status.textContent = "Lengkapi semua kotak yang kosong dulu, ya!";
          status.className = "status bad";
          return;
        }
        const ok = slots.every(
          (x, i) => Number(x.dataset.count) === Q[qi].ans[i],
        );
        if (ok) {
          solved = true;
          status.textContent = "Benar! Pola bunyinya sudah lengkap.";
          status.className = "status good";
          completed = Math.max(completed, qi + 1);
          document.getElementById("done").textContent =
            `Selesai: ${completed} / 10`;
          document.getElementById("check").style.display = "none";
          document.getElementById("next").style.display = "inline-block";
        } else {
          status.textContent = "Belum tepat. Dengarkan polanya lagi!";
          status.className = "status bad";
        }
      };
      document.getElementById("next").onclick = () => {
        if (qi < 9) {
          qi++;
          load();
        } else document.getElementById("overlay").classList.add("show");
      };
      document.getElementById("again").onclick = () => {
        qi = 0;
        completed = 0;
        document.getElementById("done").textContent = "Selesai: 0 / 10";
        document.getElementById("overlay").classList.remove("show");
        load();
      };
      load();
    </script>
  </body>
</html>
