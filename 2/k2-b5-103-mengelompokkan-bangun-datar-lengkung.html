<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <title>Mengelompokkan Bangun Datar dan Bangun Lengkung</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&family=Lato:wght@700;900&family=Londrina+Solid&display=swap");
      :root {
        --ink: #0c162e;
        --yellow: #ffd95a;
        --sky: #dff4ff;
        --pink: #fff0f6;
        --cream: #fff9df;
        --green: #eaffef;
        --purple: #8b72d6;
        --blue: #61b9e8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--sky);
        font-family: "Nunito", sans-serif;
        color: #59463f;
      }
      .shell {
        width: 100%;
        max-width: 930px;
      }
      .sim {
        background: #fff;
        border: 2px solid var(--ink);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 7px 7px 0 var(--ink);
      }
      .top {
        background: #132e5c;
        color: #fff;
        padding: 14px 22px;
        border-bottom: 4px solid #ffd95a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .brand img {
        width: 50px;
        height: 50px;
        object-fit: contain;
      }
      .brand h1 {
        font: 400 1.45rem "Londrina Solid";
        margin: 0;
      }
      .progress {
        font: 600 15px "Fredoka";
        color: #e9e1d0;
      }
      .progress b {
        color: var(--yellow);
      }
      main {
        padding: 25px 20px 28px;
        background: linear-gradient(
          145deg,
          #e9f8ff 0%,
          #fff4c9 48%,
          #f7eaff 100%
        );
        min-height: 545px;
      }
      .content {
        max-width: 840px;
        margin: auto;
      }
      .instruction {
        text-align: center;
        font: 600 clamp(20px, 4vw, 26px) "Fredoka";
        color: #4c5f9a;
        margin: 0 0 18px;
      }
      .groups {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 17px;
        margin-bottom: 24px;
      }
      .bin {
        min-height: 178px;
        background: #fff;
        border: 3px dashed #c7b3bc;
        border-radius: 24px;
        padding: 13px;
        transition: 0.15s;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.05);
      }
      .bin.hover {
        transform: scale(1.02);
        border-color: var(--purple);
        background: #faf5ff;
      }
      .bin h2 {
        text-align: center;
        margin: 0 0 10px;
        font: 600 18px "Fredoka";
        color: #6b5360;
      }
      .bin .inside {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
        min-height: 105px;
      }
      .bin.flat {
        border-color: #66bde5;
      }
      .bin.curved {
        border-color: #ef9fc2;
      }
      .bin.flat h2 {
        color: #287da8;
      }
      .bin.curved h2 {
        color: #b34e7d;
      }
      .pool-wrap {
        background: #ffffffd9;
        border: 3px solid #b9dff2;
        border-radius: 24px;
        padding: 17px 14px;
        box-shadow: 0 7px 0 rgba(0, 0, 0, 0.07);
      }
      .pool-title {
        text-align: center;
        font: 600 15px "Fredoka";
        color: #536b8b;
        margin-bottom: 12px;
      }
      .pool {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        min-height: 110px;
      }
      .shape-card {
        width: 105px;
        height: 98px;
        border: 2px solid #cfe3ee;
        border-radius: 18px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        touch-action: none;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
        transition: 0.15s;
      }
      .shape-card:hover {
        transform: translateY(-3px);
      }
      .shape-card.dragging {
        opacity: 0.25;
      }
      .shape-card svg {
        width: 75px;
        height: 75px;
        pointer-events: none;
      }
      .inside .shape-card {
        width: 75px;
        height: 70px;
        box-shadow: none;
        cursor: grab;
      }
      .inside .shape-card svg {
        width: 54px;
        height: 54px;
      }
      .status {
        min-height: 30px;
        text-align: center;
        margin: 16px 0 3px;
        font: 600 17px "Fredoka";
      }
      .good {
        color: #278c52;
      }
      .bad {
        color: #d94f4b;
      }
      .controls {
        display: flex;
        justify-content: center;
        gap: 10px;
      }
      .controls button,
      .modal button {
        border: 0;
        border-radius: 999px;
        padding: 11px 19px;
        font: 600 15px "Fredoka";
        cursor: pointer;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.14);
      }
      .reset {
        background: #fff;
        border: 2px solid #ead8ce !important;
      }
      .check {
        background: #ffd95a;
        color: #624d00;
      }
      .next {
        display: none;
        background: #69d59a;
        color: #164d32;
      }
      footer {
        background: #304a78;
        color: #ffffffbd;
        border-top: 4px solid #ffd95a;
        padding: 10px 22px;
        display: flex;
        justify-content: space-between;
        font: 700 0.75rem "Lato";
      }
      .float-drag {
        position: fixed;
        z-index: 9999;
        pointer-events: none;
        width: 90px;
        height: 85px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        border-radius: 20px;
        filter: drop-shadow(0 8px 5px #0004);
      }
      .float-drag svg {
        width: 65px;
        height: 65px;
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: #281a2388;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .overlay.show {
        display: flex;
      }
      .modal {
        background: #fff;
        border-radius: 25px;
        padding: 28px;
        text-align: center;
        max-width: 370px;
      }
      .modal .big {
        font-size: 52px;
      }
      .modal h2 {
        font: 600 28px "Fredoka";
        color: #4c5f9a;
      }
      .modal button {
        background: var(--yellow);
      }
      @media (max-width: 650px) {
        body {
          padding: 8px;
          align-items: flex-start;
        }
        .top {
          padding: 11px 13px;
        }
        .brand img {
          width: 40px;
          height: 40px;
        }
        .brand h1 {
          font-size: 1.08rem;
        }
        .groups {
          gap: 9px;
        }
        .bin {
          padding: 9px;
          min-height: 160px;
        }
        .bin h2 {
          font-size: 15px;
        }
        .shape-card {
          width: 86px;
          height: 82px;
        }
        .shape-card svg {
          width: 62px;
          height: 62px;
        }
      }
    </style>
  </head>

              ><button class="next" id="next">Soal Berikutnya ▶</button>
            </div>
          </div>
        </main>
        <footer><span id="done">Selesai: 0 / 10</span></footer>
      </div>
    </div>
    <div class="overlay" id="overlay">
      <div class="modal">
        <div class="big">⭐</div>
        <h2>Hebat!</h2>
        <p>Kamu sudah berhasil mengelompokkan semua bangun.</p>
        <button id="again">Main Lagi</button>
      </div>
    </div>
    <script>
      const shapes = {
        triangle: { group: "flat" },
        square: { group: "flat" },
        rectangle: { group: "flat" },
        pentagon: { group: "flat" },
        hexagon: { group: "flat" },
        trapezoid: { group: "flat" },
        diamond: { group: "flat" },
        circle: { group: "curved" },
        oval: { group: "curved" },
        semicircle: { group: "curved" },
        crescent: { group: "curved" },
        capsule: { group: "curved" },
      };
      const Q = [
        ["triangle", "circle", "square", "oval"],
        ["rectangle", "semicircle", "pentagon", "circle"],
        ["hexagon", "oval", "triangle", "crescent"],
        ["diamond", "circle", "trapezoid", "capsule"],
        ["square", "semicircle", "rectangle", "oval"],
        ["pentagon", "crescent", "triangle", "circle"],
        ["trapezoid", "capsule", "hexagon", "oval"],
        ["diamond", "semicircle", "square", "circle"],
        ["rectangle", "crescent", "pentagon", "oval"],
        ["hexagon", "circle", "triangle", "capsule"],
      ];
      const colors = [
        "#FF7D8F",
        "#58B9E8",
        "#FFD45C",
        "#75D39B",
        "#A98BE8",
        "#FFAD63",
        "#F58BC2",
        "#63D5D0",
      ];
      function shapeSVG(k, i) {
        const c = colors[i % colors.length],
          stroke = "#5b4a55";
        const common = `fill="${c}" stroke="${stroke}" stroke-width="3" stroke-linejoin="round"`;
        if (k === "triangle")
          return `<svg viewBox="0 0 100 100"><polygon points="50,14 88,82 12,82" ${common}/></svg>`;
        if (k === "square")
          return `<svg viewBox="0 0 100 100"><rect x="19" y="19" width="62" height="62" rx="2" ${common}/></svg>`;
        if (k === "rectangle")
          return `<svg viewBox="0 0 100 100"><rect x="11" y="27" width="78" height="46" rx="2" ${common}/></svg>`;
        if (k === "pentagon")
          return `<svg viewBox="0 0 100 100"><polygon points="50,12 88,40 73,84 27,84 12,40" ${common}/></svg>`;
        if (k === "hexagon")
          return `<svg viewBox="0 0 100 100"><polygon points="28,15 72,15 92,50 72,85 28,85 8,50" ${common}/></svg>`;
        if (k === "trapezoid")
          return `<svg viewBox="0 0 100 100"><polygon points="28,22 72,22 89,78 11,78" ${common}/></svg>`;
        if (k === "diamond")
          return `<svg viewBox="0 0 100 100"><polygon points="50,10 88,50 50,90 12,50" ${common}/></svg>`;
        if (k === "circle")
          return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" ${common}/></svg>`;
        if (k === "oval")
          return `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="39" ry="27" ${common}/></svg>`;
        if (k === "semicircle")
          return `<svg viewBox="0 0 100 100"><path d="M15 68 A35 35 0 0 1 85 68 Z" ${common}/></svg>`;
        if (k === "crescent")
          return `<svg viewBox="0 0 100 100"><path d="M68 14 A38 38 0 1 0 68 86 A30 30 0 0 1 68 14 Z" ${common}/></svg>`;
        if (k === "capsule")
          return `<svg viewBox="0 0 100 100"><rect x="10" y="29" width="80" height="42" rx="21" ${common}/></svg>`;
      }
      let qi = 0,
        completed = 0,
        solved = false,
        drag = null,
        floatDrag = null;
      const pool = document.getElementById("pool"),
        status = document.getElementById("status");
      function makeCard(k, i) {
        const el = document.createElement("div");
        el.className = "shape-card";
        el.dataset.shape = k;
        el.dataset.home = "pool";
        el.innerHTML = shapeSVG(k, i);
        el.onmousedown = (e) => {
          e.preventDefault();
          startDrag(e, el);
        };
        el.ontouchstart = (e) => startDrag(e, el);
        return el;
      }
      function load() {
        solved = false;
        drag = null;
        status.textContent = "";
        status.className = "status";
        document.getElementById("qnum").textContent = qi + 1;
        document.querySelectorAll(".inside").forEach((x) => (x.innerHTML = ""));
        pool.innerHTML = "";
        Q[qi].forEach((k, i) => pool.appendChild(makeCard(k, i + qi)));
        document.getElementById("check").style.display = "inline-block";
        document.getElementById("next").style.display = "none";
      }
      function point(e) {
        return e.touches
          ? e.touches[0]
          : e.changedTouches
            ? e.changedTouches[0]
            : e;
      }
      function startDrag(e, el) {
        if (solved) return;
        drag = el;
        el.classList.add("dragging");
        floatDrag = document.createElement("div");
        floatDrag.className = "float-drag";
        floatDrag.innerHTML = el.innerHTML;
        document.body.appendChild(floatDrag);
        moveDrag(e);
      }
      function moveDrag(e) {
        if (!drag) return;
        const p = point(e);
        floatDrag.style.left = p.clientX - 45 + "px";
        floatDrag.style.top = p.clientY - 42 + "px";
        document
          .querySelectorAll(".bin")
          .forEach((x) => x.classList.remove("hover"));
        document
          .elementFromPoint(p.clientX, p.clientY)
          ?.closest(".bin")
          ?.classList.add("hover");
      }
      function endDrag(e) {
        if (!drag) return;
        const p = point(e),
          bin = document
            .elementFromPoint(p.clientX, p.clientY)
            ?.closest(".bin");
        if (bin) {
          bin.querySelector(".inside").appendChild(drag);
          drag.dataset.home = bin.dataset.group;
        } else if (
          document.elementFromPoint(p.clientX, p.clientY)?.closest(".pool-wrap")
        ) {
          pool.appendChild(drag);
          drag.dataset.home = "pool";
        }
        drag.classList.remove("dragging");
        document
          .querySelectorAll(".bin")
          .forEach((x) => x.classList.remove("hover"));
        floatDrag.remove();
        floatDrag = null;
        drag = null;
      }
      addEventListener("mousemove", (e) => drag && moveDrag(e));
      addEventListener("mouseup", (e) => drag && endDrag(e));
      addEventListener(
        "touchmove",
        (e) => {
          if (drag) {
            moveDrag(e);
            e.preventDefault();
          }
        },
        { passive: false },
      );
      addEventListener("touchend", (e) => drag && endDrag(e));
      document.getElementById("reset").onclick = load;
      document.getElementById("check").onclick = () => {
        const cards = [...document.querySelectorAll(".shape-card")];
        if (cards.some((x) => x.dataset.home === "pool")) {
          status.textContent = "Pindahkan semua bangun dulu, ya!";
          status.className = "status bad";
          return;
        }
        const ok = cards.every(
          (x) => shapes[x.dataset.shape].group === x.dataset.home,
        );
        if (ok) {
          solved = true;
          status.textContent =
            "Benar! Semua bangun sudah dikelompokkan dengan tepat.";
          status.className = "status good";
          completed = Math.max(completed, qi + 1);
          document.getElementById("done").textContent =
            `Selesai: ${completed} / 10`;
          document.getElementById("check").style.display = "none";
          document.getElementById("next").style.display = "inline-block";
        } else {
          status.textContent =
            "Belum tepat. Coba perhatikan bentuk sisinya lagi!";
          status.className = "status bad";
        }
      };
      document.getElementById("next").onclick = () => {
        if (qi < 9) {
          qi++;
          load();
        } else document.getElementById("overlay").classList.add("show");
      };
      document.getElementById("again").onclick = () => {
        qi = 0;
        completed = 0;
        document.getElementById("done").textContent = "Selesai: 0 / 10";
        document.getElementById("overlay").classList.remove("show");
        load();
      };
      load();
    </script>
  </body>
</html>
