<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>Detektif Bentuk - Menjodohkan Bangun Datar</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Lato:wght@400;700;900&family=Londrina+Solid:wght@300;400&display=swap");

      :root {
        --grid-bg: #eaf1fb;
        --grid-line: #d3e2f5;
        --white: #ffffff;
        --ink: #3a3a3a;
        --coral: #ff6b6b;
        --leaf-green: #4cd787;
        --indigo: #5b6fd8;
        --card-shadow: 0 8px 0 rgba(0, 0, 0, 0.08);
        --brand-ink: #17121f;
        --brand-yellow: #ffd84d;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: "Nunito", sans-serif;
        color: var(--ink);
        min-height: 100vh;
        padding: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #b6d6ec;
      }

      .page-shell {
        width: 100%;
        max-width: 900px;
        margin: auto;
      }
      .sim-container {
        width: 100%;
        background: #fff;
        border: 2px solid var(--brand-ink);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 7px 7px 0 var(--brand-ink);
      }

      .navy-header {
        background: var(--brand-ink);
        color: #fff;
        padding: 14px 22px;
        border-bottom: 4px solid var(--brand-yellow);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        row-gap: 10px;
      }
      .header-brand {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .navy-header img {
        width: 50px;
        height: 50px;
        object-fit: contain;
        flex-shrink: 0;
      }
      .navy-header h1 {
        margin: 0;
        color: #fff;
        font-family: "Londrina Solid", cursive;
        font-size: 1.6rem;
        font-weight: 400;
        letter-spacing: 0.02em;
      }
      .header-hint {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: "Lato", sans-serif;
        font-weight: 700;
        font-size: 0.72rem;
        color: #e9e1d0;
      }
      .header-hint .mag {
        font-size: 1.1rem;
      }

      .header-level-picker {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin-left: auto;
      }
      .picker-label {
        margin: 0;
        color: #e9e1d0;
        font-family: "Lato", sans-serif;
        font-weight: 700;
        font-size: 0.7rem;
      }
      .level-map {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stone {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        position: relative;
        cursor: pointer;
        background: none;
        border: none;
        font-family: inherit;
      }
      .stone-circle {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--white);
        border: 3px solid rgba(255, 255, 255, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: 14px;
        color: #5b6fd8;
        transition:
          transform 0.2s ease,
          border-color 0.2s ease,
          box-shadow 0.2s ease;
        position: relative;
      }
      .stone-label {
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 9px;
        color: rgba(233, 225, 208, 0.85);
        text-align: center;
      }
      .stone.active .stone-circle {
        border-color: var(--brand-yellow);
        box-shadow: 0 0 0 4px rgba(255, 216, 77, 0.35);
        transform: scale(1.12);
      }
      .stone.active .stone-label {
        color: var(--brand-yellow);
      }
      .stone.done .stone-circle {
        border-color: var(--leaf-green);
        background: #eafff1;
      }
      .stone.done .stone-circle::after {
        content: "✔";
        position: absolute;
        bottom: -3px;
        right: -3px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: var(--leaf-green);
        color: #fff;
        font-size: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--brand-ink);
      }
      .stone-line {
        width: 18px;
        height: 3px;
        background: rgba(255, 255, 255, 0.25);
        margin: 0 2px 15px;
        border-radius: 2px;
      }
      .stone-line.done {
        background: var(--leaf-green);
      }

      @media (max-width: 600px) {
        .header-level-picker {
          flex: 1 0 100%;
          margin-left: 0;
        }
      }

      @media (max-width: 600px) {
        .navy-header {
          padding: 12px 14px;
        }
        .navy-header img {
          width: 40px;
          height: 40px;
        }
        .navy-header h1 {
          font-size: 1.2rem;
        }
        .app-footer {
          padding: 10px 14px;
        }
      }

      .sim-body {
        position: relative;
        overflow: hidden;
        background-color: var(--grid-bg);
        background-image:
          linear-gradient(var(--grid-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size: 26px 26px;
        padding: 20px 18px 26px;
      }

      .app-footer {
        background: var(--brand-ink);
        color: rgba(255, 255, 255, 0.72);
        padding: 10px 22px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-family: "Lato", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        border-top: 4px solid var(--brand-yellow);
      }
      .score-badge {
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 16px;
        color: #e9e1d0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .score-badge span.num {
        color: var(--brand-yellow);
      }
      .progress-badge {
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 15px;
        color: #e9e1d0;
      }

      .game-instruction {
        text-align: center;
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 17px;
        color: #2b3a6b;
        margin: 2px auto 18px;
        position: relative;
        z-index: 2;
      }

      .match-board {
        position: relative;
        z-index: 2;
        max-width: 840px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        gap: 180px;
      }
      .match-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: visible;
      }
      .match-line {
        fill: none;
        stroke: var(--indigo);
        stroke-width: 3;
      }
      .drag-line {
        fill: none;
        stroke: var(--indigo);
        stroke-width: 3;
        stroke-dasharray: 6 6;
      }

      .match-col {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
        min-width: 0;
        position: relative;
        z-index: 2;
      }
      #colLeft {
        align-items: flex-end;
      }
      #colRight {
        align-items: flex-start;
      }

      .match-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--white);
        border-radius: 14px;
        padding: 5px 14px;
        box-shadow: var(--card-shadow);
        border-bottom: 4px solid #eef0f4;
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }
      .match-item.picture {
        justify-content: flex-start;
      }
      .match-item.answer {
        justify-content: flex-start;
        max-width: 230px;
      }
      .match-item svg.drawing {
        width: 80px;
        height: 80px;
        flex-shrink: 0;
      }
      .match-item .shapes {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .match-item .qnum {
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: 13px;
        color: #9aa0ad;
        margin-right: 2px;
      }

      .match-item.correct {
        background: #eafcf1;
        border-color: var(--leaf-green);
      }
      .match-item.wrong {
        animation: shake 0.35s ease;
        background: #fff0f0;
        border-color: var(--coral);
      }

      .match-dot {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        border: 3px solid var(--indigo);
        cursor: grab;
        touch-action: none;
        z-index: 3;
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }
      .match-dot.right-dot {
        right: -9px;
      }
      .match-dot.left-dot {
        left: -9px;
      }
      .match-dot.used {
        background: #fff;
        border-color: var(--indigo);
        cursor: grab;
      }
      .match-dot.active {
        box-shadow: 0 0 0 5px rgba(91, 111, 216, 0.25);
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-6px);
        }
        75% {
          transform: translateX(6px);
        }
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(20, 25, 50, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 20px;
      }
      .overlay.show {
        display: flex;
      }
      .modal {
        background: var(--white);
        border-radius: 26px;
        padding: 32px 26px;
        text-align: center;
        max-width: 360px;
        box-shadow: 0 20px 0 rgba(0, 0, 0, 0.15);
      }
      .modal .big-icon {
        font-size: 52px;
      }
      .modal h2 {
        font-family: "Fredoka", sans-serif;
        color: #2b3a6b;
        margin: 8px 0;
      }
      .modal p {
        font-weight: 700;
        font-size: 16px;
        margin: 6px 0 20px;
        color: #4a5a44;
      }
      .modal .btn-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .modal button {
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 16px;
        border: none;
        border-radius: 50px;
        padding: 12px 24px;
        cursor: pointer;
      }
      .modal button.primary {
        background: var(--brand-yellow);
        box-shadow: 0 5px 0 #d9a716;
        color: #5b3d00;
      }
      .modal button.secondary {
        background: #eef3ea;
        box-shadow: 0 5px 0 #cdd7c4;
        color: #4a5a44;
      }
      .modal button:active {
        transform: translateY(4px);
        box-shadow: none;
      }

      .confetti {
        position: fixed;
        top: -40px;
        font-size: 22px;
        z-index: 150;
        pointer-events: none;
        animation: fall linear forwards;
      }
      @keyframes fall {
        to {
          transform: translateY(110vh) rotate(360deg);
          opacity: 0.4;
        }
      }

      @media (max-width: 600px) {
        .match-board {
          gap: 54px;
        }
        .match-item {
          padding: 5px 10px;
        }
        .match-item svg.drawing {
          width: 72px;
          height: 72px;
        }
      }
    </style>
  </head>

      // ---------- Ikon bangun datar sederhana (garis luar saja) ----------
      function shapeIcon(type, color) {
        color = color || "#5b6fd8";
        switch (type) {
          case "rectangle":
            return `<svg width="76" height="48" viewBox="0 0 44 28"><rect x="2" y="4" width="40" height="20" fill="none" stroke="${color}" stroke-width="2.4" rx="2"/></svg>`;
          case "thin-rectangle":
            return `<svg width="34" height="52" viewBox="0 0 20 30"><rect x="7" y="2" width="6" height="26" fill="none" stroke="${color}" stroke-width="2.4" rx="1"/></svg>`;
          case "square":
            return `<svg width="48" height="48" viewBox="0 0 28 28"><rect x="3" y="3" width="22" height="22" fill="none" stroke="${color}" stroke-width="2.4" rx="2"/></svg>`;
          case "triangle":
            return `<svg width="54" height="48" viewBox="0 0 32 28"><polygon points="16,3 3,25 29,25" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round"/></svg>`;
          case "right-triangle":
            return `<svg width="54" height="52" viewBox="0 0 32 30"><polygon points="4,26 4,6 26,26" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" transform="rotate(15 15 16)"/></svg>`;
          case "circle":
            return `<svg width="48" height="48" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="none" stroke="${color}" stroke-width="2.4"/></svg>`;
          case "trapezoid":
            return `<svg width="76" height="48" viewBox="0 0 44 28"><polygon points="10,3 34,3 42,25 2,25" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round"/></svg>`;
          default:
            return "";
        }
      }

      function shapesRow(list) {
        return `<span class="shapes">${list.map((t) => shapeIcon(t)).join("")}</span>`;

                "right-triangle",
              ],
              svg: `<svg class="drawing" viewBox="0 0 140 140"><rect x="20" y="75" width="90" height="30" fill="#d9534f"/><polygon points="45,75 85,75 75,50 55,50" fill="#a83a32"/><circle cx="40" cy="110" r="13" fill="#222"/><circle cx="95" cy="110" r="13" fill="#222"/><polygon points="105,60 105,75 122,75" fill="#a83a32"/></svg>`,
            },
            {
              id: 1,
              answer: ["triangle", "rectangle", "square", "square"],
              svg: `<svg class="drawing" viewBox="0 0 140 140"><polygon points="30,45 70,12 110,45" fill="#c65a2e"/><rect x="32" y="45" width="76" height="22" fill="#e0793c"/><rect x="30" y="67" width="58" height="58" fill="#d9692f"/><rect x="48" y="85" width="20" height="20" fill="#fff6b0"/></svg>`,
            },
            {
              id: 2,
              answer: ["thin-rectangle", "square", "triangle", "circle"],
              svg: `<svg class="drawing" viewBox="0 0 140 140"><rect x="62" y="60" width="16" height="65" fill="#8a8f99"/><rect x="45" y="35" width="50" height="32" fill="#6b7280"/><polygon points="45,35 70,10 95,35" fill="#4b5160"/><circle cx="70" cy="51" r="12" fill="#fdf6d8"/></svg>`,
            },
            {
              id: 3,
              answer: [
                "trapezoid",
                "thin-rectangle",
                "right-triangle",
                "triangle",
              ],
              svg: `<svg class="drawing" viewBox="0 0 140 140"><polygon points="15,110 125,110 105,130 35,130" fill="#2f8f7a"/><rect x="68" y="25" width="6" height="85" fill="#7a5230"/><polygon points="74,28 74,80 118,80" fill="#f2c94c"/><polygon points="50,45 30,80 66,80" fill="#e0793c"/></svg>`,
            },
            {
              id: 4,
              answer: [
                "triangle",
                "rectangle",
                "circle",
                "right-triangle",
                "right-triangle",
              ],
              svg: `<svg class="drawing" viewBox="0 0 140 140"><rect x="55" y="40" width="30" height="70" fill="#3b6fd1"/><polygon points="55,40 70,10 85,40" fill="#2a54a8"/><circle cx="70" cy="60" r="10" fill="#eaf6ff"/><polygon points="55,88 55,118 35,118" fill="#2a54a8"/><polygon points="85,88 85,118 105,118" fill="#2a54a8"/></svg>`,
            },
          ],
        },
      ];

      // Urutan kolom kanan diacak supaya tidak sejajar dengan kolom kiri
      const RIGHT_ORDER = [2, 4, 0, 3, 1];
      const MAX_SCORE = 100;

      let levelIndex = 0;
      let score = 0;
      let solved = new Set();
      let connections = []; // {a, sideA, b, sideB}
      let dragging = null;
      let startPoint = null;
      const levelCompleted = levels.map(() => false);

      // Simpan jawaban tiap level agar ketika kembali, garis tetap ada.
      const levelState = levels.map(() => ({
        pairs: [], // [{pictureId, answerId}]
        checked: false,
        complete: false,
      }));

      const board = document.getElementById("board");
      const colLeft = document.getElementById("colLeft");
      const colRight = document.getElementById("colRight");
      const scoreVal = document.getElementById("scoreVal");
      const progressVal = document.getElementById("progressVal");
      const overlay = document.getElementById("overlay");
      const levelMap = document.getElementById("levelMap");
      const modalIcon = document.getElementById("modalIcon");
      const modalTitle = document.getElementById("modalTitle");
      const modalMsg = document.getElementById("modalMsg");
      const modalBtnPrimary = document.getElementById("modalBtnPrimary");
      const modalBtnSecondary = document.getElementById("modalBtnSecondary");
      const checkBtn = document.getElementById("checkBtn");
      const checkFeedback = document.getElementById("checkFeedback");

      document.getElementById("scoreMax").textContent = MAX_SCORE;

      function renderMap() {
        levelMap.innerHTML = "";
        levels.forEach((lv, i) => {
          const stone = document.createElement("button");
          stone.className = "stone";
          stone.type = "button";
          stone.dataset.i = i;
          stone.innerHTML = `<div class="stone-circle">${i + 1}</div><div class="stone-label">${lv.name}</div>`;
          stone.addEventListener("click", () => loadLevel(i));
          levelMap.appendChild(stone);
          if (i < levels.length - 1) {
            const line = document.createElement("div");
            line.className = "stone-line";
            line.dataset.i = i;
            levelMap.appendChild(line);
          }
        });
        updateMap();
      }

      function updateMap() {
        document.querySelectorAll(".stone").forEach((el) => {
          const i = parseInt(el.dataset.i, 10);
          el.classList.toggle("active", i === levelIndex);
          el.classList.toggle("done", levelCompleted[i]);
        });
        document.querySelectorAll(".stone-line").forEach((el) => {
          const i = parseInt(el.dataset.i, 10);
          el.classList.toggle("done", levelCompleted[i]);
        });
      }

      function saveCurrentPairs() {
        levelState[levelIndex].pairs = connections.map((c) => ({
          pictureId:
            c.a.dataset.type === "picture" ? c.a.dataset.id : c.b.dataset.id,
          answerId:
            c.a.dataset.type === "answer" ? c.a.dataset.id : c.b.dataset.id,
        }));
      }

      function loadLevel(idx) {
        overlay.classList.remove("show");
        levelIndex = idx;
        dragging = null;
        startPoint = null;
        connections = [];
        solved = new Set();

        const items = levels[idx].items;
        const state = levelState[idx];

        score = state.complete ? MAX_SCORE : 0;
        scoreVal.textContent = score;
        progressVal.textContent = state.complete
          ? `Benar: ${items.length} / ${items.length}`
          : `Terpasang: ${state.pairs.length} / ${items.length}`;
        document.getElementById("resetLevelBtn").style.display = state.complete
          ? "inline-block"
          : "none";
        checkFeedback.textContent = state.complete
          ? "Jawaban level ini sudah benar."
          : "";
        checkFeedback.style.color = state.complete ? "#218b4b" : "#2b3a6b";
        checkBtn.style.display = state.complete ? "none" : "inline-block";

        updateMap();
        render();

        // Pulihkan garis yang pernah dibuat pada level ini.
        requestAnimationFrame(() => {
          state.pairs.forEach((p) => {
            const pic = colLeft.querySelector(
              `.match-item[data-id="${p.pictureId}"]`,
            );
            const ans = colRight.querySelector(
              `.match-item[data-id="${p.answerId}"]`,
            );
            if (pic && ans)
              connections.push({
                a: pic,
                sideA: "right",
                b: ans,
                sideB: "left",
              });
          });
          syncUsedDots();
          drawConnections();
        });
      }

      function render() {
        const items = levels[levelIndex].items;
        colLeft.innerHTML = "";
        colRight.innerHTML = "";

        items.forEach((it, i) => {
          const el = document.createElement("div");
          el.className = "match-item picture";
          el.dataset.type = "picture";
          el.dataset.id = it.id;
          el.innerHTML = `
        <span class="qnum">${i + 1}.</span>
        ${it.svg}
        <span class="match-dot right-dot" data-side="right"></span>
      `;
          colLeft.appendChild(el);
          el.querySelector(".match-dot").addEventListener("pointerdown", (ev) =>
            startDrag(ev, el, "right"),
          );
        });

        RIGHT_ORDER.forEach((idx) => {
          const it = items[idx];
          const el = document.createElement("div");
          el.className = "match-item answer";
          el.dataset.type = "answer";
          el.dataset.id = it.id;
          el.innerHTML = `
        <span class="match-dot left-dot" data-side="left"></span>
        ${shapesRow(it.answer)}
      `;
          colRight.appendChild(el);
          el.querySelector(".match-dot").addEventListener("pointerdown", (ev) =>
            startDrag(ev, el, "left"),
          );
        });
      }

      function pointFor(el, side) {
        const dot = el.querySelector(`.match-dot[data-side="${side}"]`);
        if (!dot) return null;
        const r = dot.getBoundingClientRect(),
          br = board.getBoundingClientRect();
        return {
          x: r.left + r.width / 2 - br.left,
          y: r.top + r.height / 2 - br.top,
        };
      }

      function drawConnections(temp) {
        const svg = document.getElementById("matchSvg");
        svg.innerHTML = "";
        connections.forEach((c) => {
          const a = pointFor(c.a, c.sideA),
            b = pointFor(c.b, c.sideB);
          if (!a || !b) return;
          svg.insertAdjacentHTML(
            "beforeend",
            `<path class="match-line" d="M ${a.x} ${a.y} C ${(a.x + b.x) / 2} ${a.y}, ${(a.x + b.x) / 2} ${b.y}, ${b.x} ${b.y}"/>`,
          );
        });
        if (temp && temp.a && temp.b) {
          const a = temp.a,
            b = temp.b;
          svg.insertAdjacentHTML(
            "beforeend",
            `<path class="drag-line" d="M ${a.x} ${a.y} C ${(a.x + b.x) / 2} ${a.y}, ${(a.x + b.x) / 2} ${b.y}, ${b.x} ${b.y}"/>`,
          );
        }
      }

      function syncUsedDots() {
        document
          .querySelectorAll(".match-dot")
          .forEach((d) => d.classList.remove("used"));
        connections.forEach((c) => {
          c.a
            .querySelector(`.match-dot[data-side="${c.sideA}"]`)
            ?.classList.add("used");
          c.b
            .querySelector(`.match-dot[data-side="${c.sideB}"]`)
            ?.classList.add("used");
        });
      }

      function startDrag(ev, item, side) {
        if (levelState[levelIndex].complete) return;
        ev.preventDefault();
        dragging = { item, side };
        startPoint = pointFor(item, side);
        item
          .querySelector(`.match-dot[data-side="${side}"]`)
          .classList.add("active");
        document.addEventListener("pointermove", onDrag);
        document.addEventListener("pointerup", endDrag, { once: true });
      }

      function onDrag(ev) {
        if (!dragging) return;
        const r = board.getBoundingClientRect();
        drawConnections({
          a: startPoint,
          b: { x: ev.clientX - r.left, y: ev.clientY - r.top },
        });
      }

      function endDrag(ev) {
        document.removeEventListener("pointermove", onDrag);
        if (!dragging) return;
        const target = document.elementFromPoint(ev.clientX, ev.clientY);
        const dot =
          target && target.closest ? target.closest(".match-dot") : null;
        if (dot) {
          const other = dot.closest(".match-item");
          if (other && other !== dragging.item)
            makeConnection(
              dragging.item,
              dragging.side,
              other,
              dot.dataset.side,
            );
        }
        const activeDot = dragging.item.querySelector(
          `.match-dot[data-side="${dragging.side}"]`,
        );
        if (activeDot) activeDot.classList.remove("active");
        dragging = null;
        drawConnections();
      }

      // Saat menjodohkan TIDAK memeriksa benar/salah.
      function makeConnection(a, sideA, b, sideB) {
        const valid =
          (a.dataset.type === "picture" &&
            sideA === "right" &&
            b.dataset.type === "answer" &&
            sideB === "left") ||
          (a.dataset.type === "answer" &&
            sideA === "left" &&
            b.dataset.type === "picture" &&
            sideB === "right");
        if (!valid) return;

        // Normalisasi agar a selalu gambar dan b selalu jawaban.
        let pic = a,
          ans = b;
        if (a.dataset.type === "answer") {
          pic = b;
          ans = a;
        }

        // Satu gambar dan satu jawaban hanya boleh punya satu pasangan.
        connections = connections.filter((c) => c.a !== pic && c.b !== ans);
        connections.push({ a: pic, sideA: "right", b: ans, sideB: "left" });

        saveCurrentPairs();
        levelState[levelIndex].checked = false;
        document
          .querySelectorAll(".match-item")
          .forEach((el) => el.classList.remove("correct", "wrong"));
        checkFeedback.textContent = "";
        progressVal.textContent = `Terpasang: ${connections.length} / ${levels[levelIndex].items.length}`;
        document.getElementById("resetLevelBtn").style.display = "none";
        syncUsedDots();
        drawConnections();
      }

      function checkAnswers() {
        const items = levels[levelIndex].items;
        if (connections.length < items.length) {
          checkFeedback.textContent = "Jodohkan semua gambar dulu, ya!";
          checkFeedback.style.color = "#d84d4d";
          return;
        }

        let correctCount = 0;
        connections.forEach((c) => {
          const ok = c.a.dataset.id === c.b.dataset.id;
          if (ok) correctCount++;
          c.a.classList.toggle("correct", ok);
          c.b.classList.toggle("correct", ok);
          c.a.classList.toggle("wrong", !ok);
          c.b.classList.toggle("wrong", !ok);
        });

        levelState[levelIndex].checked = true;
        score = Math.round((correctCount / items.length) * MAX_SCORE);
        scoreVal.textContent = score;
        progressVal.textContent = `Benar: ${correctCount} / ${items.length}`;

        if (correctCount === items.length) {
          levelState[levelIndex].complete = true;
          levelCompleted[levelIndex] = true;
          solved = new Set(items.map((it) => it.id));
          checkFeedback.textContent = "Benar! Semua pasangan sudah tepat.";
          checkFeedback.style.color = "#218b4b";
          checkBtn.style.display = "none";
          document.getElementById("resetLevelBtn").style.display =
            "inline-block";
          updateMap();
          setTimeout(showComplete, 500);
        } else {
          checkFeedback.textContent =
            "Masih ada pasangan yang belum tepat. Coba perbaiki lagi!";
          checkFeedback.style.color = "#d84d4d";
        }
      }

      function resetCurrentLevel() {
        levelState[levelIndex] = { pairs: [], checked: false, complete: false };
        levelCompleted[levelIndex] = false;
        score = 0;
        scoreVal.textContent = 0;
        connections = [];
        solved = new Set();
        checkBtn.style.display = "inline-block";
        checkFeedback.textContent = "";
        updateMap();
        loadLevel(levelIndex);
      }

      function showComplete() {
        const finishedLevel = levels[levelIndex];
        const allDone = levelCompleted.every(Boolean);

        if (allDone) {
          modalIcon.textContent = "🏆";
          modalTitle.textContent = "Semua Level Selesai!";
          modalMsg.textContent = `Skor ${finishedLevel.name}: ${MAX_SCORE}/${MAX_SCORE}`;
          modalBtnPrimary.style.display = "none";
          modalBtnSecondary.textContent = "Tutup";
          modalBtnSecondary.onclick = () => overlay.classList.remove("show");
          overlay.classList.add("show");
          launchConfetti(30);
          return;
        }

        const hasNext = levelIndex < levels.length - 1;
        modalIcon.textContent = "🎉";
        modalTitle.textContent = `${finishedLevel.name} selesai!`;
        modalMsg.textContent = `Semua jawaban benar.`;

        if (hasNext) {
          const nextLevel = levels[levelIndex + 1];
          modalBtnPrimary.style.display = "inline-block";
          modalBtnPrimary.textContent = `Lanjut ke ${nextLevel.name} ▶`;
          modalBtnPrimary.onclick = () => loadLevel(levelIndex + 1);
        } else {
          modalBtnPrimary.style.display = "none";
        }

        modalBtnSecondary.textContent = "Tutup";
        modalBtnSecondary.onclick = () => overlay.classList.remove("show");

        overlay.classList.add("show");
        launchConfetti(16);
      }

      function launchConfetti(count) {
        const emojis = ["🎉", "🌟", "🔺", "⭐", "🔵"];
        const n = count || 24;
        for (let i = 0; i < n; i++) {
          setTimeout(() => {
            const c = document.createElement("div");
            c.className = "confetti";
            c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            c.style.left = Math.random() * 100 + "vw";
            c.style.animationDuration = 2 + Math.random() * 1.5 + "s";
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 3600);
          }, i * 60);
        }
      }

      window.addEventListener("resize", () =>
        requestAnimationFrame(drawConnections),
      );
      document
        .getElementById("resetLevelBtn")
        .addEventListener("click", resetCurrentLevel);
      document
        .getElementById("checkBtn")
        .addEventListener("click", checkAnswers);

      renderMap();
      loadLevel(0);
    </script>
  </body>
</html>
