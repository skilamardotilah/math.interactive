<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Petualangan Kanan dan Kiri</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Londrina+Solid&display=swap");
      :root {
        --ink: #17121f;
        --yellow: #ffd84d;
        --text: #4c3d38;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 18px;
        display: grid;
        place-items: center;
        background: #d0e7f7;
        color: var(--text);
        font-family: Nunito, Arial, sans-serif;
      }
      .shell {
        width: min(100%, 860px);
        background: white;
        border: 2px solid var(--ink);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 7px 7px 0 var(--ink);
      }
      header,
      footer {
        background: var(--ink);
        color: white;
        border-color: var(--yellow);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 13px 22px;
      }
      header {
        border-bottom: 4px solid var(--yellow);
      }
      footer {
        border-top: 4px solid var(--yellow);
        font-weight: 800;
        font-size: 0.85rem;
      }
      header .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header img {
        width: 49px;
        height: 49px;
        object-fit: contain;
      }
      h1 {
        font:
          400 clamp(1.4rem, 4vw, 1.85rem) "Londrina Solid",
          sans-serif;
        margin: 0;
        color: white;
      }
      .count {
        font-family: Fredoka, sans-serif;
        color: var(--yellow);
        white-space: nowrap;
      }
      main {
        padding: 24px clamp(14px, 4vw, 34px) 30px;
        background: linear-gradient(165deg, #ffe5ee, #fff7df 58%, #e8f8ea);
      }
      .panel {
        max-width: 750px;
        margin: auto;
      }
      h2 {
        font:
          600 clamp(1.4rem, 4vw, 1.85rem) Fredoka,
          sans-serif;
        color: #563b4d;
        text-align: center;
        margin: 0 0 8px;
      }
      .story {
        text-align: center;
        font-size: 1rem;
        font-weight: 800;
        margin: 0 auto 14px;
        max-width: 620px;
      }
      .clues {
        background: #f8dddd;
        border: 2px solid #efb7c8;
        border-radius: 18px;
        padding: 15px 18px;
        box-shadow: 0 5px 0 #f3ccda;
      }
      .clues strong {ssss
        color: #a44d6b;
      }
      .clues ul {
        padding-left: 22px;
        margin: 7px 0 0;
      }
      .clues li {
        margin: 5px 0;
        line-height: 1.4;
      }
      .board {
        margin-top: 18px;
        background: #fff;
        border: 3px solid #d69b70;
        border-radius: 23px;
        padding: 17px;
        box-shadow: 0 7px 0 #d7ad8e55;
      }
      .board-title {
        text-align: center;
        margin: 0 0 10px;
        font-weight: 900;
      }
      .direction {
        display: flex;
        justify-content: space-between;
        color: #7a5076;
        font:
          600 0.85rem Fredoka,
          sans-serif;
        margin: 0 3px 7px;
      }
      .slots,
      .tray {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 9px;
      }
      .slot {
        min-height: 105px;
        border: 2px dashed #b6a4ba;
        border-radius: 15px;
        background: #f8f4fa;
        display: grid;
        place-items: center;
        padding: 5px;
        cursor: pointer;
        color: #a390a7;
        font-weight: 900;
      }
      .slot.filled {
        border-style: solid;
        border-color: #9fcee1;
        background: #effaff;
      }
      .slot:focus-visible,
      .tile:focus-visible,
      button:focus-visible {
        outline: 3px solid #206baf;
        outline-offset: 3px;
      }
      .number {
        display: block;
        font:
          600 0.75rem Fredoka,
          sans-serif;
        color: #8c7992;
      }
      .tile {
        width: 100%;
        min-height: 88px;
        border: 2px solid #d6a457;
        background: #fff8df;
        border-radius: 14px;
        box-shadow: 0 4px 0 #b38654;
        cursor: grab;
        padding: 7px 3px;
        color: #513b31;
        font:
          700 clamp(0.7rem, 2vw, 0.94rem) Nunito,
          sans-serif;
        touch-action: manipulation;
      }
      .tile .picture svg {
        display: block;
        width: 54px;
        height: 63px;
        margin: auto;
      }
      .tile .picture {
        display: block;
        font-size: clamp(1.7rem, 5vw, 2.55rem);
        line-height: 1.2;
        margin-bottom: 4px;
      }
      .tile.selected {
        outline: 4px solid #2b84ba;
        outline-offset: 2px;
      }
      .tile:active {
        cursor: grabbing;
        transform: translateY(2px);
      }
      .tray {
        margin-top: 12px;
      }
      .tray-cell {
        min-height: 91px;
      }
      .help {
        text-align: center;
        margin: 14px 0 0;
        font-size: 0.85rem;
        font-weight: 800;
        color: #735e6a;
      }
      .actions {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 18px;
        flex-wrap: wrap;
      }
      button.action {
        border: 2px solid var(--ink);
        border-radius: 999px;
        padding: 11px 23px;
        background: var(--yellow);
        font:
          700 1rem Fredoka,
          sans-serif;
        color: var(--ink);
        cursor: pointer;
        box-shadow: 0 4px 0 var(--ink);
      }
      button.action.secondary {
        background: #fff;
      }
      button.action:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 var(--ink);
      }
      button.action:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .feedback {
        min-height: 27px;
        text-align: center;
        margin: 12px 0 0;
        font-weight: 900;
        color: #a44d6b;
      }
      .feedback.good {
        color: #177a50;
      }
      .end {
        text-align: center;
        background: #fff;
        border: 3px solid #efb7c8;
        border-radius: 22px;
        padding: 30px 15px;
        margin: 20px auto;
        max-width: 520px;
      }
      .end p {
        font-size: 1.13rem;
        font-weight: 800;
      }
      @media (max-width: 540px) {
        body {
          padding: 9px;
        }
        .shell {
          box-shadow: 4px 4px 0 var(--ink);
        }
        header {
          padding: 10px 13px;
        }
        header img {
          width: 38px;
          height: 38px;
        }
        main {
          padding: 18px 12px 25px;
        }
        .clues {
          padding: 12px;
        }
        .board {
          padding: 10px;
        }
        .slots,
        .tray {
          gap: 5px;
        }
        .slot {
          min-height: 85px;
        }
        .tile {
          min-height: 78px;
        }
        .tray-cell {
          min-height: 82px;
        }
        .tile .picture {
          font-size: 1.7rem;
        }
        .tile {
          font-size: 0.68rem;
          overflow-wrap: anywhere;
        }
        footer {
          padding: 11px 14px;
        }
      }
    </style>
  </head>

          story: "Soal: Bantu Budi menata buku di rak.",
          items: [
            ["gambar", "🎨", "Buku Gambar"],
            ["matematika", "📐", "Matematika"],
            ["ipa", "🔬", "IPA"],
            ["cerita", "📖", "Buku Cerita"],
          ],
          clues: [
            "IPA tepat di sebelah kiri Buku Cerita.",
            "Buku Gambar berada di ujung kiri.",
            "Matematika tepat di sebelah kanan Buku Gambar.",
          ],
          order: ["gambar", "matematika", "ipa", "cerita"],
        },
        {
          title: "Antre Membeli Es Krim",
          story:
            "Soal: Bantu empat anak yang sedang berbaris. Susun dari kiri ke kanan.",
          items: [
            ["andi", "👦🏻", "Andi"],
            ["dito", "👦🏽", "Dito"],
            ["rani", "👧🏻", "Rani"],
            ["siti", "👧🏽", "Siti"],
          ],
          clues: [
            "Siti berada di ujung kanan.",
            "Dito tepat di sebelah kanan Andi.",
            "Rani tepat di sebelah kiri Siti.",
          ],
          order: ["andi", "dito", "rani", "siti"],
        },
        {
          title: "Menata Buah",
          story: "Soal: Bantu Ibu menata buah di meja.",
          items: [
            ["pisang", "🍌", "Pisang"],
            ["apel", "🍎", "Apel"],
            ["jeruk", "🍊", "Jeruk"],
            ["stroberi", "🍓", "Stroberi"],
          ],
          clues: [
            "Jeruk tepat di sebelah kanan apel.",
            "Stroberi berada di ujung kanan.",
            "Pisang tepat di sebelah kiri apel.",
          ],
          order: ["pisang", "apel", "jeruk", "stroberi"],
        },
        {
          title: "Menyusun Kendaraan",
          story: "Soal: Bantu Doni menyusun mainan kendaraan.",
          items: [
            ["motor", "🏍️", "Motor"],
            ["sepeda", "🚲", "Sepeda"],
            ["mobil", "🚗", "Mobil"],
            ["bus", "🚌", "Bus"],
          ],
          clues: [
            "Mobil tepat di sebelah kiri bus.",
            "Motor berada di ujung kiri.",
            "Sepeda berada di antara motor dan mobil.",
          ],
          order: ["motor", "sepeda", "mobil", "bus"],
        },
      ];
      let index = 0,
        points = 0,
        attempted = false,
        locked = false,
        selected = null,
        positions = [null, null, null, null],
        tray = [];
      const game = document.getElementById("game"),
        score = document.getElementById("score"),
        count = document.getElementById("count");
      function shuffled(a) {
        let b = [...a];
        for (let i = b.length - 1; i > 0; i--) {
          let j = Math.floor(Math.random() * (i + 1));
          [b[i], b[j]] = [b[j], b[i]];
        }
        return b;
      }
      function item(id) {
        return questions[index].items.find((x) => x[0] === id);
      }
      function bookArt(id) {
        const covers = {
          gambar: ["#f6a63e", "BUKU GAMBAR", "✿"],
          matematika: ["#3987cc", "MATEMATIKA", "1+2"],
          ipa: ["#3ca879", "BUKU IPA", "⚗"],
          cerita: ["#a879cf", "BUKU CERITA", "★"],
        };
        const [color, title, mark] = covers[id];
        return `<svg viewBox="0 0 70 82" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M13 4H62V73H13Q5 73 5 66V12Q5 4 13 4Z" fill="${color}" stroke="#44334b" stroke-width="2"/><path d="M13 5V73M12 68H62" stroke="#44334b" stroke-width="2"/><path d="M13 68H61V76H13Q8 76 8 72Q8 68 13 68Z" fill="#fff9e9" stroke="#44334b" stroke-width="2"/><text x="37" y="27" fill="white" text-anchor="middle" font-size="${title.length > 10 ? 6 : 8}" font-family="Arial" font-weight="bold">${title}</text><circle cx="37" cy="46" r="14" fill="white" opacity=".9"/><text x="37" y="51" text-anchor="middle" font-size="${mark.length > 1 ? 13 : 20}" font-family="Arial" font-weight="bold" fill="#44334b">${mark}</text></svg>`;
      }
      function tile(id) {
        let data = item(id),
          b = document.createElement("button");
        b.type = "button";
        b.className = "tile" + (selected === id ? " selected" : "");
        b.dataset.id = id;
        b.draggable = !locked;
        b.setAttribute("aria-label", data[2]);
        b.innerHTML = `<span class="picture" aria-hidden="true">${index === 1 ? bookArt(id) : data[1]}</span><span>${data[2]}</span>`;
        b.onclick = () => {
          if (locked) return;
          let slot = positions.indexOf(id);
          if (slot >= 0) {
            positions[slot] = null;
            selected = null;
          } else selected = selected === id ? null : id;
          drawPieces();
        };
        b.ondragstart = (e) => {
          if (locked) {
            e.preventDefault();
            return;
          }
          e.dataTransfer.setData("text/plain", id);
          e.dataTransfer.effectAllowed = "move";
        };
        return b;
      }
      function drawPieces() {
        const slots = document.getElementById("slots"),
          bank = document.getElementById("tray");
        slots.replaceChildren();
        bank.replaceChildren();
        positions.forEach((id, i) => {
          let box = document.createElement("div");
          box.className = "slot" + (id ? " filled" : "");
          box.setAttribute("role", "button");
          box.tabIndex = 0;
          box.setAttribute(
            "aria-label",
            `Tempat ${i + 1}${id ? ", " + item(id)[2] : ", kosong"}`,
          );
          box.onclick = () => place(i);
          box.onkeydown = (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              place(i);
            }
          };
          box.ondragover = (e) => e.preventDefault();
          box.ondrop = (e) => {
            e.preventDefault();
            let dragged = e.dataTransfer.getData("text/plain");
            if (dragged && item(dragged)) place(i, dragged);
          };
          if (id) box.append(tile(id));
          else box.innerHTML = `<span class="number">${i + 1}</span>`;
          slots.append(box);
        });
        tray.forEach((id) => {
          let cell = document.createElement("div");
          cell.className = "tray-cell";
          if (!positions.includes(id)) cell.append(tile(id));
          bank.append(cell);
        });
      }
      function place(i, dragged) {
        if (locked) return;
        let id = dragged || selected;
        if (!id) {
          if (positions[i]) {
            positions[i] = null;
            drawPieces();
          }
          return;
        }
        let old = positions.indexOf(id);
        if (old >= 0) positions[old] = null;
        let displaced = positions[i];
        positions[i] = id;
        if (displaced && old >= 0) positions[old] = displaced;
        selected = null;
        document.getElementById("feedback").textContent = "";
        drawPieces();
      }
      function render() {
        let q = questions[index];
        count.textContent = `Soal ${index + 1} dari 5`;
        score.textContent = `Skor: ${points} / 100`;
        attempted = false;
        locked = false;
        selected = null;
        positions = [null, null, null, null];
        tray = shuffled(q.items.map((x) => x[0]));
        if (tray.every((v, i) => v === q.order[i]))
          [tray[0], tray[1]] = [tray[1], tray[0]];
        game.innerHTML = `<p class="story">${q.story}</p><section class="clues"><strong>Petunjuk:</strong><ul>${q.clues.map((c) => `<li>${c}</li>`).join("")}</ul></section><section class="board"><p class="board-title">Jawaban:</p><div class="direction"><span>⬅ KIRI</span><span>KANAN ➡</span></div><div id="slots" class="slots"></div><p class="help">Letakkan benda pada tempat yang tepat. </p><div id="tray" class="tray"></div></section><div class="actions"><button id="check" class="action">Periksa Jawaban</button><button id="next" class="action" hidden>${index === 4 ? "Lihat Hasil" : "Soal Berikutnya →"}</button></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p>`;
        document.getElementById("check").onclick = check;
        document.getElementById("next").onclick = () => {
          index++;
          if (index < questions.length) render();
          else end();
        };
        drawPieces();
      }
      function check() {
        let feedback = document.getElementById("feedback");
        if (positions.some((x) => !x)) {
          feedback.textContent = "Isi keempat tempat dahulu, ya!";
          return;
        }
        if (positions.every((x, i) => x === questions[index].order[i])) {
          locked = true;
          if (!attempted) points += 20;
          score.textContent = `Skor: ${points} / 100`;
          feedback.classList.add("good");
          feedback.textContent = "Hebat! Susunannya sudah benar! 🎉";
          document.getElementById("check").hidden = true;
          document.getElementById("next").hidden = false;
          drawPieces();
        } else {
          attempted = true;
          feedback.textContent =
            "Belum tepat. Baca petunjuknya lagi, lalu coba susun ulang!";
        }
      }
      function end() {
        count.textContent = "Selesai";
        game.innerHTML = `<div class="end"><div style="font-size:3.4rem">🏆</div><h2>Hebat, semua selesai!</h2><p>Kamu sudah berlatih menentukan kanan dan kiri.</p><p>Skor akhir: ${points} / 100</p><button id="restart" class="action">Main Lagi</button></div>`;
        document.getElementById("restart").onclick = () => {
          index = 0;
          points = 0;
          render();
        };
      }
      render();
    </script>
  </body>
</html>
